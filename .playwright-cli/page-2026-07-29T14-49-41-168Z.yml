                      - text: ", Fair Value Measurements and Disclosures, establishes a fair value hierarchy that requires the Company to maximize the use of observable inputs and minimize the use of unobservable inputs when measuring fair value. A financial instrument’s categorization within the hierarchy is based on the lowest level of input that is significant to the fair value measurement."
                      - generic [ref=f16e5368] [cursor=pointer]: ASC 820
                      - text: "establishes three levels of inputs that may be used to measure fair value as follows:"
                    - generic [ref=f16e5370]: Level 1 inputs are quoted prices (unadjusted) in active markets for identical assets or liabilities.
                    - generic [ref=f16e5372]: Level 2 inputs include inputs other than Level 1 that are observable, either directly or indirectly, such as quoted prices in active markets for similar assets and liabilities, quoted prices for identical or similar assets or liabilities in markets that are not active, or other inputs that are observable or can be corroborated by observable market data for substantially the full term of assets or liabilities.
                    - generic [ref=f16e5374]: Level 3 inputs are unobservable inputs in which little or no market data exists, therefore requiring an entity to develop its own assumptions.
