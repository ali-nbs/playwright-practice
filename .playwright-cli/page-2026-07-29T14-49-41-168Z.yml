                  - generic [ref=f16e12172]: Adjusted working capital has increased by $219.4 million, or 12.4%, for the six months ended June 30, 2026, driven by an increase of $151.0 million in net receivables and an increase of $148.5 million in net inventory, partially offset by an increase in accounts payable of $80.1 million. These amounts include the effects of acquisitions and foreign currency translation. Accounts receivable increased compared to the prior year as a result of higher revenue generation during the period. Inventories increased to support higher volume deliveries expected over the next several quarters, as supported by the order book and in line with historical seasonality. These factors also led to an increase in accounts payable.
                  - generic [ref=f16e12175]: Investing Activities
                  - generic [ref=f16e12177]: "Cash flow from investing activities is derived from cash outflows for capital expenditures and acquisitions. The majority of the activity in investing activities was comprised of the following:"
                  - generic [ref=f16e12179]: "•Capital spending: Capital expenditures decreased $1.5 million during the six months ended June 30, 2026, compared to the six months ended June 30, 2025, in line with our planned capital expenditures for the year."
                  - generic [ref=f16e12181]: "•Acquisitions: During the six months ended June 30, 2026, we deployed approximately $0.7 million to acquire one business within the Engineered Products segment. In comparison, during the six months ended June 30, 2025, we deployed approximately $658.5 million, net to acquire three business within the Pumps & Process Solutions segment. See Note 3 - Acquisitions in the condensed consolidated financial statements in Item 1 of this Form 10-Q for further details."
                  - generic [ref=f16e12182]: "38"
                  - separator [ref=f16e12185]
                  - link "Table of Contents" [ref=f16e12189] [cursor=pointer]:
                    - /url: "#i4b9d86d2437d4e45a317afdbcb7d6559_4"
                  - generic [ref=f16e12191]: We anticipate that capital expenditures and any additional acquisitions we make through the remainder of 2026 will be funded from available cash and internally generated funds and, if necessary, through the issuance of commercial paper, or by accessing the public debt or equity markets. We estimate capital expenditures in 2026 to range from $190.0 million to $210.0 million.
                  - generic [ref=f16e12193]: Financing Activities
                  - generic [ref=f16e12195]: "Cash flow from financing activities generally relates to the use of cash for payment of dividends, purchases of our common stock, and cash payments related to the settlement of tax obligations for exercises of share-based awards. The majority of financing activity was attributed to the following:"
                  - generic [ref=f16e12197]: "•Repurchase of common stock: During the six months ended June 30, 2026, the Company repurchased a total of 250,000 shares for $53.9 million. During the six months ended June 30, 2025, the Company repurchased a total of 200,000 shares for $40.7 million. See Note 17 - Stockholders' Equity in the condensed consolidated financial statements in Item 1 of this Form 10-Q for further details."
                  - generic [ref=f16e12199]: "•Dividend payments: Total dividend payments to common shareholders were $140.4 million during the six months ended June 30, 2026, as compared to $142.0 million during the same period in 2025. Our dividends paid per common share increased 1.0% to $1.04 during the six months ended June 30, 2026 compared to $1.03 during the same period in 2025."
                  - generic [ref=f16e12201]: Liquidity and Capital Resources
                  - generic [ref=f16e12203]: Free Cash Flow
                  - generic [ref=f16e12206]: In addition to measuring our cash flow generation and usage based upon the operating, investing and financing classifications included in the condensed consolidated statements of cash flows, we also measure free cash flow (a non-GAAP measure) which represents net cash provided by operating activities minus capital expenditures. Free cash flow as a percentage of revenue equals free cash flow divided by revenue. Free cash flow as a percentage of earnings from continuing operations equals free cash flow divided by earnings from continuing operations. We believe that free cash flow is an important measure of liquidity because it provides management and investors a measurement of cash generated from operations that may be available for mandatory payment obligations and investment opportunities, such as funding acquisitions, paying dividends, repaying debt and repurchasing our common stock.
