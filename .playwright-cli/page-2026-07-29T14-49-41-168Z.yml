                  - generic [ref=f16e6247]:
                    - generic [ref=f16e6248]: 16. Segment Information
                    - generic [ref=f16e6250]: "The Company categorizes its operating companies into five reportable segments: Engineered Products, Clean Energy & Fueling, Imaging & Identification, Pumps & Process Solutions, and Climate & Sustainability Technologies. The Company's businesses are structured around similar business models, go-to market strategies, manufacturing practices and product categories which increases management efficiency and better aligns Dover's operations with its strategic initiatives and capital allocation priorities, and provides greater transparency about performance. Operating segments are defined as the components of an enterprise for which separate financial information is available, that engage in business activities from which they may recognize revenues and incur expenses, and that are regularly evaluated by the entity's chief operating decision maker or decision-making group, which is composed of Dover's Group Executive Committee, in making resource allocation decisions and evaluating performance."
                    - generic [ref=f16e6253]: "The five reportable segments are as follows:"
                    - generic [ref=f16e6256]: •Engineered Products segment provides a wide range of equipment, components, software, solutions and services to the vehicle aftermarket, aerospace and defense, industrial winch and hoist, precision soldering and fluid dispensing end-markets.
                    - generic [ref=f16e6258]: •Clean Energy & Fueling segment provides components, equipment, software solutions and services enabling safe and reliable storage, transport, dispensing, and remote monitoring of traditional and clean fuels (including liquefied natural gas, hydrogen, and electric vehicle charging), cryogenic gases, and other hazardous substances along the supply chain, and safe and efficient operation of convenience retail, retail fueling and vehicle wash establishments.
                    - generic [ref=f16e6260]: •Imaging & Identification segment supplies precision marking and coding, product traceability, brand protection and digital textile printing equipment, as well as related consumables, software and services to the global packaged and consumer goods, pharmaceutical, industrial manufacturing, textile and other end-markets.
                    - generic [ref=f16e6262]: •Pumps & Process Solutions segment manufactures specialty pumps and flow meters, fluid transfer connectors, highly engineered precision components, instruments and digital controls for rotating and reciprocating machines, polymer processing equipment, measurement, inspection, and control technologies, serving single-use biopharmaceutical production, diversified industrial manufacturing applications, chemical production, plastics and polymer processing, midstream and downstream oil and gas, clean energy markets, thermal management, wire and cable, food and beverage, semiconductor production and medical applications and other end-markets.
                    - generic [ref=f16e6264]: •Climate & Sustainability Technologies segment is a provider of innovative and energy-efficient equipment, components, solutions, services and parts for the commercial refrigeration, heating and cooling and beverage can-making equipment end-markets.
                    - generic [ref=f16e6266]: Management uses segment earnings to evaluate segment performance and allocate resources. Segment earnings is defined as earnings before purchase accounting expenses, restructuring and other costs (benefits), (gain) loss on dispositions, corporate expenses/other, interest expense, interest income and provision for income taxes.
