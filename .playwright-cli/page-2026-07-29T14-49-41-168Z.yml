                  - generic [ref=f16e11157]: Restructuring and Other Costs (Benefits)
                  - generic [ref=f16e11159]: Restructuring and other costs are not presented in our segment earnings because these costs are excluded from the segment operating performance measure reviewed by management. During the three and six months ended June 30, 2026, we incurred restructuring charges of $17.0 million and $47.2 million and other costs, net of $7.6 million and $14.2 million, respectively. Restructuring charges for the three and six months ended June 30, 2026 were primarily related to headcount reductions and exit costs in the Climate & Sustainability Technologies, Pumps & Process Solutions, Clean Energy & Fueling and Engineered Products segments. These restructuring programs were initiated in 2025 and 2026 and the Company will continue to make proactive adjustments to its cost structure to align with current demand trends. Other costs, net of $7.6 million and $14.2 million for the three and six months ended June 30, 2026 include $4.3 million and $7.3 million, respectively, in costs associated with a footprint reduction in our Climate & Sustainability Technologies segment. These restructuring and other charges were recorded in cost of goods and services and selling, general and administrative expenses in the condensed consolidated statements of earnings. Additional programs beyond the scope of the announced programs may be implemented during 2026 with related restructuring and other cost charges.
