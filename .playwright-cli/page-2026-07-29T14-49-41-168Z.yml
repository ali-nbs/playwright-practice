                    - generic [ref=f16e5188]: For a cash flow hedge, the change in estimated fair value of a hedging instrument is recorded in accumulated other comprehensive earnings (loss), net of tax as a separate component of the condensed consolidated statements of stockholders' equity and is reclassified into revenues or cost of goods and services in the condensed consolidated statements of earnings during the period in which the hedged transaction is settled. The amount of gains or losses from hedging activity recorded in earnings is not significant, and the amount of unrealized gains and losses from cash flow hedges that are expected to be reclassified to earnings in the next twelve months is not significant; therefore, additional tabular disclosures are not presented. There are no amounts excluded from the assessment of hedge effectiveness, and the Company's derivative instruments that are subject to credit risk contingent features were not significant.
                    - generic [ref=f16e5190]: The Company is exposed to credit loss in the event of nonperformance by counterparties to the financial instrument contracts held by the Company; however, nonperformance by these counterparties is considered unlikely as the Company’s policy is to contract with highly-rated, diversified counterparties.
                    - generic [ref=f16e5192]: Net Investment Hedges
                    - generic [ref=f16e5194]: The Company designates certain non-derivative instruments as net investment hedges to hedge the net assets of certain foreign subsidiaries which are exposed to volatility in foreign currency exchange rates. The Company has designated the €600,000, €500,000, and €550,000 of euro-denominated notes issued November 9, 2016, November 4, 2019, and November 12, 2025, respectively, as hedges of its net investment in euro-denominated operations. In May of 2025, the Company entered into a €550,000 currency forward contract designated as a net investment hedge for the duration of the contract. The forward contract settled in December of 2025.
                    - generic [ref=f16e5197]: Changes in the value of the euro-denominated debt and currency forward contract, which are calculated using the spot method, are recognized in foreign currency translation adjustments within other comprehensive earnings (loss) of the condensed consolidated statements of comprehensive earnings. These changes in fair value of the euro-denominated debt and currency forward contract resulting from exchange rate differences are offset by changes in the net investment due to the high degree of effectiveness between the hedging instruments and the exposure being hedged.
