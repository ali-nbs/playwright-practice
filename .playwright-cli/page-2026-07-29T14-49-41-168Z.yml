                    - generic [ref=f16e9770]: growth of 0.1%. Organic revenue gr
                    - text: owth was driven by pricing actions and strong demand in our above and below-ground retail fueling and clean energy components businesses. Customer pricing favorably impacted revenue by approximately 2.5% and by approximately 1.5% in the prior year comparable period.
                  - generic [ref=f16e9772]: Clean Energy & Fueling segment earnings increased $34.2 million or 17.7%, for the six months ended June 30, 2026. The increase was primarily driven by volume growth, productivity actions and favorable price versus cost dynamics. Segment earnings margin increased to 19.8% from 18.6% in the prior year comparable period.
