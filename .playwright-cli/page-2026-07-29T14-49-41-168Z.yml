                  - generic [ref=f16e9754]: Second Quarter 2026 Compared to the Second Quarter 2025
                  - generic [ref=f16e9756]: Clean Energy & Fueling revenue for the second quarter of 2026 increased $48.9 million, or 8.9%, as compared to the second quarter of 2025, driven by organic growth of 8.6%, a favorable foreign currency translation impact of 0.2% and acquisition-related growth of 0.1%. Acquisition-related growth was driven by the acquisition of Site IQ, LLC in the third quarter of 2025. Customer pricing favorably impacted revenue in the second quarter of 2026 by approximately 2.9% and by 1.7% in the prior year comparable quarter.
                  - generic [ref=f16e9759]: The organic revenue growth was primarily driven by pricing actions and favorable demand trends in our above and below-ground retail fueling and clean energy components businesses. We expect positive demand trends to continue in the second half of the year driven by a favorable demand outlook across major end markets.
                  - generic [ref=f16e9762]: Clean Energy & Fueling segment earnings increased $20.8 million, or 19.3%, over the prior year comparable quarter. The increase was primarily driven by volume growth, productivity actions and favorable price versus cost dynamics. Segment earnings margin increased to 21.6% from 19.7% as compared to prior year comparable quarter.
                  - generic [ref=f16e9764]: Overall bookings increased 14.4% as compared to the prior year comparable quarter. The bookings increase was primarily driven by demand in clean energy components and above and below-ground retail fueling. Segment book-to-bill was 1.01.
