                  - generic [ref=f16e12012]: FINANCIAL CONDITION
                  - generic [ref=f16e12014]: We assess our liquidity in terms of our ability to generate cash to fund our operating, investing and financing activities. Significant factors affecting liquidity are cash flows generated from operating activities, capital expenditures, acquisitions, dispositions, dividends, repurchase of outstanding shares, adequacy of available commercial paper and bank lines of credit and the ability to attract long-term capital with satisfactory terms. We generate substantial cash from the operations of our businesses and remain in a strong financial position, with sufficient liquidity available for upcoming debt maturities and for reinvestment in existing businesses and strategic acquisitions.
