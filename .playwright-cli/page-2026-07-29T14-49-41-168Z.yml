                  - generic [ref=f16e10819]: Second Quarter 2026 Compared to the Second Quarter 2025
                  - generic [ref=f16e10822]:
                    - text: Climate & Sustainability Technologies revenue increased $38.9 million, or 9.4%, as compared to the second quarter of 2025, driven
                    - generic [ref=f16e10823]: by organic revenue growth
                    - text: of 8.3% and a favorable impact from foreign currency translation of 1.1%. Customer pricing favorably impacted revenue in the second quarter of 2026 by approximately 2.6% and by approximately 0.2% in the prior year comparable quarter.
                  - generic [ref=f16e10825]:
                    - generic [ref=f16e10826]: The organic revenue growth was primarily driven by continued strong demand in CO
                    - text: 2 refrigerant systems and growth in refrigerated door case volumes, as well as accelerating demand for heat exchangers used in data center cooling and other applications. We expect organic growth trends to remain constructive in the second half of the year.
                  - generic [ref=f16e10828]: Climate & Sustainability Technologies segment earnings decreased $1.4 million, or 1.9%, over the prior year comparable quarter. The decrease in segment earnings was primarily due to costs relating to the timing of footprint consolidation projects and production ramp costs in retail refrigeration, partially offset by the favorable impact from higher volumes. Segment earnings margin decreased to 16.7% from 18.6% in the prior year comparable quarter.
                  - generic [ref=f16e10830]: Bookings in the second quarter of 2026 increased 45.8% from the prior year comparable quarter. The bookings increase was primarily driven by demand strength in retail refrigeration and heat exchangers, including longer lead-time orders. Segment book-to-bill was 1.23.
