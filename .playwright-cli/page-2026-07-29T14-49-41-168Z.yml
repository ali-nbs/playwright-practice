                  - generic [ref=f16e10839]: Six Months Ended June 30, 2026 Compared to the Six Months Ended June 30, 2025
                  - generic [ref=f16e10842]:
                    - text: Climate & Sustainability Technologies segment revenue increased $102.1 million, or 13.4%, compared to the six months ended June 30, 2025, reflect
                    - generic [ref=f16e10843]: ing organic revenue growth
                    - text: of 11.5%, and a favorable foreign currency translation impact of 1.9%. The organic revenue growth for the six months ended June 30, 2026 was driven by favorable demand trends in retail refrigeration and heat exchanger applications. Customer pricing favorably impacted revenue by approximately 2.3% and 0.2% in the prior year comparable period.
                  - generic [ref=f16e10845]: Climate & Sustainability Technologies segment earnings increased $10.4 million, or 8.1%, for the six months ended June 30, 2026, as compared to the prior year comparable period. The earnings increase was primarily driven by the favorable impact from higher volumes and the favorable mix impact from CO2 refrigerant systems growth in retail refrigeration, partially offset by costs relating to the timing of footprint consolidation projects and production ramp costs in retail refrigeration. Segment earnings margin decreased to 16.1% from 16.9% in the prior year comparable period.
