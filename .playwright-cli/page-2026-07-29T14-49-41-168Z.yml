                  - generic [ref=f16e11503]: Restructuring and other costs for the three and six months ended June 30, 2025 include restructuring charges of $13.5 million and $21.8 million and other costs, net of $9.7 million and $10.8 million. Restructuring charges for the three and six months ended June 30, 2025 were primarily related to exit costs and headcount reductions in the Climate & Sustainability Technologies, Pumps & Process Solutions and Clean Energy & Fueling segments. These restructuring programs were initiated in 2024 and 2025 and were undertaken in light of current market conditions. Other costs, net of $9.7 million and $10.8 million for the three and six months ended June 30, 2025 primarily relate to $4.0 million in costs associated with a product line exit in our Climate & Sustainability Technologies segment. These restructuring and other charges were recorded in cost of goods and services and selling, general and administrative expenses in the condensed consolidated statement of earnings.
