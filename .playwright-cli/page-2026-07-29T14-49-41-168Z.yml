                    - generic [ref=f16e3524]: On June 18, 2025, the Company acquired 100% of the equity interest in ipp Pump Products GmbH ("ipp"), a specialized manufacturer of sanitary pump technologies, including hygienic lobe, progressive, and other processing equipment for $16,523, net of cash acquired and inclusive of measurement period adjustments. ipp's products expand the Company's capabilities in critical hygienic applications within the Pumps & Process Solutions segment. In connection with this acquisition, the Company recorded goodwill of $10,038 and intangible assets of $5,648, related to customer intangibles.
