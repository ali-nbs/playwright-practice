                  - generic [ref=f16e10131]: Pumps & Process Solutions
                  - generic [ref=f16e10133]: Our Pumps & Process Solutions segment manufactures specialty pumps and flow meters, fluid transfer connectors, highly engineered precision components, instruments and digital controls for rotating and reciprocating machines, polymer processing equipment, measurement, inspection, and control technologies, serving single-use biopharmaceutical production, diversified industrial manufacturing applications, chemical production, plastics and polymer processing, midstream and downstream oil and gas, clean energy markets, thermal management, wire and cable, food and beverage, semiconductor production and medical applications and other end-markets.
