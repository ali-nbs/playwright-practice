                  - generic [ref=f16e8986]: Revenue
                  - generic [ref=f16e8988]: Revenue for the three months ended June 30, 2026 increased $140.4 million, or 6.9%, from the prior year comparable quarter. The increase in revenue was driven by organic revenue growth of 4.8%, with organic growth across all five segments, acquisition-related growth of 1.2%, and a favorable impact from foreign currency translation of 0.9%. Customer pricing favorably impacted revenue by approximately 2.2% in the second quarter of 2026 and by 1.9% in the prior year comparable quarter.
                  - generic [ref=f16e8991]: Revenue for the six months ended June 30, 2026 increased $328.0 million, or 8.4%, from the prior year comparable period. The increase in revenue was driven by organic revenue growth of 5.0%, primarily in our Clean Energy & Fueling and Climate & Sustainability Technologies segments, a favorable impact from foreign currency translation of 1.9%, and acquisition-related growth of 1.5%, primarily in our Pumps & Process Solutions segment. Customer pricing favorably impacted revenue by approximately 2.0% for the six months ended June 30, 2026 and by 1.6% in the prior year comparable period.
                  - generic [ref=f16e8994]: Gross Profit
                  - generic [ref=f16e8996]: Gross profit for the three months ended June 30, 2026 increased $62.3 million, or 7.6%, and gross profit margin increased 30 basis points to 40.2%, versus the prior year comparable quarter. The gross profit margin increase was primarily driven by favorable price versus cost dynamics, operating leverage from volume growth and benefits from restructuring actions.
                  - generic [ref=f16e8998]: Gross profit for the six months ended June 30, 2026 increased $115.0 million, or 7.4%, and gross profit margin decreased by 30 basis points to 39.6%, from the prior year comparable period. The gross profit margin decrease was due to an unfavorable portfolio mix, partially offset by productivity initiatives and benefits from restructuring actions.
                  - generic [ref=f16e9000]: Selling, General and Administrative Expenses
                  - generic [ref=f16e9002]: Selling, general and administrative expenses for the three months ended June 30, 2026 increased $25.2 million, or 5.4%, from the prior year comparable quarter, primarily due to increases in employee compensation and benefits. As a percentage of revenue, selling, general and administrative expenses decreased 30 basis points as compared to the prior year comparable quarter to 22.3%.
                  - generic [ref=f16e9004]: Selling, general and administrative expenses for the six months ended June 30, 2026 increased $68.2 million, or 7.5%, from the prior year comparable period, primarily due to increased employee compensation and benefits. Selling, general and administrative expenses as a percentage of revenue decreased 20 basis points as compared to the prior year comparable period to 23.1%.
                  - generic [ref=f16e9006]: Research and development costs, including qualifying engineering costs, are expensed when incurred and amounted to $40.4 million and $40.8 million for the three months ended June 30, 2026 and 2025, respectively, and $80.0 million and $78.3 million for the six months ended June 30, 2026 and 2025, respectively. The costs as a percentage of revenue were 1.8% and 1.9% for the three and six months ended June 30, 2026, respectively, and 2.0% for both the three and six months ended June 30, 2025.
                  - generic [ref=f16e9008]: Non-Operating Items
                  - generic [ref=f16e9010]: Interest Expense, net
                  - generic [ref=f16e9012]: For the three and six months ended June 30, 2026, interest expense, net of interest income, increased $5.7 million, or 64.1%, to $14.5 million and $13.8 million, or 85.1%, to $30.0 million, respectively, compared to the prior year comparable period. The increases were primarily due to lower interest income from redemption of highly liquid short-term investments and higher interest expense incurred from the issuance of the €550.0 million 3.50% euro-denominated notes in the fourth quarter of 2025.
                  - generic [ref=f16e9014]: Income Taxes
                  - generic [ref=f16e9016]: The effective tax rates for the three months ended June 30, 2026 and 2025 were 19.4% and 20.4%, respectively. The decrease in the effective tax rate for the three months ended June 30, 2026 relative to the prior year comparable quarter was primarily driven by an internal reorganization in 2026.
                  - generic [ref=f16e9018]: "27"
                  - separator [ref=f16e9021]
                  - link "Table of Contents" [ref=f16e9025] [cursor=pointer]:
                    - /url: "#i4b9d86d2437d4e45a317afdbcb7d6559_4"
                  - generic [ref=f16e9026]: The effective tax rates for the six months ended June 30, 2026 and 2025 were 19.7% and 19.8%, respectively.
                  - generic [ref=f16e9028]: On July 4, 2025, the One Big Beautiful Bill was enacted into law, introducing changes to the U.S. tax code, including making permanent certain provisions originally enacted under the Tax Cuts and Jobs Act, such as 100% bonus depreciation and the immediate expensing of domestic research and development costs. The changes do not have a material impact to our condensed consolidated financial statements.
                  - generic [ref=f16e9031]: The Company is continuing to monitor the changes in tax laws resulting from the Organization for Economic Cooperation and Development’s multi-jurisdictional plan of action to address base erosion and profit shifting. We do not expect this to have a material impact on our effective tax rate.
                  - generic [ref=f16e9033]: Earnings from Continuing Operations
                  - generic [ref=f16e9035]: Earnings from continuing operations for the three months ended June 30, 2026 increased 11.6% to $312.5 million, or $2.31 diluted earnings per share from continuing operations, compared to $280.1 million, or $2.03 diluted earnings per share from continuing operations in the prior year comparable quarter. The increase in earnings from continuing operations was driven by higher operating earnings primarily as a result of strong revenue growth, favorable price versus cost dynamics, and benefits from restructuring actions, partially offset by an increase in employee compensation and benefits expense.
                  - generic [ref=f16e9037]: Earnings from continuing operations for the six months ended June 30, 2026 increased 6.1% to $551.3 million, or $4.06 diluted earnings per share from continuing operations, from $519.4 million, or $3.76 diluted earnings per share from continuing operations, in the prior year comparable period. The increase in earnings from continuing operations is driven by strong revenue growth in the current period partially offset by unfavorable portfolio mix, and increases in employee compensation and benefits expense and interest expense, net.
                  - generic [ref=f16e9038]: "28"
