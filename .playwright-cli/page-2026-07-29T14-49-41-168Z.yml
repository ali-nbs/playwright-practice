                  - generic [ref=f16e12668]: (2) On November 10, 2025, the Company entered into a $500.0 million accelerated share repurchase agreement (the "ASR Agreement") with JPMorgan Chase Bank, N.A. ("JPMorgan") to repurchase its shares in an accelerated share repurchase program (the "ASR Program"). The Company funded the ASR Program with cash on hand. Under the terms of the ASR Agreement, the Company paid JPMorgan $500.0 million on November 12, 2025, and on that date received initial delivery of 2,334,010 shares, representing a substantial majority of the shares expected to be retired over the course of the ASR Program. In April 2026, JPMorgan delivered 153,652 additional shares which completed the ASR Program, totaling 2,487,662 repurchased shares under the ASR Agreement. The total number of shares repurchased under the ASR Agreement was based on the average of the daily volume-weighted average share price of Dover's common stock during the calculation period of the ASR Program, less a discount, which was $200.99 over the term of the ASR Program.
