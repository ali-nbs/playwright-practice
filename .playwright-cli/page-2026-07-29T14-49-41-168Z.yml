                  - generic [ref=f16e9047]: SEGMENT RESULTS OF OPERATIONS
                  - generic [ref=f16e9049]: The summary that follows provides a discussion of the results of operations of each of our five reportable operating segments (Engineered Products, Clean Energy & Fueling, Imaging & Identification, Pumps & Process Solutions, and Climate & Sustainability Technologies). Each of these segments is comprised of various product and service offerings that serve multiple markets. We evaluate our operating segment performance based on segment earnings as defined in Note 16 - Segment Information in the condensed consolidated financial statements in Item 1 of this Form 10-Q.
                  - generic [ref=f16e9051]: We report organic revenue growth (a non-GAAP measure) which excludes the impact of foreign currency exchange rates and the impact of acquisitions and divestitures. We believe that reporting organic revenue growth provides a useful comparison of our revenue performance and trends between periods. See "Non-GAAP Disclosures" at the end of this Item 2.
                  - generic [ref=f16e9054]: "Additionally, we use the following operational metrics in monitoring the performance of the business. We believe the operational metrics are useful to investors and other users of our financial information in assessing the performance of our segments:"
                  - generic [ref=f16e9056]: •Bookings represent total orders received from customers in the current reporting period and exclude de-bookings related to orders received in prior periods, if any. This metric is an important measure of performance and an indicator of order trends.
                  - generic [ref=f16e9058]: •Book-to-bill is a ratio of the amount of bookings received from customers during a period divided by the amount of revenue recorded during that same period. This metric is a useful indicator of demand.
                  - generic [ref=f16e9060]: Engineered Products
                  - generic [ref=f16e9062]: Our Engineered Products segment provides a wide range of equipment, components, software, solutions and services to the vehicle aftermarket, aerospace and defense, industrial winch and hoist, precision soldering and fluid dispensing end-markets.
