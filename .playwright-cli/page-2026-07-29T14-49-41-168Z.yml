                    - generic [ref=f16e5107]: 11. Financial Instruments
                    - generic [ref=f16e5109]: Cash Flow Hedges
                    - generic [ref=f16e5111]: The Company is exposed to market risk for changes in foreign currency exchange rates due to the global nature of its operations and certain commodity risks. In order to manage these risks, the Company has hedged portions of its forecasted sales and purchases which occur within the next twelve months that are denominated in non-functional currencies, with currency forward contracts designated as cash flow hedges. At June 30, 2026 and December 31, 2025, the Company had contracts with total notional amounts of $150,105 and $153,765, respectively, to exchange currencies, principally euro, pound sterling, Swedish krona, Canadian dollar, Chinese yuan, and Swiss franc. The Company believes it is probable that all forecasted cash flow transactions will occur.
                    - generic [ref=f16e5114]: In addition, the Company had outstanding contracts with a total notional amount of $104,950 and $74,403 as of June 30, 2026 and December 31, 2025, respectively, that are not designated as hedging instruments. These instruments are used to reduce the Company's exposure for operating receivables and payables that are denominated in non-functional currencies. Gains and losses on these contracts are recorded in other income, net in the condensed consolidated statements of earnings.
