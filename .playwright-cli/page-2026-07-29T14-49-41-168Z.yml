                      - generic [ref=f16e5076]:
                        - text: (1)
                        - generic [ref=f16e5077]: Carrying amount is net of unamortized debt discount and deferred debt issuance costs. Total unamortized debt discounts on total long-term debt were $7.5 million and $8.6 million as of June 30, 2026 and December 31, 2025, respectively. Total deferred debt issuance costs on total long-term debt were $8.6 million and $9.7 million as of June 30, 2026 and December 31, 2025, respectively.
                    - generic [ref=f16e5079]: The discounts are being amortized to interest expense using the effective interest method over the life of the issuances. The deferred issuance costs are amortized on a straight-line basis over the life of the debt, as this approximates the effective interest method.
                    - generic [ref=f16e5082]:
                      - text: On April 2, 2026, the Company entered into a new $1.5 billion five-year unsecured revolving credit facility (the "Credit Agreement") with a syndicate of banks. The previous $1.0 billion five-year unsecured revolving credit facility was terminated upon execution of the new credit facility and the previous $500.0 million 364-day unsecured revolving credit facility expired on the same day. The lenders' commitments under the five-year Credit Agreement will terminate and the loans under the Credit Agreement will mature on April 2, 2031. The Credit Agreement is designated as a liquidity back-stop for the Company's commercial paper program and also is available for general corporate purposes. At the Company's election, loans under the Credit Agreement will bear interest at a base rate plus an applicable margin. The Credit Agreement requires the Company to pay facility fees and imposes various restrictions on the Company such as, among other things, a requirement to maintain a minimum interest coverage ratio of consolidated EBITDA to consolidated net interest expense of not less than 3.0 to 1. There were
                      - generic [ref=f16e5083]: "no"
                      - text: outstanding borrowings under the new Credit Agreement as of June 30, 2026 or previous five-year and 364-day credit facilities as of December 31, 2025.
                    - generic [ref=f16e5087]: The Company was in compliance with all covenants in the Credit Agreement and other long-term debt covenants at June 30, 2026 and had an interest coverage ratio of consolidated EBITDA to consolidated net interest expense of 36.9 to 1.
                    - generic [ref=f16e5090]: Letters of Credit and other Guarantees
                    - generic [ref=f16e5092]: As of June 30, 2026, the Company had approximately $230.0 million outstanding in letters of credit, surety bonds, and performance and other guarantees which primarily expire on various dates through 2035. These letters of credit and bonds are primarily issued as security for insurance, warranty and other performance obligations. In general, we would only be liable for the amount of these guarantees in the event of default in the performance of our obligations, the probability of which is believed to be remote.
