                    - generic [ref=f16e5478]: 13. Equity Incentive Program
                    - generic [ref=f16e5480]: The Company typically makes its annual grants of equity awards pursuant to actions taken by the Compensation Committee of the Board of Directors at its regularly scheduled first quarter meeting. During the six months ended June 30, 2026, the Company issued stock-settled appreciation rights ("SARs") covering 266,199 shares, performance share awards ("PSAs") of 32,294 and restricted stock units ("RSUs") of 56,039. During the six months ended June 30, 2025, the Company issued SARs covering 283,082 shares, PSAs of 34,458 and RSUs of 57,625.
                    - generic [ref=f16e5483]: The Company uses the Black-Scholes option pricing model to determine the fair value of each SAR on the date of grant. Expected volatilities are based on Dover's stock price history, including implied volatilities from traded options on Dover stock. The Company uses historical data to estimate SAR exercise and employee termination patterns within the valuation model. The expected life of SARs granted is derived from the output of the option valuation model and represents the average period of time that SARs granted are expected to be outstanding. The interest rate for periods within the contractual life of the awards is based on the U.S. Treasury yield curve in effect at the time of grant.
