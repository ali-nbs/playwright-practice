                  - generic [ref=f16e8510]:
                    - generic [ref=f16e8511]: Item 2. Management’s Discussion and Analysis of Financial Condition and Results
                    - text: of Operations
                  - generic [ref=f16e8513]: Refer to the section below entitled "Special Note Regarding Forward-Looking Statements" for a discussion of factors that could cause our actual results to differ from the forward-looking statements contained below and throughout this quarterly report.
                  - generic [ref=f16e8515]: Throughout this Management’s Discussion and Analysis of Financial Condition and Results of Operations ("MD&A"), we refer to measures used by management to evaluate performance, including a number of financial measures that are not defined under accounting principles generally accepted in the United States of America ("GAAP"). Please see "Non-GAAP Disclosures" at the end of this Item 2 for further detail on these financial measures. We believe these measures provide investors with important information that is useful in understanding our business results and trends. Reconciliations within this MD&A provide more details on the use and derivation of these measures.
                  - generic [ref=f16e8517]: OVERVIEW
                  - generic [ref=f16e8519]: "Dover is a diversified global manufacturer and solutions provider delivering innovative equipment and components, consumable supplies, aftermarket parts, software and digital solutions, and support services through five operating segments: Engineered Products, Clean Energy & Fueling, Imaging & Identification, Pumps & Process Solutions, and Climate & Sustainability Technologies. The Company's entrepreneurial business model encourages, promotes and fosters deep customer engagement and collaboration, which has led to Dover's well-established and valued reputation for providing superior customer service and industry-leading product innovation. Unless the context indicates otherwise, references herein to \"Dover,\" \"the Company,\" and words such as \"we,\" \"us,\" or \"our\" include Dover Corporation and its consolidated subsidiaries."
                  - generic [ref=f16e8521]: "Dover's five operating segments are as follows:"
                  - generic [ref=f16e8523]: •Our Engineered Products segment provides a wide range of equipment, components, software, solutions and services to the vehicle aftermarket, aerospace and defense, industrial winch and hoist, precision soldering and fluid dispensing end-markets.
                  - generic [ref=f16e8525]: •Our Clean Energy & Fueling segment provides components, equipment, software solutions and services enabling safe and reliable storage, transport, dispensing, and remote monitoring of traditional and clean fuels (including liquefied natural gas, hydrogen, and electric vehicle charging), cryogenic gases, and other hazardous substances along the supply chain, and safe and efficient operation of convenience retail, retail fueling and vehicle wash establishments.
                  - generic [ref=f16e8527]: •Our Imaging & Identification segment supplies precision marking and coding, product traceability, brand protection and digital textile printing equipment, as well as related consumables, software and services to the global packaged and consumer goods, pharmaceutical, industrial manufacturing, textile and other end-markets.
                  - generic [ref=f16e8529]: •Our Pumps & Process Solutions segment manufactures specialty pumps and flow meters, fluid transfer connectors, highly engineered precision components, instruments and digital controls for rotating and reciprocating machines, polymer processing equipment, measurement, inspection, and control technologies, serving single-use biopharmaceutical production, diversified industrial manufacturing applications, chemical production, plastics and polymer processing, midstream and downstream oil and gas, clean energy markets, thermal management, wire and cable, food and beverage, semiconductor production and medical applications and other end-markets.
                  - generic [ref=f16e8531]: •Our Climate & Sustainability Technologies segment is a provider of innovative and energy-efficient equipment, components, solutions, services and parts for the commercial refrigeration, heating and cooling and beverage can-making equipment end-markets.
                  - generic [ref=f16e8533]: In the second quarter of 2026, revenue was $2.2 billion, which increased $140.4 million, or 6.9%, as compared to the second quarter of 2025. This increase was driven by organic revenue growth of 4.8%, acquisition-related revenue growth of 1.2%, and a favorable impact from foreign currency translation of 0.9%. Revenue growth was primarily led by robust demand in our secular-growth-exposed end markets as well as broad-based, constructive trading conditions across most of our businesses. The acquisition-related growth was primarily driven by our acquisitions in the Pumps & Process Solutions segment.
                  - generic [ref=f16e8536]: The 4.8% organic revenue growth for the second quarter of 2026 was driven by increases across all of our segments. For further information, see "Segment Results of Operations" within this Item 2.
                  - generic [ref=f16e8539]: "25"
                  - separator [ref=f16e8542]
                  - link "Table of Contents" [ref=f16e8546] [cursor=pointer]:
                    - /url: "#i4b9d86d2437d4e45a317afdbcb7d6559_4"
                  - generic [ref=f16e8547]: From a geographic perspective, organic revenue for the U.S., our largest market, increased 7.9% in the second quarter of 2026 compared to the prior year comparable quarter, primarily driven by an increase in organic revenue in the Clean Energy & Fueling, Climate & Sustainability Technologies, and Pumps & Process Solutions segments. Organic revenue increased for the Other Americas and Asia by 8.8% and 8.5%, respectively, and decreased for Europe and all other geographic markets by 5.0%, and 0.9%, respectively.
                  - generic [ref=f16e8550]: Bookings were $2.3 billion for the three months ended June 30, 2026, an increase of $322.8 million or 16.1% compared to the prior year comparable quarter. Bookings increased across all segments and most notably in the Climate & Sustainability Technologies segment.
                  - generic [ref=f16e8552]: Restructuring and other costs for the three months ended June 30, 2026 were $24.6 million, which included restructuring charges of $17.0 million and other costs of $7.6 million. Restructuring and other costs were primarily related to headcount reductions and exit costs in the Climate & Sustainability Technologies and Engineered Products segments. For further discussion related to our restructuring and other costs, see "Restructuring and Other Costs (Benefits)," within this Item 2.
                  - generic [ref=f16e8554]: During the three months ended June 30, 2026, the Company received a total of 153,652 shares upon completion of the $500.0 million accelerated repurchase program (the "ASR Program"), totaling 2,487,662. The total number of shares repurchased was based on the average of the daily volume-weighted average share price of Dover's common stock during the calculation period of the ASR Program, less a discount, which was $200.99.
