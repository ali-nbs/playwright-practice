                  - generic [ref=f16e10470]: Second Quarter 2026 Compared to the Second Quarter 2025
                  - generic [ref=f16e10473]:
                    - text: Pumps & Process Solutions revenue for the second quarter of 2026 increased $32.2 million, or 6.2%, as compared to the second quarter of 2025, driven by acquisition-related growth of 4.9%, a favorable impact from foreign currency translation of 0.9% and
                    - generic [ref=f16e10474]: an organic revenue growth
                    - text: of 0.4%. Acquisition-related growth was driven by the acquisitions of Sikora AG and ipp Pump Products GmbH in the second quarter of 2025. Customer pricing favorably impacted revenue in the second quarter of 2026 by approximately 1.5% and by approximately 1.7% in the prior year comparable quarter.
                  - generic [ref=f16e10476]: The organic revenue growth was primarily driven by robust demand for products used in electrification and power generation infrastructure, single-use biopharma components, and industrial pumps, partially offset by anticipated revenue declines in our polymer processing solutions business as customers continue to focus on optimizing the significant capacity investments made over the last several years. We expect the organic growth to trend positively in the second half of the year.
                  - generic [ref=f16e10479]: Pumps & Process Solutions segment earnings increased $19.3 million, or 12.1%, over the prior year comparable quarter. The increase was driven by favorable price versus cost dynamics, positive portfolio mix and the impact from acquisitions, partially offset by lower volumes in our polymer processing solutions business. Segment earnings margin increased to 32.4% from 30.6% in the prior year comparable quarter.
                  - generic [ref=f16e10481]: Overall bookings increased 11.3% as compared to the prior year comparable quarter. The bookings increase was primarily driven by positive demand trends in the biopharmaceutical end market, as well as the favorable impact from acquisitions. Segment book-to-bill was 1.07.
                  - generic [ref=f16e10483]: "33"
                  - separator [ref=f16e10486]
                  - link "Table of Contents" [ref=f16e10490] [cursor=pointer]:
                    - /url: "#i4b9d86d2437d4e45a317afdbcb7d6559_4"
                  - generic [ref=f16e10491]: Six Months Ended June 30, 2026 Compared to the Six Months Ended June 30, 2025
                  - generic [ref=f16e10493]: Pumps & Process Solutions segment revenue increased $76.4 million, or 7.5%, as compared to the six months ended June 30, 2025, attributable to acquisition-related growth of 5.9% for the acquisitions of Sikora AG and ipp Pump Products GmbH in the second quarter of 2025 and a favorable impact from foreign currency translation of 1.8%, partially offset by an organic decline of 0.2%. The organic decline was primarily due to expected declines in our polymer processing solutions business, offset by products used in electrification and power generation infrastructure, single-use biopharma components, and industrial pumps. Customer pricing favorably impacted revenue by approximately 1.5% in both the first half of 2026 and in the prior year comparable period.
                  - generic [ref=f16e10495]: Pumps & Process Solutions segment earnings increased $37.6 million, or 12.1%, for the six months ended June 30, 2026 over the prior year comparable period. The increase was driven by favorable price versus cost dynamics, positive portfolio mix and the impact from acquisitions, partially offset by lower volumes in our polymer processing solutions business. Segment earnings margin increased to 31.9% from 30.6% from the prior year comparable period.
                  - generic [ref=f16e10497]: Climate & Sustainability Technologies
                  - generic [ref=f16e10499]: Our Climate & Sustainability Technologies segment is a provider of innovative and energy-efficient equipment, components, solutions, services and parts for the commercial refrigeration, heating and cooling and beverage can-making equipment end-markets.
