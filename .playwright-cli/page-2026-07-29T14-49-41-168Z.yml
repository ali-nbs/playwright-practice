                    - generic [ref=f16e3424]: 2025 Acquisitions
                    - generic [ref=f16e3426]:
                      - generic [ref=f16e3427]: During the six months ended June 30, 2025, the Company acquired three businesses in separate transactions for total consideration of $653,891, net of cash acquired and inclusive of measurement period adjustments. These businesses were acquired to complement and expand upon existing operations within the Pumps & Process Solutions Segment. The goodwill recorded as a result of these acquisitions represents the economic benefits expected to be derived from product line expansions and operational synergies. Goodwill of $9,250 is
                      - generic [ref=f16e3428]: deductible for income tax purposes and $350,516 is non-deductible for income tax purposes for these acquisitions.
                    - generic [ref=f16e3430]: Sikora
                    - generic [ref=f16e3432]:
                      - generic [ref=f16e3433]: On June 11, 2025, the Company acquired 99.8% of the equity interest in Sikora AG ("Sikora"),
                      - generic [ref=f16e3434]: a provider of precision measurement, inspection and control solutions for production processes in the wires and cables, hoses, optical fibers and plastic industries for $608,459, net of cash acquired and inclusive of measurement period adjustments. The Sikora acquisition strengthens the Company's offerings in the Pumps & Process Solutions segment. In connection with this acquisition, the Company recorded goodwill of $340,478 and intangible assets of $219,058 for customer intangibles, $72,942 for unpatented technology and $17,690 for trademarks. The fair value for customer intangibles at the acquisition date was determined using the multi-period excess earnings method under the income approach. The fair value measurements of intangible assets are based on significant unobservable inputs, and thus represent Level 3 inputs. Significant assumptions used in assessing the fair value of intangible assets include discounted future cash flows, customer attrition rates and discount rates.
