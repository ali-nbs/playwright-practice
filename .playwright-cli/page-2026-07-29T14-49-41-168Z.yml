                  - generic [ref=f16e12503]: Special Note Regarding Forward-Looking Statements
                  - generic [ref=f16e12505]: "This Quarterly Report on Form 10-Q, especially MD&A, contains \"forward-looking\" statements within the meaning of the Private Securities Litigation Reform Act of 1995, as amended. All statements in this document other than statements of historical fact are statements that are, or could be deemed, \"forward-looking\" statements. Some of these statements may be indicated by words such as \"may\", \"anticipate\", \"expect\", \"believe\", \"intend\", \"continue\", \"guidance\", \"estimates\", \"suggest\", \"will\", \"plan\", \"should\", \"would\", \"could\", \"forecast\" and other words and terms that use the future tense or have a similar meaning. Forward-looking statements are based on current expectations and are subject to numerous important risks, uncertainties, and assumptions, including those described in our Annual Report on Form 10-K for the year ended December 31, 2025. Factors that could cause actual results to differ materially from current expectations include, among other things: general economic conditions and conditions in the particular markets in which we operate; supply chain constraints and labor shortages that could result in production stoppages, inflation in material input costs and freight logistics; the impacts of natural or human induced disasters, acts of war, terrorism, international conflicts, and public health crises or other future pandemics on the global economy and on our customers, suppliers, employees, business and cash flows; changes in customer demand and capital spending; competitive factors and pricing pressures; our ability to develop and launch new products in a cost-effective manner; changes in law, including the effect of tax laws and developments with respect to trade policy and tariffs; our ability to identify and complete acquisitions and integrate and realize synergies from newly acquired businesses; acquisition valuation levels; the impact of interest rate and currency exchange rate fluctuations; capital allocation plans and changes in those plans, including with respect to dividends, share repurchases, investments in research and development, capital expenditures and acquisitions; our ability to effectively deploy capital resulting from dispositions; our ability to derive expected benefits from restructurings, productivity initiatives and other cost reduction actions; the impact of legal compliance risks and litigation, including with respect to product quality and safety, cybersecurity and privacy; and our ability to capture and protect intellectual property rights, and various other factors that are described in our periodic reports filed with or furnished to the Securities and Exchange Commission, including our Annual Report on Form 10-K for the year ended December 31, 2025. The Company undertakes no obligation to publicly update any forward-looking statement, whether as a result of new information, future events or otherwise, except as required by law. Given these risks and uncertainties, readers are cautioned not to place undue reliance on such forward-looking statements."
