                  - generic [ref=f16e10102]: Second Quarter 2026 Compared to the Second Quarter 2025
                  - generic [ref=f16e10105]:
                    - text: Imaging & Identification revenue for the second quarter of 2026 increased $13.1 million, or 4.5%, as compared to the second quarter of 2025, driven
                    - generic [ref=f16e10106]: by organic revenue growth
                    - text: of 2.9% and a favorable impact from foreign currency translation of 1.6%. Customer pricing favorably impacted revenue in the second quarter of 2026 by approximately 0.6% and by approximately 4.1% in the prior year comparable quarter.
                  - generic [ref=f16e10108]: The organic revenue growth was primarily driven by growth in demand for core marking and coding equipment and serialization software. We expect constructive demand trends to continue in the second half of the year.
                  - generic [ref=f16e10111]: Imaging & Identification segment earnings increased $8.0 million, or 10.4%, over the prior year comparable quarter. The increase was primarily driven by volume growth, favorable price versus cost dynamics and productivity initiatives. Segment earnings margin increased to 27.9% from 26.3% in the prior year comparable quarter.
                  - generic [ref=f16e10113]: Overall bookings increased 3.7% as compared to the prior year comparable quarter. The bookings increase was primarily driven by order strength in our core marking and coding business. Segment book-to-bill was 0.99.
                  - generic [ref=f16e10115]: Six Months Ended June 30, 2026 Compared to the Six Months Ended June 30, 2025
                  - generic [ref=f16e10117]: Imaging & Identification segment revenue increased $18.4 million, or 3.2%, as compared to the six months ended June 30, 2025, attributable to a favorable impact from foreign currency translation of 3.3%, partially offset by an organic decline of 0.1%. The organic revenue decline was primarily due to shipment timing for marking and coding equipment, partially offset by pricing actions. Customer pricing favorably impacted revenue by approximately 0.9% and 3.2% in the prior year comparable period.
                  - generic [ref=f16e10120]: Imaging & Identification segment earnings increased $7.9 million, or 5.1%, for the six months ended June 30, 2026 over the prior year comparable period. The increase was primarily driven by pricing actions and productivity initiatives, partially offset by lower volumes and inflationary costs. Segment earnings margin increased to 27.5% from 27.0% in the prior year comparable period.
