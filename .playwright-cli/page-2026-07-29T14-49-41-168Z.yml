                  - generic [ref=f16e9378]: Second Quarter 2026 Compared to the Second Quarter 2025
                  - generic [ref=f16e9380]: Engineered Products revenue for the second quarter of 2026 increased $7.5 million, or 2.7%, as compared to the second quarter of 2025, driven by organic growth of 2.1% and a favorable impact from foreign currency translation of 0.6%. Customer pricing favorably impacted revenue by approximately 3.0% in the second quarter of 2026 and in the prior year comparable quarter.
                  - generic [ref=f16e9383]: The organic revenue growth was primarily driven by pricing actions and solid demand trends in aerospace and defense components, fluid dispensing, and industrial winches, partially offset by lower vehicle service demand in Europe. The growth outlook is favorable for the second half of the year as we expect stable volumes in vehicle services and constructive demand conditions across key end markets, most notably in aerospace and defense.
                  - generic [ref=f16e9386]: "29"
                  - separator [ref=f16e9389]
                  - link "Table of Contents" [ref=f16e9393] [cursor=pointer]:
                    - /url: "#i4b9d86d2437d4e45a317afdbcb7d6559_4"
                  - generic [ref=f16e9394]: Engineered Products segment earnings increased $4.3 million, or 8.0%, compared to the second quarter of 2025. The increase was primarily driven by pricing actions, volume leverage, productivity initiatives and carry-over benefits from restructuring actions taken in 2025, partially offset by inflationary impacts, and lower vehicle service volume. Segment earnings margin increased to 20.4% from 19.4% as compared to the prior year comparable quarter.
                  - generic [ref=f16e9396]: Overall bookings increased 0.2% as compared to the prior year comparable quarter. The bookings increase was driven by strength in our aerospace and defense business and precision soldering and fluid dispensing demand. Segment book-to-bill was 0.98.
                  - generic [ref=f16e9398]: Six Months Ended June 30, 2026 Compared to the Six Months Ended June 30, 2025
                  - generic [ref=f16e9400]: Engineered Products revenue for the six months ended June 30, 2026 increased $19.5 million, or 3.7%, compared to the prior year comparable period. This was comprised of organic revenue growth of 2.1% and a favorable impact from foreign currency translation of 1.6%. The organic revenue growth was primarily driven by pricing actions and solid demand trends in aerospace and defense components, fluid dispensing, and industrial winches, partially offset by lower vehicle service demand in Europe. Customer pricing favorably impacted revenue by approximately 2.6% and by 2.1% in the prior year comparable period.
                  - generic [ref=f16e9403]: Segment earnings for the six months ended June 30, 2026 increased $5.2 million, or 5.3%, as compared to the 2025 comparable period. The increase was primarily driven by pricing actions, productivity initiatives and carry-over benefits from restructuring actions taken in 2025, partially offset by inflationary impacts and lower volumes in vehicle service. Segment earnings margin increased to 18.7% from 18.4% as compared to the prior year comparable period.
                  - generic [ref=f16e9405]: Clean Energy & Fueling
                  - generic [ref=f16e9407]: Our Clean Energy & Fueling segment provides components, equipment, software solutions and services enabling safe and reliable storage, transport, dispensing, and remote monitoring of traditional and clean fuels (including liquefied natural gas, hydrogen, and electric vehicle charging), cryogenic gases, and other hazardous substances along the supply chain, and safe and efficient operation of convenience retail, retail fueling and vehicle wash establishments.
