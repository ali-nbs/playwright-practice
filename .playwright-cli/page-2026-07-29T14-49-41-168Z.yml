                    - generic [ref=f16e5798]: 14. Commitments and Contingent Liabilities
                    - generic [ref=f16e5800]: Litigation
                    - generic [ref=f16e5802]: A few of the Company’s subsidiaries are involved in legal proceedings relating to the cleanup of waste disposal sites identified under federal and state statutes which provide for the allocation of such costs among "potentially responsible parties." In each instance, the extent of the Company’s liability appears to be relatively insignificant in relation to the total projected expenditures and the number of other "potentially responsible parties" involved and is anticipated to be immaterial to the Company. In addition, a few of the Company’s subsidiaries are involved in ongoing remedial activities at certain current and former plant sites, in cooperation with regulatory agencies, and appropriate estimated liabilities have been established. At June 30, 2026 and December 31, 2025, these estimated liabilities for environmental and other matters, including private party claims for exposure to hazardous substances that are probable and estimable, were not significant.
                    - generic [ref=f16e5804]: The Company and some of its subsidiaries are also parties to a number of other legal proceedings incidental to their businesses. These proceedings primarily involve claims by private parties alleging injury arising out of use of the Company’s products, patent infringement, employment matters and commercial disputes. Management and legal counsel, at least quarterly, review the probable outcome of such proceedings, the costs and expenses reasonably expected to be incurred and currently accrued to-date and consider the availability and extent of insurance coverage.
                    - generic [ref=f16e5806]: The Company has estimated liabilities for these other legal matters that are probable and estimable, and at June 30, 2026 and December 31, 2025, these estimated liabilities were immaterial. While it is not possible at this time to predict the outcome of these legal actions, in the opinion of management, based on the aforementioned reviews, the Company is not currently involved in any legal proceedings which, individually or in the aggregate, could have a material effect on its financial position, results of operations, or cash flows.
