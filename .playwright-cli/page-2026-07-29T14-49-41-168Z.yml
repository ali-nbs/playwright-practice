                  - generic [ref=f16e8014]: For the three and six months ended June 30, 2026 and 2025, the U.S. was the largest geographical market for revenue for the Engineered Products, Clean Energy & Fueling, Pumps & Process Solutions, and Climate & Sustainability Technologies segments, and Europe was the largest market for the Imaging & Identification segment.
                  - generic [ref=f16e8017]:
                    - generic [ref=f16e8018]: 17. Stockholders' Equity
                    - generic [ref=f16e8020]: Share Repurchases
                    - generic [ref=f16e8022]: In August 2023, the Company's Board of Directors approved a new standing share repurchase authorization whereby the Company may repurchase up to 20 million shares beginning on January 1, 2024 through December 31, 2026.
                    - generic [ref=f16e8025]: On November 10, 2025, the Company entered into a $500,000 accelerated share repurchase agreement (the "ASR Agreement") with JPMorgan Chase Bank, N.A. ("JPMorgan") to repurchase its shares in an accelerated share repurchase program (the "ASR Program"). The ASR Program is classified as equity, initially recorded at fair value with no subsequent remeasurement. The Company conducted the ASR Program under the current share repurchase authorization. The Company funded the ASR Program with cash on hand.
                    - generic [ref=f16e8028]: Under the terms of the ASR Agreement, the Company paid JPMorgan $500,000 on November 12, 2025, and on that date received initial delivery of 2,334,010 shares, representing a substantial majority of the shares expected to be retired over the course of the ASR Program. In April 2026, JPMorgan delivered 153,652 additional shares which completed the ASR Program, totaling 2,487,662 repurchased shares under the ASR Agreement. The total number of shares repurchased under the ASR Agreement was based on the average of the daily volume-weighted average share price of Dover's common stock during the calculation period of the ASR Program, less a discount, which was $200.99 over the term of the ASR Program.
                    - generic [ref=f16e8032]:
                      - text: In the three months ended June 30, 2026 and 2025, exclusive of the ASR Agreement, there were
                      - generic [ref=f16e8033]: "no"
                      - text: share repurchases. In the six months ended June 30, 2026 and 2025, exclusive of the ASR Agreement, the Company repurchased 250,000 shares at a total cost of $53,937, or $215.75 per share and 200,000 shares at a total cost of $40,700, or $203.50 per share, respectively.
                    - generic [ref=f16e8035]: As of June 30, 2026, 14,193,056 shares remain authorized for repurchase under the August 2023 share repurchase authorization.
