                    - generic [ref=f15e8673]: During the six months ended June 30, 2026, the Green Notes became eligible for conversion after the satisfaction of the Closing Price Condition specified in the underlying indentures for such notes. During the six months ended June 30, 2026, holders elected to convert approximately $147.0 million aggregate principal amount of the Green Notes. Under the conversion provisions of the respective indentures for the Green Notes, and consistent with our obligation to settle conversions in cash, shares of common stock, or a combination thereof, we issued 6,676,924 shares of common stock during the period. As of June 30, 2026, an additional 877,687 shares of common stock related to converted Green Notes had not yet been issued and remained unsettled.
