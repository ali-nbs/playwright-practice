                    - generic [ref=f15e8043]:
                      - text: "1"
                      - generic [ref=f15e8044]: Issued pursuant to, and are governed by, an indenture, between us and U.S. Bank Trust Company, National Association, as Trustee, in private placements to qualified institutional buyers pursuant to Rule 144A of the Securities Act of 1933, as amended.
                    - generic [ref=f15e8045]: 2 The notes’ initial purchasers’ discount and other issuance costs (collectively, the “Transaction Costs”) were recorded as debt issuance costs and presented a reduction to the notes on our condensed consolidated balance sheets and are amortized to interest expense at an effective interest rate.
                    - generic [ref=f15e8046]: 3 Unless earlier repurchased, redeemed or converted.
                    - generic [ref=f15e8047]: 4 Pursuant to the purchase agreement among us and the representatives of the initial purchasers, we granted the initial purchasers an option to purchase an additional aggregate principal amount of the notes. Notes included specified aggregate principal amount pursuant to the full exercise by the initial purchasers of the Greenshoe option.
                    - generic [ref=f15e8048]:
                      - text: "5"
                      - generic [ref=f15e8049]: We may not redeem the notes prior to the specified redemption date, subject to a partial redemption limitation. We may elect to redeem, at face value, all or any portion of the notes at any time, and from time to time, on or after the specified redemption date, and on or before the twenty-first (for the 0% Notes and the
                  - generic [ref=f15e8050]: "24"
                  - separator [ref=f15e8053]
                  - generic [ref=f15e8057]:
                    - generic [ref=f15e8058]: 3.0% Green Notes due June 2029), or the forty-sixth (for the 3.0% Green Notes due June 2028) scheduled trading day immediately before the maturity date, provided the share price for our common stock exceeds 130% of the conversion price at redemption.
                    - generic [ref=f15e8060]:
                      - text: "6"
                      - generic [ref=f15e8061]: Before the specified conversion date, the noteholders have the right to convert their notes only upon the occurrence of certain events, including satisfaction of a condition relating to the closing price of our common stock (the “Closing Price Condition”) or the trading price of the notes (the “Trading Price Condition”), a redemption event, or other specified corporate events. If the Closing Price Condition is met on at least 20 (whether or not consecutive) of the last 30 consecutive trading days in any calendar quarter, and only during such calendar quarter, the noteholders may convert their notes at any time during the immediately following quarter, commencing after the calendar quarter ending on the specified date (i.e., conversion trigger quarter-end date), subject to the partial redemption limitation.
                    - generic [ref=f15e8062]:
                      - text: "7"
                      - generic [ref=f15e8063]: Subject to the Trading Price Condition, the noteholders may convert their notes during the five consecutive business days immediately after any ten consecutive trading day period (for the 0% Notes) or the five business days immediately after any five consecutive trading day period (for the 3.0% Green Notes due June 2029 and the 3.0% Green Notes due June 2028, collectively referred to as the “Green Notes”) in which the trading price per $1,000 principal amount of the notes, as determined following a request by a holder of the notes, for each day of that period is less than 98% of the product of the closing price of our common stock and the then applicable conversion rate. From and after the specified conversion date, the noteholders may convert their notes at any time at their election until the close of business on the second scheduled trading day immediately before the maturity date. Should the noteholders elect to convert their notes, we may elect to settle the conversion by paying or delivering, as applicable, cash, shares of our common stock, $0.0001 par value per share, or a combination thereof, at our election. Please refer to Part II, Item 8, Note 8-
                      - text: Outstanding Loans and Security Agreements, section Induced Conversions of the Existing Notes
                      - generic [ref=f15e8064]: in our 2025 Form 10-K for details of the conversion of the 3.0% Green Notes due June 2029 and the 3.0% Green Notes due June 2028 in the fourth quarter of the fiscal year 2025.
                    - generic [ref=f15e8065]:
                      - text: "8"
                      - generic [ref=f15e8066]: The Closing Price Condition for the 3.0% Green Notes due June 2029 and the 3.0% Green Notes due June 2028 was met during the three months ended March 31, 2026, and accordingly, such noteholders could convert their notes during the quarter ended June 30, 2026 (see section
                      - text: Conversions of the Green Notes
                      - generic [ref=f15e8067]: below). The Closing Price Condition for the 0% Notes was not met during the three months ended March 31, 2026, and accordingly, such noteholders could not convert their notes during the quarter ended June 30, 2026.
                    - generic [ref=f15e8068]: 9 The conversion rate and conversion price are subject to customary adjustments upon the occurrence of certain events. Also, we may increase the conversion rate at any time if our Board of Directors determines it is in the best interests of the Company or to avoid or diminish income tax to holders of common stock. In addition, if certain corporate events that constitute a Make-Whole Fundamental Change, occur, then the conversion rate applicable to the conversion of the notes will, in certain circumstances, increase by up to the specified incremental shares of common stock per $1,000 principal amount of notes for a specified period of time.
                    - generic [ref=f15e8069]: 10 Make-Whole Fundamental Change means (i) a Fundamental Change, that includes certain change-of-control events relating to us, certain business combination transactions involving us and certain delisting events with respect to our common stock, or (ii) the sending of a redemption notice with respect to the notes.
                    - generic [ref=f15e8070]:
                      - text: "11"
                      - generic [ref=f15e8071]: The notes contain certain customary provisions relating to the occurrence of Events of Default, as defined in the underlying indentures. If an Event of Default involving bankruptcy, insolvency or reorganization events with respect to us occurs, then the principal amount of, and all accrued and unpaid interest (regular interest, where applicable, special interest or additional interest, if any) on all of the notes then outstanding will immediately become due and payable without any further action or notice by any person. However, notwithstanding the foregoing, we may elect, at our option, that the sole remedy for an Event of Default relating to certain failures by us to comply with certain reporting covenants in the underlying indentures consists exclusively of the right of the noteholders to receive special interest for up to 360 days (on the 0% Notes) or up to 180 days (on the Green Notes) at a specified rate per annum not exceeding 0.5% on the principal amount of the notes.
