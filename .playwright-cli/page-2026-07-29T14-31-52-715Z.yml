                  - generic [ref=f15e4223]: 1. Nature of Business, Liquidity and Basis of Presentation
                  - generic [ref=f15e4225]:
                    - generic [ref=f15e4226]: Nature of Business
                    - generic [ref=f15e4227]: For information on the nature of our business, see Part II, Item 8, Note 1-Nature of Business, Liquidity and Basis of Presentation, section Nature of Business in our 2025 Form 10-K.
                    - generic [ref=f15e4228]: Liquidity
                    - generic [ref=f15e4229]:
                      - generic [ref=f15e4230]: We generated $300.0 million of positive operating cash flow and $254.4 million of operating income for the six months ended June 30, 2026. With the series of convertible debt offerings, debt extinguishments, debt exchanges, and conversions of convertible debt to equity completed since
                      - text: "2021"
                      - generic [ref=f15e4231]: ", as of June 30, 2026, we had $2,475.4 million and $2.6 million of total outstanding recourse and non-recourse debt, respectively, $7.3 million and $2,470.7 million of which was classified as short-term debt and long-term debt, respectively. As of December 31, 2025, we had $2,613.7 million and $4.2 million of total outstanding recourse and non-recourse debt, respectively, $4.2 million and $2,613.7 million of which was classified as short-term debt and long-term debt, respectively."
                    - generic [ref=f15e4232]: For information regarding our recent issuances of convertible debt, related exchange and extinguishment transactions, and our entry into a senior secured multicurrency revolving credit facility (the “Revolving Credit Facility”), refer to Part II, Item 8, Note 1-Nature of Business, Liquidity and Basis of Presentation, section Liquidity in our 2025 Form 10-K.
                    - generic [ref=f15e4233]: Our future capital requirements depend on many factors, including the market acceptance of our products, our rate of revenue growth, the timing and extent of spending on research and development efforts and other business initiatives, the rate of growth in the volume of system builds and the need for additional working capital, the expansion of sales and marketing activities both in domestic and international markets, our ability to secure financing for customer use of our products, the timing of installations, inventory buildup and increase in factory capacity in anticipation of future sales and installations, and overall economic conditions. In order to support and achieve our future growth plans, we may need or seek advantageously to obtain additional funding through equity or debt financing. Failure to obtain this financing on favorable terms or at all in future quarters may affect our financial position and results of operations, including our revenues and cash flows.
                    - generic [ref=f15e4234]: In the opinion of management, the combination of our cash and cash equivalents and cash flow to be generated by our operations is expected to be sufficient to meet our anticipated cash flow needs for at least the next 12 months from the date of the issuance of this Quarterly Report on Form 10-Q.
