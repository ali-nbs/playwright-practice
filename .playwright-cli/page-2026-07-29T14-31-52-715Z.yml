                        - text: )
                        - generic [ref=f15e4394]: (“ASU 2026-02”). This guidance establishes a comprehensive model for the recognition, measurement, presentation, and disclosure of environmental credits and environmental credit obligations. The amendments are intended to improve comparability and transparency by reducing diversity in practice related to accounting for these arrangements. The standard is effective for fiscal years beginning after December 15, 2027, including interim periods within those fiscal years, with early adoption permitted. The Company is evaluating ASU 2026-02 guidance and does not currently expect it to have a material impact on its condensed consolidated financial statements.
