                      - generic [ref=f15e6219]:
                        - text: "2"
                        - generic [ref=f15e6220]: As of June 30, 2026, we had identified approximately $37.4 million of recoverable import tariffs previously paid under the International Emergency Economic Powers Act (“IEEPA”), all of which had been recognized in
                        - text: Cost of product revenue
                        - generic [ref=f15e6221]: . Approximately $5.0 million of such amounts had been refunded as of June 30, 2026. Bloom concluded that recovery of the remaining $32.4 million was probable and reasonably estimable and, accordingly, recognized a tariff refund receivable for that amount. The receivable is limited to tariff costs previously recognized in earnings and reflects management’s assessment of recoverable amounts based on the status of claims and other information available as of the reporting date. Our estimate of recoverable amounts is based on currently available information, including the status of claims and applicable refund procedures. The ultimate amount and timing of recoveries may differ from the amounts recorded due to uncertainties in the refund process and potential legal or administrative developments.
