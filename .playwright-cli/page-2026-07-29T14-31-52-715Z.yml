                        - text: The Company adopted
                        - generic [ref=f15e11316] [cursor=pointer]: ASC 260
                      - text: ", Earnings per share, guidance from inception. Earnings per share (“EPS”) is the amount of earnings attributable to each share of common stock. For convenience, the term is used to refer to either earnings or loss per share."
                    - generic [ref=f15e11317]: We calculate basic earnings per share by dividing net income attributable to common stockholders (the “numerator”) by the weighted average number of common shares outstanding (the “denominator”) during the reporting period. Diluted earnings per share is calculated similarly but reflects the potential impact of outstanding stock options and awards, the Warrant (see Note 3-Revenue Recognition in this Quarterly Report on Form 10-Q), shares issued in conjunction with the Company’s ESPP by applying the treasury stock method, and other commitments to issue common stock, including shares issuable upon the conversion of convertible notes by applying the if-converted method, except where the impact would be anti-dilutive. For diluted earnings per share, we also adjust the numerator for interest expense on convertible debt, net of the related income tax effect, when assuming conversion under the if-converted method.
