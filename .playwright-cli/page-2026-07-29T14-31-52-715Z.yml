                    - generic [ref=f15e8689]: On June 9, 2026, we issued a notice of redemption (the “Redemption Notice”) for all the remaining outstanding 3.0% Green Notes due June 2028 pursuant to the indenture dated May 16, 2023 governing such notes (the “Indenture”). The redemption date was scheduled for July 10, 2026 (the “Redemption Date”).
                    - generic [ref=f15e8691]: In accordance with the terms of the Indenture, holders had the right to convert their notes at any time from the date of the Redemption Notice until the close of business on the business day immediately preceding the Redemption Date. Any notes not converted would be redeemed for cash at a price equal to 100% of the principal amount, plus accrued and unpaid interest, if any, to, but excluding, the Redemption Date.
