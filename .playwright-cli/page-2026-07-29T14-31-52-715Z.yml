                    - generic [ref=f15e4333]: Concentration of Risk
                    - generic [ref=f15e4334]:
                      - text: Geographic Risk-
                      - generic [ref=f15e4335]:
                        - text: The majority of our revenue and long-lived assets are attributable to operations in the U.S. for all periods presented. In addition to shipments in the U.S., we also ship our Energy Server systems to other countries, primarily, the Republic of Korea, Japan, India and Taiwan (collectively referred to as the “Asia Pacific region”), and several European countries, namely Germany, UK and Italy. Revenue generated in the U.S. represented
                        - generic [ref=f15e4336]: "90"
                        - text: "% of total revenue for both the three and six months ended June 30, 2026. For the three and six months ended June 30, 2025, revenue in the U.S. was 59% and 58%, respectively, of our total revenue."
                    - generic [ref=f15e4337]:
                      - text: Credit Risk-As of June 30, 2026, three customers*, the third of which was our related party (see Note 11-Related Party Transactions
                      - generic [ref=f15e4338]: in this Quarterly Report on Form 10-Q), accounted for approximately 36%, 34%, and 17% of accounts receivable. As of December 31, 2025, three customers*, the first of which was our related party (see Note 11-
                      - text: Related Party Transactions
                      - generic [ref=f15e4339]: in this Quarterly Report on Form 10-Q), accounted for approximately 41%, 17%, and 15% of accounts receivable. To date, we have not experienced any material credit losses from these customers*.
                    - generic [ref=f15e4340]:
                      - text: Customer Risk-During the six months ended June 30, 2026, revenue from two customers*, the second of which is our related party (see Note 11-Related Party Transactions
