                    - generic [ref=f15e10267]: The estimated fair value of RSUs and PSUs is based on the fair market value of our common stock on the date of grant. For the three and six months ended June 30, 2026, we recognized $45.0 million and $88.2 million of stock-based compensation costs for stock awards, respectively. For the three and six months ended June 30, 2025, we recognized $25.9 million and $54.7 million of stock-based compensation costs for stock awards, respectively.
                    - generic [ref=f15e10269]: As of June 30, 2026, and December 31, 2025, we had $401.1 million and $277.1 million of unrecognized stock-based compensation expense related to unvested stock awards, expected to be recognized over a weighted-average period of 1.8 years and 2.0 years, respectively.
                    - generic [ref=f15e10271]: Executive Awards
                    - generic [ref=f15e10272]: The Company granted awards under the 2018 Plan to certain executive officers during 2026.
                    - generic [ref=f15e10273]: On June 15, 2026, the Company granted PSUs to its Chief Executive Officer (the “CEO Award”). The CEO Award vests in full at the end of a 3.5-year performance period (cliff vesting), subject to the achievement of specified annual performance targets and the CEO’s continued employment through the vesting date. Any shares issued upon vesting and settlement of the CEO Award, net of shares withheld to satisfy applicable tax withholding obligations, will be subject to a mandatory post-vesting holding period and generally may not be sold, transferred, assigned, pledged, hypothecated or otherwise disposed of prior to December 31, 2031, subject to certain limited exceptions. Stock-based compensation expense for the CEO Award is recognized over the 3.5-year performance period based on the Company’s current estimate of the likelihood of achieving the applicable performance targets.
                    - generic [ref=f15e10275]: On May 20, 2026, the Company granted PSUs and RSUs to its newly appointed Chief Financial Officer and one other executive officer. On February 25, 2026, the Company granted PSUs and RSUs to certain other executive officers (collectively, the “2026 Executive Awards”).
                    - generic [ref=f15e10276]: The RSUs are subject to service-based vesting. For the Chief Financial Officer, one-third of the RSUs vest on April 15, 2027, and the remaining two-thirds vest in equal quarterly installments over the following two years. For certain other executive officers, 40% of the RSUs vest on March 1, 2027, and the remaining 60% vest in equal quarterly installments over the subsequent two years.
                    - generic [ref=f15e10278]: The PSUs included in the 2026 Executive Awards vest in full at the end of a three-year performance period (cliff vesting), subject to the achievement of specified annual performance targets and the executive’s continued employment through the vesting date. Stock-based compensation expense for the RSUs is recognized over the requisite service period based on the service-based vesting terms, while expense for the PSUs is recognized over the applicable three-year performance period based on the Company’s current estimate of the likelihood of achieving the applicable performance targets.
