                  - generic [ref=f15e11259]: 12. Commitments and Contingencies
                  - generic [ref=f15e11261]:
                    - generic [ref=f15e11262]: Commitments
                    - generic [ref=f15e11263]:
                      - text: Purchase Commitments with Suppliers and Contract Manufacturers-
                      - generic [ref=f15e11264]: As of June 30, 2026, we had non-cancelable purchase commitments of $16.4 million with component suppliers and third-party manufacturers, which are expected to be fulfilled beyond the next 12 months. As of December 31, 2025, we had no non-cancelable purchase commitments with component suppliers and third-party manufacturers, which are expected to be fulfilled beyond the next 12 months. For additional information on purchase commitments with suppliers and contract manufacturers, see Part II, Item 8, Note 13-
                      - text: Commitments and Contingencies, section Commitments in our 2025 Form 10-K.
                    - generic [ref=f15e11265]:
                      - text: Performance Guarantees-
                      - generic [ref=f15e11266]: We paid $5.4 million and $13.8 million for the three and six months ended June 30, 2026, respectively, and $3.0 million and $14.6 million for the three and six months ended June 30, 2025, respectively, for guarantees that we provide customers on the output performance of our Energy Server systems. For additional information on performance guarantees, see Part II, Item 8, Note 13-
                      - text: Commitments and Contingencies, section Commitments in our 2025 Form 10-K.
                    - generic [ref=f15e11267]:
                      - text: Letters of Credit-We have outstanding letters of credit issued to our customers and other counterparties in the U.S. and international locations under different performance and financial obligations. These letters of credit are collateralized through cash deposited in the controlled bank accounts with the issuing banks and are classified as Restricted Cash
                      - generic [ref=f15e11268]: in our condensed consolidated balance sheets. As of June 30, 2026, and December 31, 2025, the balances of the cash-collateralized letters of credit issued to our customers and other counterparties in the U.S. and international locations were $20.9 million and $26.6 million, respectively.
                    - generic [ref=f15e11269]: In April 2026, we issued in the ordinary course of business additional standby letters of credit totaling $100.0 million, including $90.0 million issued under our Revolving Credit Facility and $10.0 million issued through other arrangements, each with an expiration date of April 1, 2027.
                    - generic [ref=f15e11271]:
                      - text: Pledged Funds-
                      - generic [ref=f15e11272]: In 2019, pursuant to the PPA IIIb repowering of the Energy Server systems, we established a restricted cash fund of $20.0 million, which had been pledged for a seven-year period to secure our operations and maintenance obligations with respect to the totality of our obligations to the financier. These funds will be released to us by the end of 2026 as long as the Energy Server systems continue to perform in compliance with our warranty obligations. As of June 30, 2026, and December 31, 2025, the balance of the restricted cash fund was $0.7 million and $0.9 million, respectively.
                    - generic [ref=f15e11273]: Contingencies
                    - generic [ref=f15e11274]: Indemnification Agreements-See Part II, Item 8, Note 13-Commitments and Contingencies, section Contingencies in our 2025 Form 10-K. To date, we have not paid any claims or been required to defend any action related to our indemnification obligations with customers and certain other business partners. However, we may record charges in the future as a result of these indemnification obligations.
                    - generic [ref=f15e11275]: Investment Tax Credits-See Part II, Item 8, Note 13-Commitments and Contingencies, section Contingencies in our 2025 Form 10-K.
                    - generic [ref=f15e11276]: Legal Matters-We are involved in various legal proceedings that arise in the ordinary course of business. We review all legal matters at least quarterly and assess whether an accrual for loss contingencies needs to be recorded. We record an accrual for loss contingencies when management believes that it is both probable that a liability has been incurred and the amount of the loss can be reasonably estimated. Legal matters are subject to uncertainties and are inherently unpredictable, so the actual liability in any such matter may be materially different from our estimates. If an unfavorable resolution were to occur, there exists the possibility of a material adverse impact on our consolidated financial condition, results of operations or cash flows for the period in which the resolution occurs or in future periods.
                    - generic [ref=f15e11277]: In February 2022, Plansee SE/Global Tungsten & Powders Corp. (“Plansee/GTP”), a former supplier, filed a request for expedited arbitration with the World Intellectual Property Organization Arbitration and Mediation Center in Geneva Switzerland (“WIPO”), for various claims allegedly in relation to an Intellectual Property and Confidential Disclosure Agreement between Plansee/GTP and Bloom Energy Corporation. Plansee/GTP’s statement of claims includes allegations of infringement of U.S. Patent Nos. 8,802,328, 8,753,785 and 9,434,003. On April 3, 2022, we filed a complaint against Plansee/GTP in the Eastern District of Texas to address the dispute between Plansee/GTP and Bloom Energy Corporation in a proper forum before a U.S. Federal District Court. Our complaint sought the correction of inventorship of U.S. Patent Nos. 8,802,328, 8,753,785 and 9,434,003 (the “Patents-in-Suit”); declaratory judgment of invalidity, unenforceability, and non-infringement of the Patents-in-Suit; and declaratory judgment of no misappropriation. Further, our complaint sought to recover damages in relation to Plansee/GTP’s business dealings that, as alleged, constitute acts of unfair competition, tortious interference contract, breach of contract, violations of the Racketeer Influenced and Corrupt Organizations (RICO) Act and violations of the Clayton Antitrust Act. On June 9, 2022, Plansee/GTP filed a motion to dismiss the complaint filed in the Eastern District of Texas and compel arbitration (or alternatively to stay). On February 9, 2023, Magistrate Judge Payne issued a report and recommendation to stay the district court action pending an arbitrability determination by the arbitrator for each claim. On April 26, 2023, Judge Gilstrap stayed the district court action pending arbitrability determinations by the arbitrator in the WIPO proceeding. On October 2, 2023, the arbitrator in the WIPO proceeding issued a ruling concluding that all the parties’ claims were arbitrable.
                    - generic [ref=f15e11279]: On November 18, 2023, the arbitrator bifurcated the arbitration into a first phase focusing on Bloom’s claims directed to improper inventorship of the Patents‑in‑Suit and Bloom’s defective product claims. Briefing on the first phase took place throughout 2024 and the first half of 2025. An evidentiary hearing with witness testimony commenced on July 21, 2025, and continued through August 1, 2025. A partial award was transmitted to the parties on February 12, 2026. The parties currently dispute whether all first phase issues have been resolved. There are no current timelines in place for conducting additional phases of the arbitration. We are unable to predict the ultimate outcome of the arbitration at this time.
