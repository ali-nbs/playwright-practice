                    - text: Table of Contents
                  - generic [ref=f19e557]: Walmart Puerto Rico 401(k) Plan
                  - generic [ref=f19e558]: Notes to Financial Statements
                  - generic [ref=f19e559]: January 31, 2026
                  - generic [ref=f19e560]: Note 1. Description of the Plan
                  - generic [ref=f19e562]:
                    - generic [ref=f19e563]: Walmart Inc., ("Walmart" or the "Company") sponsors the Walmart Puerto Rico 401(k) Plan (the "Plan"). The following description provides only general information. This document is not part of the Summary Plan Description and is not a document pursuant to which the Plan is maintained within the meaning of Section 402(a)(1) of the Employee Retirement Income Security Act of 1974, as amended (ERISA). Participants should refer to the Plan document for a complete description of the Plan's provisions. To the extent not specifically prohibited by statute or regulation, Walmart reserves the right to unilaterally amend, modify or terminate the Plan at any time; such changes may be applied to all Plan participants and their beneficiaries regardless of whether the participant is actively working or retired at the time of the change. The Plan may not be amended, however, to permit any part of the Plan's assets to be used for any purpose other than for the purpose of paying benefits to participants and their beneficiaries and paying Plan expenses.
                    - generic [ref=f19e564]: General
                    - generic [ref=f19e565]: The Plan is a defined contribution plan established by the Company on February 1, 1997. Each eligible employee who has completed at least 1,000 hours of service in a consecutive 12-month period commencing on date of hire (or during any subsequent Plan year) is eligible to participate in the Plan. Participation may begin on the first day of the month following eligibility. Effective February 1, 2025, long-term part-time employees, defined as employees with at least 500 hours of service for two sequentially consecutive 12-month periods, are eligible to participate in the Plan. The Plan is subject to the provisions of ERISA.
                    - generic [ref=f19e567]: The responsibility for management of Plan assets and the investment policy is vested in the Plan's Benefits Investment Committee. Benefits Investment Committee members are appointed by the Company's Senior Vice President, Global Total Rewards (or individual from time to time performing such function). Responsibility for operation and administration of the Plan is vested in the Senior Vice President, Global Total Rewards (or individual from time to time performing such function).
                    - generic [ref=f19e568]: Banco Popular de Puerto Rico ("Trustee") is the Plan's trustee. Bank of America, N.A. ("Custodian") was appointed as the custodian of the Plan and holds the Plan's assets. The Custodian is a subsidiary of Bank of America Corporation. The Trustee remits all contributions received from the Company to the Custodian who invests those contributions as directed by participants according to the policies established by the Benefits Investment Committee. Merrill Lynch, Pierce, Fenner & Smith, Inc., which is the record keeper for the Plan, is a subsidiary of Merrill Lynch & Company and ultimately a subsidiary of Bank of America Corporation.
                    - generic [ref=f19e569]: Contributions
                    - generic [ref=f19e570]: Eligible employees may elect to contribute up to 50% of their eligible wages but are not required to contribute to the Plan. Participants who have attained age 50 before the end of the calendar year are eligible to make catch-up contributions. Participants may also contribute amounts representing distributions from other eligible retirement plans (rollover contributions).
                    - generic [ref=f19e573]: Each eligible employee who has elected to contribute to the Plan will receive a Company matching contribution. (Employees eligible to contribute to the Plan solely because of their classification as a long-term part-time employee are not eligible to receive Company matching contributions.) The Company match is 100% of deferrals up to 6% of each participant's eligible wages for the Plan year. Company matching contributions are contributed to the Plan each payroll period and are calculated based on each participant's cumulative compensation and cumulative elective and catch-up contributions through such payroll period. Rollover contributions into the Plan are not eligible for a Company matching contribution.
                    - generic [ref=f19e575]: Additional types of contributions may be contributed by the Company to the Plan. No such additional types of contributions were made for the Plan year ended January 31, 2026, other than a qualified non-elective contribution to assist the Plan in satisfying nondiscrimination testing. All contributions are subject to certain limitations in accordance with provisions of the Puerto Rico Internal Revenue Code of 2011 ("Puerto Rico Code").
                    - generic [ref=f19e576]: Participant Accounts
                    - generic [ref=f19e577]: Each participant's account is adjusted for administrative expenses and earnings (losses). Adjustments are determined by the investments held in each participant's account, the participant's contributions, and an allocation of the Company's matching contributions to the Plan made on the participant's behalf. Forfeitures of non-vested contributions are used or allocated to restore account balances of rehired participants or participants whose distributions were previously unclaimed.
                  - generic [ref=f19e578]: "4"
                  - separator [ref=f19e581]
                  - link "Table of Contents" [ref=f19e585] [cursor=pointer]:
                    - /url: "#i8e135824d6a54019ad7e8eca6ea38b03_4"
                  - generic [ref=f19e587]:
                    - generic [ref=f19e588]: Vesting
                    - generic [ref=f19e589]: Participants are immediately vested in all elective, catch-up, rollover, Company matching and qualified non-elective contributions. A participant's profit sharing contribution account shall vest based on years of service at a rate of 20% per year from years two through six and may become fully vested upon participant retirement at age 65 or above, total and permanent disability, or death.
                    - generic [ref=f19e591]: Notes Receivable from Participants
                    - generic [ref=f19e592]:
                      - generic [ref=f19e593]: Participants may borrow from their fund accounts a minimum of $1,000 up to the lesser of (a) $50,000 or (b) 50% of their vested account balance. The administrative loan origination fee of $50 per general loan and $95 per residential loan is paid by the participant and is deducted from the proceeds of the loan. Participants may only have
                      - generic [ref=f19e594]: one
                      - text: general purpose loan and
                      - generic [ref=f19e595]: one
                      - text: residential loan outstanding at any time. Loan terms range from
                      - generic [ref=f19e596]: one
                      - text: to
                      - generic [ref=f19e597]: five years
                      - text: for general purpose loans and
                      - generic [ref=f19e598]: one
                      - text: to
                      - generic [ref=f19e599]: 15 years
                      - generic [ref=f19e600]: for residential loans. The loans are secured by the balance in the participant's account and bear fixed interest at the prime rate on the last day of the month preceding the month in which the loan is processed for payment, plus 1%. Generally, payments of principal and interest on the loan will be deducted from an employee's regular pay in equal amounts each pay period beginning with the first pay period following the date of the loan.
                    - generic [ref=f19e601]: Payment of Benefits and Withdrawals
                    - generic [ref=f19e602]: Generally, payment upon a participant's separation from the Company (and its controlled group members) is a lump-sum payment in cash for the balance of the participant's vested account. However, participants may elect to receive a single lump-sum payment of their profit sharing contributions in whole shares of Walmart equity securities, with partial or fractional shares paid in cash, even if such contributions are not invested in Walmart equity securities. To the extent the participant's profit sharing contributions are not invested in Walmart equity securities, the contributions will automatically be distributed in cash, unless directed otherwise by the participant. Participants may also elect to receive a single lump-sum payment of the remainder of their accounts in whole shares of Walmart equity securities, with partial or fractional shares paid in cash, but only to the extent such contributions are invested in Walmart equity securities as of the date distributions are processed. Participants may also elect to rollover their account balance into a different tax-qualified retirement plan or individual retirement account upon separation from the Company (and its controlled group members).
                    - generic [ref=f19e603]: The Plan permits withdrawals of active participants' elective deferrals, and rollover contributions in amounts necessary to satisfy financial hardship as defined by the Commonwealth of Puerto Rico's Department of Treasury ("Treasury"). In-service withdrawal of vested balances may be elected by participants who have reached 59 1/2 years of age. Rollovers may be distributed at any time.
                    - generic [ref=f19e604]: Investment Options
                    - generic [ref=f19e605]: A participant may direct the Custodian to invest any portion of his or her account in available investment options. Available investment options may change at any time. Participant investment options at January 31, 2026, include a variety of mutual funds. Participants may change their elections at any time.
                    - generic [ref=f19e606]: A participant may direct the Custodian to invest any portion of his or her profit sharing contributions in available investment options, including Walmart equity securities, or any of the investment options for other contributions described previously.
                    - generic [ref=f19e607]: To the extent not directed by the participant, participant accounts are invested as determined by the Benefits Investment Committee.
                  - generic [ref=f19e608]: Note 2. Summary of Significant Accounting Policies
                  - generic [ref=f19e610]:
                    - generic [ref=f19e611]: Basis of Accounting
                    - generic [ref=f19e613]: The accompanying financial statements of the Plan are prepared on the accrual basis of accounting in accordance with U.S. generally accepted accounting principles (GAAP). Contributions from Plan participants and the company matching contributions are recorded in the year in which the employee contributions are withheld from compensation.
                    - generic [ref=f19e615]:
                      - generic [ref=f19e616]: Use of Estimates
                      - generic [ref=f19e617]: The preparation of the financial statements in accordance with GAAP requires Plan management to make estimates and assumptions that affect the reported amounts of assets and liabilities and changes therein, and disclosure of contingent assets and liabilities. Actual results could differ from these estimates.
                    - generic [ref=f19e618]:
                      - generic [ref=f19e619]: Investment Valuation and Income Recognition
                      - generic [ref=f19e620]:
                        - text: Investments are reported at fair value. Fair value is the price that would be received to sell an asset or paid to transfer a liability in an orderly transaction between market participants at the measurement date. The Benefits Investment Committee determines the Plan's valuation policies utilizing information provided by the Custodian. See
                        - link "Note 3" [ref=f19e622] [cursor=pointer]:
                          - /url: "#i8e135824d6a54019ad7e8eca6ea38b03_25"
                        - text: for discussion of fair value measurements.
                  - generic [ref=f19e623]: "5"
                  - separator [ref=f19e626]
                  - link "Table of Contents" [ref=f19e630] [cursor=pointer]:
                    - /url: "#i8e135824d6a54019ad7e8eca6ea38b03_4"
                  - generic [ref=f19e632]:
                    - generic [ref=f19e633]: Purchases and sales of securities are recorded on a trade-date basis. Interest income is recorded on the accrual basis. Dividends are recorded on the ex-dividend date. Net appreciation in fair value of investments includes the gains and losses on investments bought and sold, as well as held during the year.
                    - generic [ref=f19e635]:
                      - generic [ref=f19e636]: Notes Receivable from Participants
                      - generic [ref=f19e637]: Notes receivable from participants are recorded at their unpaid principal balance plus any accrued but unpaid interest. Interest income is recorded on the accrual basis. Principal and interest from the repayment of loans are allocated to participants' investment accounts in accordance with each participant's investment election in effect at the repayment date. Delinquent notes receivable from participants are recorded as a distribution based upon the terms of the Plan document.
                    - generic [ref=f19e638]: Benefit Payments
                    - generic [ref=f19e640]: Benefit payments are recorded when paid. As of January 31, 2026 and 2025, there were benefits in the amount of $907,467 and $556,543 respectively, requested before year-end, that were paid after year-end.
                    - generic [ref=f19e642]:
                      - generic [ref=f19e643]: Expenses
                      - generic [ref=f19e644]: The Plan allows certain administrative expenses to be paid from Plan assets, unless otherwise paid by the Company. Expenses that are paid by the Company are excluded from these financial statements. The Plan does not reimburse for these expenses. Fees related to the administration of notes receivable from participants are charged directly to the participant's account and are recorded as fees on notes receivable from participants. Investment related expenses that are indirect are included in net appreciation of fair value of investments and direct expenses are included in administrative expenses.
                  - generic [ref=f19e645]: Note 3. Fair Value Measurements
                  - generic [ref=f19e647]:
                    - generic [ref=f19e648]: "Accounting guidance provides a framework for measuring fair value and provides a fair value hierarchy that prioritizes the inputs to valuation techniques used to measure fair value. The hierarchy gives the highest priority to unadjusted quoted prices in active markets for identical assets or liabilities (Level 1 measurements) and the lowest priority to unobservable inputs (Level 3 measurements). The three levels of the fair value hierarchy are described as follows:"
                    - table [ref=f19e652]:
                      - rowgroup [ref=f19e653]:
                        - row [ref=f19e654]:
                          - cell [ref=f19e655]
                          - cell [ref=f19e656]
                          - cell [ref=f19e657]
                          - cell [ref=f19e658]
                          - cell [ref=f19e659]
                          - cell [ref=f19e660]
                        - row [ref=f19e661]:
                          - cell "Level 1" [ref=f19e662]
                          - cell "Unadjusted quoted prices for identical, unrestricted assets or liabilities in active markets that a plan has the ability to access." [ref=f19e664]
                        - row [ref=f19e666]:
                          - cell "Level 2" [ref=f19e667]
                          - cell "Quoted prices for similar assets or liabilities in active markets; quoted prices for identical or similar assets or liabilities in inactive markets; inputs other than quoted prices that are observable for the asset or liability; and inputs that are derived principally from or corroborated by observable market data by correlation or other means for substantially the full term of the assets or liabilities." [ref=f19e669]
                        - row [ref=f19e671]:
                          - cell "Level 3" [ref=f19e672]
                          - cell "Significant unobservable inputs." [ref=f19e674]
                    - generic [ref=f19e676]: The asset or liability's fair value measurement level within the fair value hierarchy is based on the lowest level of any input that is significant to the fair value measurement. Valuation techniques used need to maximize the use of relevant observable inputs and minimize the use of unobservable inputs. There have been no changes in the methodologies used at January 31, 2026 and 2025. During the year ended January 31, 2026, there were no transfers of financial instruments into or out of Level 3.
                    - generic [ref=f19e677]: "Following is a description of the valuation methodologies used for assets measured at fair value:"
                    - generic [ref=f19e678]: Walmart Inc. equity securities - Valued at exchange quoted market prices on the last business day of the Plan year.
                    - generic [ref=f19e679]: Cash equivalent - Valued at amortized cost, which approximates fair value.
                    - generic [ref=f19e680]: Mutual funds - Valued at quoted market prices on the last business day of the Plan year.
                    - generic [ref=f19e681]: The preceding methods described may produce a fair value calculation that may not be indicative of net realizable value or reflective of future fair values. Furthermore, although the Plan believes its valuation methods are appropriate and consistent with other market participants, the use of different methodologies or assumptions to determine the fair value of certain financial instruments could result in a different fair value measurement at the reporting date.
