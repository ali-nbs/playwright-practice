                  - generic [ref=f19e192]: Report of Independent Registered Public Accounting Firm
                  - generic [ref=f19e194]: To the Plan Participants and the Plan Administrator of Walmart Puerto Rico 401(k) Plan
                  - generic [ref=f19e196]: Opinion on the Financial Statements
                  - generic [ref=f19e199]: We have audited the accompanying statements of net assets available for benefits of Walmart Puerto Rico 401(k) Plan (the Plan) as of January 31, 2026 and 2025, and the related statement of changes in net assets available for benefits for the year ended January 31, 2026, and the related notes (collectively referred to as the “financial statements”). In our opinion, the financial statements present fairly, in all material respects, the net assets available for benefits of the Plan at January 31, 2026 and 2025, and the changes in its net assets available for benefits for the year ended January 31, 2026, in conformity with U.S. generally accepted accounting principles.
                  - generic [ref=f19e202]: Basis for Opinion
                  - generic [ref=f19e204]: These financial statements are the responsibility of the Plan’s management. Our responsibility is to express an opinion on the Plan’s financial statements based on our audits. We are a public accounting firm registered with the Public Company Accounting Oversight Board (United States) (PCAOB) and are required to be independent with respect to the Plan in accordance with the U.S. federal securities laws and the applicable rules and regulations of the Securities and Exchange Commission and the PCAOB.
                  - generic [ref=f19e206]: We conducted our audits in accordance with the standards of the PCAOB. Those standards require that we plan and perform the audit to obtain reasonable assurance about whether the financial statements are free of material misstatement, whether due to error or fraud. The Plan is not required to have, nor were we engaged to perform, an audit of its internal control over financial reporting. As part of our audits we are required to obtain an understanding of internal control over financial reporting but not for the purpose of expressing an opinion on the effectiveness of the Plan’s internal control over financial reporting. Accordingly, we express no such opinion.
                  - generic [ref=f19e208]: Our audits included performing procedures to assess the risks of material misstatement of the financial statements, whether due to error or fraud, and performing procedures that respond to those risks. Such procedures included examining, on a test basis, evidence regarding the amounts and disclosures in the financial statements. Our audits also included evaluating the accounting principles used and significant estimates made by management, as well as evaluating the overall presentation of the financial statements. We believe that our audits provide a reasonable basis for our opinion.
                  - generic [ref=f19e210]: Supplemental Schedule Required by ERISA
                  - generic [ref=f19e212]: The accompanying supplemental schedule of assets (held at end of year) as of January 31, 2026 (referred to as the “supplemental schedule”), has been subjected to audit procedures performed in conjunction with the audit of the Plan’s financial statements. The information in the supplemental schedule is the responsibility of the Plan’s management. Our audit procedures included determining whether the information reconciles to the financial statements or the underlying accounting and other records, as applicable, and performing procedures to test the completeness and accuracy of the information presented in the supplemental schedule. In forming our opinion on the information, we evaluated whether such information, including its form and content, is presented in conformity with the Department of Labor’s Rules and Regulations for Reporting and Disclosure under the Employee Retirement Income Security Act of 1974. In our opinion, the information is fairly stated, in all material respects, in relation to the financial statements as a whole.
                  - generic [ref=f19e215]: /s/ Ernst & Young LLP
                  - generic [ref=f19e217]: We have served as the Plan’s auditor since 1998.
