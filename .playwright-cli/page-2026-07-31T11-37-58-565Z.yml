                  - generic [ref=f19e866]: Note 4. Related Party and Party-In-Interest Transactions
                  - generic [ref=f19e868]:
                    - generic [ref=f19e869]: Certain Plan investments are managed by Bank of America, N.A. and Merrill Lynch & Company, who provide investment management services to the Plan. The Plan also holds notes receivable from participants. Such transactions, while considered party-in-interest transactions under ERISA regulations, are permitted under the provisions of the Plan and are specifically exempt from the prohibition of party-in-interest transactions under ERISA.
                    - generic [ref=f19e870]: A portion of the Plan's assets are invested in common stock of the Company. While the holding and acquisition of employer securities is generally prohibited by ERISA, the Plan meets the exception in ERISA section 407(b), which permits the acquisition and holding of employer securities by eligible individual account plans.
                  - generic [ref=f19e871]: Note 5. Plan Termination
                  - generic [ref=f19e873]: While there is no intention to do so, the Company may terminate the Plan and discontinue its contributions at any time subject to the provisions of the Puerto Rico Code and ERISA. In the event of complete or partial Plan termination, any unvested amounts in participants' accounts shall become fully vested. The Plan shall remain in effect and the assets shall be administered in the manner provided by the terms of the trust agreement and distributed as soon as administratively feasible.
                  - generic [ref=f19e875]: Note 6. Tax Status
                  - generic [ref=f19e877]: The Plan has received a determination letter from the Puerto Rico Department of Treasury (the Treasury) dated July 22, 2020, stating that the Plan is qualified under Section 1081.01 of the Puerto Rico Internal Revenue Code of 2011. Once qualified, the Plan is required to operate in conformity with the Puerto Rico Code to maintain its qualified status. Processes are in place to prevent operational failures, but when they occur, the Administrator takes corrective action to preserve the tax qualification of the Plan. Specifically, the Administrator has corrected, and will continue to correct, operational failures in a manner permitted under the Treasury in order to preserve the Plan's tax favored qualification. Although the Plan has been amended since receiving the determination letter, the Administrator and the Plan's tax counsel believe that the Plan is designed, and is currently being operated, in compliance with the applicable requirements of the Puerto Rico Code and, therefore, believe that the Plan is qualified, and the related trust is tax-exempt.
                  - generic [ref=f19e879]: Note 7. Risks and Uncertainties
                  - generic [ref=f19e881]: The Custodian holds the Plan's investments and executes all investment transactions. The Plan invests in various investment securities. Investment securities are exposed to various risks, such as interest rate, market volatility and credit risks. The Plan attempts to limit these risks by authorizing and offering participants a broad range of investment options that are invested in high quality securities or are offered and administered by reputable and known investment companies. Due to the level of risk associated with certain investment securities, it is at least reasonably possible that changes in the values of investment securities will occur in the near term and that such changes could materially affect participants' account balances and the amounts reported on the Statements of Net Assets Available for Benefits. The Plan's exposure to a concentration of risk is limited by the diversification of investments across multiple investment fund options. Additionally, the investments within each investment fund option are further diversified into varied financial instruments.
