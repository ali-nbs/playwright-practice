                        - text: The majority of our revenue and long-lived assets are attributable to operations in the U.S. for all periods presented. In addition to shipments in the U.S., we also ship our Energy Server systems to other countries, primarily, the Republic of Korea, Japan, India and Taiwan (collectively referred to as the “Asia Pacific region”), and several European countries, namely Germany, UK and Italy. Revenue generated in the U.S. represented
