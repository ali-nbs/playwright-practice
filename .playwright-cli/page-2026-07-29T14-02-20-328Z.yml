                      - generic [ref=f10e4356]:
                        - generic [ref=f10e4357]:
                          - text: We account for potential recoveries of previously paid import tariffs by applying the loss recovery model by analogy to
                          - generic [ref=f10e4358]: ASC 410-30
                        - text: ", Asset Retirement and Environmental Obligations-Environmental Obligations"
                        - generic [ref=f10e4359]:
                          - text: (“ASC 410‑30”). Consistent with
                          - generic [ref=f10e4360]: ASC 410-30
                        - text: ", which references the probability threshold in"
                        - generic [ref=f10e4361]: ASC 450-20
                        - text: ", Loss Contingencies, we recognize a receivable for tariff refunds when recovery is deemed probable and the amount can be reasonably estimated. The recognized receivable is limited to the amount of tariff costs previously recognized in the condensed consolidated statements of operations. We do not recognize amounts in excess of such previously recognized costs."
                      - generic [ref=f10e4362]: We evaluate the probability of recovery based on all available evidence, including the status of refund processes, legal developments, and our intent and ability to pursue claims. If recovery is not considered probable, no asset is recorded. We reassess this conclusion each reporting period.
