                  - generic [ref=f10e4327]: 2. Summary of Significant Accounting Policies
                  - generic [ref=f10e4329]:
                    - generic [ref=f10e4330]: Refer to the accounting policies described in Part II, Item 8, Note 2-Summary of Significant Accounting Policies in our 2025 Form 10-K.
                    - generic [ref=f10e4331]:
                      - generic [ref=f10e4332]: Equity Method Accounting for Investments in Unconsolidated Affiliates
                      - generic [ref=f10e4333]:
                        - generic [ref=f10e4334]:
                          - text: The distribution rights and priorities set forth in the LLC agreements governing the unconsolidated affiliates differ from Bloom’s underlying percentage ownership interests in those entities. Accordingly, we allocate income or loss from the unconsolidated affiliates using the hypothetical liquidation at book value (“HLBV”) method, which is an acceptable application of the equity method of accounting under Accounting Standards Codification (“
                          - generic [ref=f10e4335]: ASC”) 323
                        - text: ", Investments-Equity Method and Joint Ventures"
                        - generic [ref=f10e4336]:
                          - text: (“
                          - generic [ref=f10e4337]: ASC 323
                        - text: ”) when contractual cash distribution provisions differ from stated ownership percentages.
                      - generic [ref=f10e4338]: Due to the timing of receipt of the unconsolidated affiliates’ financial information, we apply the equity method on a one-quarter reporting lag. Bloom monitors the unconsolidated affiliates for material intervening events during the lag period, and any such events are evaluated and, if necessary, disclosed or reflected in the current reporting period. Management believes that the use of this reporting lag is reasonable and does not materially affect our condensed consolidated results of operations.
                      - generic [ref=f10e4339]: Under the HLBV method, at each reporting date, we calculate the amount we would receive if each unconsolidated affiliate were to liquidate all of its assets at their U.S. GAAP book values and distribute the resulting proceeds to creditors and
                  - generic [ref=f10e4340]: "10"
                  - separator [ref=f10e4343]
                  - generic [ref=f10e4346]:
                    - generic [ref=f10e4347]:
                      - generic [ref=f10e4348]: members in accordance with the liquidation priorities set forth in the governing LLC agreement. Our share of income or loss from each unconsolidated affiliate for the period equals the change in our calculated liquidation claim between the beginning and end of the reporting period, adjusted for capital contributions and distributions during the period. The resulting equity method income or loss is presented as a single line item, Equity in earnings (loss) of unconsolidated affiliates, in our condensed consolidated statements of operations.
                      - generic [ref=f10e4349]: Key inputs to the HLBV calculation include each unconsolidated affiliates’ U.S. GAAP net income or loss, taxable income or loss, book and tax depreciation, Section 704(b) capital account balances, capital contributions and distributions, transferable investment tax credits, and target returns and liquidation priorities specified in the governing LLC agreements. Changes in any of these inputs could have a significant impact on the amount we would be entitled to receive upon a hypothetical liquidation and, consequently, on our equity in earnings or loss from the unconsolidated affiliates.
                    - generic [ref=f10e4350]:
                      - generic [ref=f10e4351]: Distributions Received From Unconsolidated Affiliates
                      - generic [ref=f10e4352]: We use the “cumulative earnings” approach to classify distributions received from unconsolidated affiliates in our condensed consolidated statements of cash flows. Under this method, distributions received from unconsolidated affiliates are included in our condensed consolidated statements of cash flows as operating activities, unless cumulative distributions exceed our share of cumulative equity in the investee’s net earnings. In such cases, the excess distributions are considered returns of investment and are classified as investing activities.
                    - generic [ref=f10e4353]: For a complete discussion of our accounting policies, refer to Part II, Item 8, Note 2-Summary of Significant Accounting Policies in our 2025 Form 10-K.
