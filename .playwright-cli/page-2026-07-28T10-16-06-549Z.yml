                    - text: "): Clarifying the Effective Date\". The new guidance is intended to enhance transparency and disclosures by requiring public business entities to disclose additional information about specific expense categories in the notes to financial statements at interim and annual reporting periods. The ASU is effective for the first annual reporting periods after December 15, 2026, and interim periods within annual reporting periods beginning after December 15, 2027, with early adoption permitted. The Company is in the process of evaluating the impact that the adoption of this ASU will have on its financial statements and related disclosures, which is not expected to be material."
