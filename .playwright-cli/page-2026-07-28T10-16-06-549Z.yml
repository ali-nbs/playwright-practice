                  - generic [ref=f28e1840]: Champions Oncology, Inc.
                  - generic [ref=f28e1843]: Opinion on the Financial Statements
                  - generic [ref=f28e1846]: We have audited the accompanying consolidated balance sheets of Champions Oncology, Inc. and Subsidiaries (the “Company”) as of April 30, 2026 and 2025, and the related consolidated statements of operations, stockholders’ equity (deficiency), and cash flows for each of the years then ended, and the related notes (collectively referred to as the “financial statements”). In our opinion, the financial statements present fairly, in all material respects, the consolidated financial position of the Company as of April 30, 2026 and 2025, and the consolidated results of their operations and their cash flows for each of the years then ended in conformity with accounting principles generally accepted in the United States of America.
                  - generic [ref=f28e1850]: Basis for Opinion
                  - generic [ref=f28e1852]: These financial statements are the responsibility of the Company’s management. Our responsibility is to express an opinion on the Company’s financial statements based on our audits. We are a public accounting firm registered with the Public Company Accounting Oversight Board (United States) (“PCAOB”) and are required to be independent with respect to the Company in accordance with the U.S. federal securities laws and the applicable rules and regulations of the Securities and Exchange Commission and the PCAOB.
                  - generic [ref=f28e1854]: We conducted our audits in accordance with the standards of the PCAOB. Those standards require that we plan and perform the audit to obtain reasonable assurance about whether the financial statements are free of material misstatement, whether due to error or fraud. The Company is not required to have, nor were we engaged to perform, an audit of its internal control over financial reporting. As part of our audits, we are required to obtain an understanding of internal control over financial reporting but not for the purpose of expressing an opinion on the effectiveness of the Company’s internal control over financial reporting. Accordingly, we express no such opinion.
                  - generic [ref=f28e1856]: Our audits included performing procedures to assess the risks of material misstatement of the financial statements, whether due to error or fraud, and performing procedures that respond to those risks. Such procedures included examining, on a test basis, evidence regarding the amounts and disclosures in the financial statements. Our audits also included evaluating the accounting principles used and significant estimates made by management, as well as evaluating the overall presentation of the financial statements. We believe that our audits provide a reasonable basis for our opinion.
                  - generic [ref=f28e1858]: Critical Audit Matter
                  - generic [ref=f28e1860]: "Critical audit matters are matters arising from the current period audit of the financial statements that were communicated or required to be communicated to the audit committee and that: (1) relate to accounts or disclosures that are material to the financial statements and (2) involved our especially challenging, subjective, or complex judgments. We determined that there are no critical audit matters."
