                  - generic [ref=f28e1057]: Overview and Recent Developments
                  - generic [ref=f28e1059]: We are a technology-enabled research organization engaged in creating transformative technology solutions to be utilized in drug discovery and development. Our research center consists of a comprehensive set of computational and experimental research platforms. Our pharmacology, biomarker, and data platforms are designed to facilitate drug discovery and development at lower costs and increased speeds. We perform studies which we believe may predict the efficacy of experimental oncology drugs or approved drugs as stand-alone therapies or in combination with other drugs and can stimulate the results of human clinical trials. These studies include in vivo studies that rely on implanting multiple tumors from our TumorBank in mice and testing the therapy of interest on these tumors. Studies may also include bioinformatics analysis that reveal the differences in the genetic signatures of the tumors that responded to a therapy as compared to the tumors that did not respond. Additionally, we provide computational or experimental support to identify novel therapeutic targets, select appropriate patient populations for clinical evaluation, identify potential therapeutic combination strategies, and develop biomarker hypothesis of sensitivity or resistance. These studies include the use of our in vivo, ex vivo, analytical and computational platforms.
                  - generic [ref=f28e1061]: We are engaged in the development and sale of advanced technology solutions and products to personalize the development and use of oncology drugs through our Translational Oncology Solutions ("TOS"). This technology ranges from computational-based discovery platforms, unique oncology software solutions, and innovative and proprietary experimental tools such as in vivo, ex vivo and biomarker platforms. Utilizing our TumorGraft Technology Platform (the "Platform"), a comprehensive bank of unique, well characterized Patient Derived Xenograft ("PDX") models, we provide select services to pharmaceutical and biotechnology companies seeking personalized approaches to drug development. By performing studies to predict the efficacy of oncology drugs, our Platform facilitates drug discovery with lower costs and increased speed of drug development as well as increased adoption of existing drugs.
                  - generic [ref=f28e1063]: We offer access to certain PDX model data via licensing agreements. As our Platform has been expanded over time with the collection of models and the enhancement of their characterization, we have developed a robust multi-omic dataset with substantial potential for both drug discovery and development. This dataset serves as a vital resource for both our pharmaceutical and biotechnology customer who gain access to model-specific data and further their research via licensed access.
                  - generic [ref=f28e1065]: We also offer Lumin Bioinformatics ("Lumin"), an oncology data-driven software program which contains comprehensive information derived from our research services and clinical studies. Lumin leverages Champions’ large Datacenter coupled with analytics and artificial intelligence to provide a robust tool for computational cancer research. It is the combination of the Datacenter and the analytics that create a foundation for Lumin. Insights developed using Lumin can provide the basis for biomarker hypotheses, reveal potential mechanisms of therapeutic resistance, and guide the direction of additional preclinical evaluations.
                  - generic [ref=f28e1067]: Our drug discovery and development business leverages the computational and experimental capabilities within our platforms. Our discovery strategy utilizes our rich and unique Datacenter, coupled with artificial intelligence and other advanced computational analytics, to identify novel therapeutic targets. We then employ the use of our proprietary experimental platforms to rapidly validate these targets for further drug development efforts.
                  - generic [ref=f28e1069]: We have a pipeline of targets at various stages of discovery and validation, with a select group that has progressed to early stage therapeutic development. Our commercial strategy for the validated targets and therapeutics established from this business is wide-ranging and still being developed. It will depend on many factors, and will be specific for each target or therapeutic area identified. Any expenses associated with this part of our business are research and development and are expensed as incurred.
                  - generic [ref=f28e1071]: We regularly evaluate strategic options to create additional value from our drug discovery business, which may include, but are not limited to, potential spin-out transactions, licensing opportunities, or capital raises.
