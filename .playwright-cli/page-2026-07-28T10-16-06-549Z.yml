                    - text: Controls and Procedures
                  - generic [ref=f28e1621]: Management's Report on Disclosure Controls and Procedures
                  - generic [ref=f28e1623]: Our management, under the supervision and with the participation of our Principal Executive Officer (our Chief Executive Officer) and Principal Financial Officer (our Chief Financial Officer), has evaluated the effectiveness of our disclosure controls and procedures as of April 30, 2026, the end of our fiscal year covered by this Annual Report. The term “disclosure controls and procedures,” as defined in Rules 13a-15(e) and 15d-15(e) under the Securities Exchange Act of 1934, as amended, or the Exchange Act, means controls and other procedures of a company that are designed to ensure that information required to be disclosed by a company in the reports that it files or submits under the Exchange Act is recorded, processed, summarized and reported, within the time periods specified in the Securities and Exchange Commission’s rules and forms. Disclosure controls and procedures include, without limitation, controls and procedures designed to ensure that information required to be disclosed by a company in the reports that it files or submits under the Exchange Act is accumulated and communicated to the company’s management, including its principal executive and principal financial officers, or person performing similar functions, as appropriate to allow timely decisions regarding required disclosure.
                  - generic [ref=f28e1626]: Management recognizes that any disclosure controls and procedures, no matter how well designed and operated, can provide only reasonable assurance of achieving their objectives, and management necessarily applies its judgment in evaluating the cost-benefit relationship of possible controls and procedures. Based on the evaluation of our disclosure controls and procedures as of April 30, 2026, our Chief Executive Officer and Chief Financial Officer have concluded that, as of April 30, 2026, our disclosure controls and procedures are effective.
                  - generic [ref=f28e1628]: Management’s Annual Report on Internal Control over Financial Reporting
                  - generic [ref=f28e1631]: Management is responsible for establishing and maintaining adequate internal control over financial reporting as defined in Rules 13a-15(f) and 15d-15(f) under the Exchange Act. This rule defines internal control over financial reporting as a process designed by, or under the supervision of, Company management to provide reasonable assurance regarding the reliability of financial reporting and the preparation of financial statements for external purposes in accordance with GAAP. Management has assessed the effectiveness of our internal control over financial reporting using the components established in the Internal Control-Integrated Framework (2013) issued by the Committee of Sponsoring Organizations of the Treadway Commission.
                  - generic [ref=f28e1634]: A system of internal control over financial reporting is a process designed to provide reasonable assurance regarding the reliability of financial reporting and the preparation of financial statements for external purposes in accordance with generally accepted accounting principles. A material weakness is any deficiency, or combination of deficiencies, in internal control over financial reporting, such that there is a reasonable possibility that a material misstatement of our company’s annual or interim financial statements will not be prevented or detected on a timely basis.
                  - generic [ref=f28e1636]: Based upon this evaluation, our Chief Executive Officer and Chief Financial Officer concluded that our internal control over financial reporting was effective as of April 30, 2026, the end of the fiscal year covered by this Annual Report.
                  - generic [ref=f28e1639]: Changes in Internal Controls
                  - generic [ref=f28e1641]: There were no changes in the Company’s internal controls over financial reporting during the quarter ended April 30, 2026, that materially affected, or were reasonably likely to materially affect the Company’s internal control over financial reporting.
