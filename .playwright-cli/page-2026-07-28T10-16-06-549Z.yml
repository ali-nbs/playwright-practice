                    - generic [ref=f28e4217]: Contract Balances
                  - generic [ref=f28e4219]: Contract assets include unbilled amounts typically resulting from revenue recognized in excess of the amounts billed to the customer for which the right to payment is subject to factors other than the passage of time. These amounts may not exceed their net realizable value. Contract assets are classified as current. Contract liabilities consist of customer payments received in advance of performance and billings in excess of revenue recognized, net of revenue recognized from the balance at the beginning of the period. Contract assets and liabilities are presented on the balance sheet on a net contract-by-contract basis at the end of each reporting period. Refer to Note 3 for related balances.
                  - generic [ref=f28e4222]: Note 6. Significant Customers
                  - generic [ref=f28e4224]: For the year ended April 30, 2026, one of our customers accounted for 10% or more of our total revenue, at 24%. For the year ended April 30, 2025, the same customer accounted for 10% or more of our total revenue, at 13%, and an additional customer accounted for 10% of our total revenue.
                  - generic [ref=f28e4229]: As of April 30, 2026, our significant customer also accounted for 25% of our total net accounts receivable balance.
