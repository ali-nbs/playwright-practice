                  - generic [ref=f28e6339]:
                    - generic [ref=f28e6340]: Related party transactions include transactions between the Company and its shareholders, management, or affiliates. The following transactions were in the normal course of operations and were measured at the exchange amount, which is the amount of consideration established and agreed to by the parties.
                    - generic [ref=f28e6342]: Consulting Services
                    - generic [ref=f28e6344]: For fiscal years ended April 30, 2026 and 2025, the Company paid a member of its Board of Directors $0 and $12,000, respectively for consulting services unrelated to his duties as a board member. All of the amounts paid to this related party have been recognized in expense in the period the services were performed within general and administrative expenses in the accompanying consolidated statements of operations.
                  - generic [ref=f28e6347]: Note 12. Leases
                  - generic [ref=f28e6350]:
                    - generic [ref=f28e6351]:
                      - generic [ref=f28e6352]:
                        - text: The Company accounts for its leases under
                        - generic [ref=f28e6353] [cursor=pointer]: ASC 842
                      - text: . Under this guidance, arrangements meeting the definition of a lease are classified as operating or financing leases, and are recorded on the consolidated balance sheet as both an operating lease ROU asset and operating lease liability, calculated by discounting fixed lease payments over the lease term at the rate implicit in the lease or the Company’s incremental borrowing rate. Lease liabilities are increased by interest and reduced by payments each period, and the right of use asset is amortized over the lease term. For operating leases, interest on the lease liability and the amortization of the right of use asset result in straight-line rent expense over the lease term. Variable lease expenses, if any, are recorded when incurred. The Company has elected to apply the short-term lease exemption practical expedient for each class of underlying assets and excludes short-term leases having initial terms of 12 months or less. The Company recognizes rent expense on a straight-line basis over the lease term for these short-term leases. The Company has determined that no material embedded leases exist. Under
                      - generic [ref=f28e6354] [cursor=pointer]: ASC 842
                      - text: ", the Company determines if an arrangement is a lease at inception. ROU assets and liabilities are recognized at commencement date based on the present value of remaining lease payments over the lease term. For this purpose, the Company considers only payments that are fixed and determinable at the time of commencement. As the Company's leases do not provide an implicit rate, the Company uses an incremental borrowing rate based on the information available at commencement date in determining the present value of lease payments."
                    - generic [ref=f28e6356]: Operating Leases
                    - generic [ref=f28e6359]:
                      - text: The Company currently leases certain office equipment and its office and laboratory facilities under non-cancelable operating leases. Rent expense for operating leases is recognized on a straight-line basis over the lease term from the lease commencement date through the scheduled expiration date. Rent expenses totaled $
                      - generic [ref=f28e6360]: "1.8"
                      - text: million for the years ended April 30, 2026 and 2025.
                    - generic [ref=f28e6362]: "The Company leases the following facilities:"
                    - generic [ref=f28e6364]:
                      - text: •
                      - generic [ref=f28e6365]: One University Plaza, Suite 307, Hackensack, New Jersey 07601, which, since November 2011, serves as the Company’s corporate headquarters. The lease expires in November 2026. The Company recognized $78,000 and $75,000 of rent expense relative to this lease for fiscal 2026 and 2025, respectively.
                    - generic [ref=f28e6366]:
                      - text: •
                      - generic [ref=f28e6367]:
                        - text: 1330 Piccard Drive Suite 025, Rockville, MD 20850, which consists of laboratory and office space where the Company conducts operations related to its primary service offerings. The Company executed the original lease in January 2017 and the operating commencement date was August 11, 2017. The lease was amended to expand the premises and extend the expiration date in March 2020 and again in December 2020. This lease expires in February 2029. The Company recognized $
                        - generic [ref=f28e6368]: "1.7"
                        - text: million of rent expense for both fiscal 2026 and 2025.
                    - generic [ref=f28e6369]:
                      - text: •
                      - generic [ref=f28e6370]:
                        - text: VIA LEONE XIII, 14, Milan, Italy, which consists of laboratory and office space where the Company conducted operations related to its flow cytometry service offerings. The Company executed the lease in November 2022. The lease was set to expire October 31, 2028. During the three months ended October 31, 2025, the Company exercised its right to terminate the lease early. The lease terminated April 30, 2026 and the Company is not currently utilizing a physical site in Italy. As part of this lease modification, the Company recorded a reduction to its right of use asset related to this lease of $108,000 during the year ended April 30, 2026. The Company also recorded a reduction to the current and non-current portions of the related operating lease liabilities of $16,000 and $101,000, respectively, during the year. These reductions resulted in the recording of a gain on lease termination of $9,000. The Company recognized $
                        - generic [ref=f28e6371]: 50,000
                        - text: of rent expense associated with this lease in Italy for both fiscal 2026 and 2025.
