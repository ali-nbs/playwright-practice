                    - generic [ref=f28e3991]: During the year ended April 30, 2026, the Company sold and disposed of lab equipment with a cost of $307,000 and accumulated depreciation of $172,000, for proceeds of $24,000, resulting in a loss on sale and disposal of equipment recorded of $111,000. During the year ended April 30, 2025, the Company disposed of lab equipment with a cost of $636,000 and accumulated depreciation of $343,000 as of the disposal date, resulting in a loss on disposal of equipment recorded of $293,000.
                    - generic [ref=f28e3994]: Finance Lease
                    - generic [ref=f28e3996]: During fiscal 2022, the Company recognized a finance lease for laboratory equipment. This equipment was obtained as the result of a laboratory supplies purchase commitment with costs of approximately $370,000 at inception through December 2025. Cash payments for this lease were in the form of consideration for purchasing lab supplies under a purchase commitment agreement. The present value of the minimum future obligations of $370,000 was calculated based on an interest rate of 3.25%. Depreciation and amortization expense related to this finance lease was $59,000 and $77,000 for the years ended April 30, 2026 and 2025, respectively. Interest on the related finance lease liability was approximately $600 and $3,000 for the years ended April 30, 2026 and 2025, respectively.
                    - generic [ref=f28e3999]: During fiscal 2023, the Company recognized a finance lease for laboratory equipment. This equipment was obtained as the result of a laboratory supplies purchase commitment with costs of approximately $368,000 at inception through May 2027. Cash payments for this lease are in the form of consideration for purchasing lab supplies under a purchase commitment agreement. The present value of the minimum future obligations of $368,000 was calculated based on an interest rate of 3.5%. Depreciation and amortization expense related to this finance lease was $76,000 and $73,000 for the years ended April 30, 2026 and 2025, respectively. Interest on the related finance lease liability was approximately $4,000 and $7,000 for the years ended April 30, 2026 and 2025, respectively.
