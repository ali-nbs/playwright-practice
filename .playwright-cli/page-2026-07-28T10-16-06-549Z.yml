                  - generic [ref=f28e3398]:
                    - generic [ref=f28e3399]: Impairment of Long-Lived Assets
                    - generic [ref=f28e3404]:
                      - text: Impairment losses are to be recognized when the carrying amount of a long-lived asset is not recoverable or exceeds its fair value. The Company evaluates its long-lived assets for impairment whenever events or changes in circumstances indicate that a carrying value may not be recoverable. The Company uses estimates of future cash flows over the remaining useful life of a long- lived asset or asset group to determine the recoverability of the asset. These estimates only include the net cash flows directly associated with, and that are expected to arise as a direct result of, the use and eventual disposition of the asset or asset group. The Company did
                      - generic [ref=f28e3405]: "no"
                      - text: t recognize any impairment losses for the Company’s long-lived assets for the years ended April 30, 2026 and 2025 . Refer to Note 4, "Property and Equipment".
                    - generic [ref=f28e3407]:
                      - generic [ref=f28e3408]: Goodwill
                      - generic [ref=f28e3411]:
                        - generic [ref=f28e3412]:
                          - text: "Goodwill represents the excess of the purchase price over the fair value of the net tangible and identifiable intangible assets acquired in a business combination. The Company evaluates the carrying value of goodwill annually in connection with the annual budgeting and forecast process and also between annual evaluations if events occur or circumstances change that would more likely than not reduce the fair value of the reporting unit to which goodwill was allocated to below its carrying amount. Such circumstances could include, but are not limited to: (1) a significant adverse change in legal factors, market conditions, or in business climate, (2) unanticipated competition, or (3) an adverse action or assessment by a regulator. When evaluating goodwill for impairment, the Company may first perform an assessment qualitatively whether it is more likely than not that a reporting unit’s carrying amount exceeds its fair value, referred to as a “step zero” approach. Subsequently (if necessary after step zero), an entity should perform its goodwill impairment test by comparing the fair value of a reporting unit with its carrying value. Under FASB's Accounting Standards Update (\""
                          - generic [ref=f28e3413] [cursor=pointer]: ASU") 2014-02
                        - text: ","
                        - generic [ref=f28e3414] [cursor=pointer]: Topic 350
                        - text: ", \"Intangibles-Goodwill and Other\" goodwill impairment is measured as the excess of the carrying amount of the reporting unit over its fair value."
                    - generic [ref=f28e3417]:
                      - text: Judgments regarding the existence of impairment indicators are based on legal factors, market conditions and operational performance of the businesses. Future events, including but not limited to continued declines in economic activity, loss of contracts or a significant number of customers, or a rapid increase in costs or capital expenditures, could cause the Company to conclude that impairment indicators exist and that goodwill is impaired. For the years ended April 30, 2026 and 2025, the Company's annual assessment did
                      - generic [ref=f28e3418]: "no"
                      - text: t result in any impairment indicators.
                    - generic [ref=f28e3420]:
                      - generic [ref=f28e3421]: Cost of Oncology Revenue
                      - generic [ref=f28e3424]: Cost of oncology revenue consists of direct costs related to laboratory supplies, mice purchases, and maintenance costs for studies completed internally as well as charges from Contract Research Organizations for studies handled externally. Indirect costs include salaries and other payroll related costs of compensation for personnel directly engaged in providing Translational Oncology Solutions ("TOS") products and services. All costs of performing studies in-house are expensed as incurred. All costs of performing studies from external sources are expensed when incurred.
                    - generic [ref=f28e3426]: Research and Development
                    - generic [ref=f28e3430]: Research and development costs represent both costs incurred internally for research and development activities, including personnel costs, mice purchases, and maintenance, as well as costs incurred externally to facilitate research activities, such as tumor tissue procurement and characterization expenses. All research and development costs are expensed as incurred.
                    - generic [ref=f28e3433]:
                      - generic [ref=f28e3434]: Sales and Marketing
                      - generic [ref=f28e3437]: Sales and marketing expenses represent costs incurred to promote the Company’s products offered, including salaries, benefits and related costs of our sales and marketing personnel, and represent costs of advertising and other selling and marketing expenses. All sales and marketing costs, including advertising costs, are expensed as incurred.
                    - generic [ref=f28e3439]:
                      - generic [ref=f28e3440]: Earnings Per Share
                      - generic [ref=f28e3443]: Basic net income or loss per share is computed by dividing the net income or loss for the period by the weighted-average number of shares of common stock outstanding during the period. Diluted net income per share is computed by dividing the net income for the period by the weighted-average number of shares of common stock plus dilutive potential common stock considered outstanding during the period. Such dilutive shares consist of incremental shares that would be issued upon exercise of the Company’s common stock options using the treasury method. Dilutive earnings per share is not presented when it would be antidilutive to do so.
                  - separator [ref=f28e3447]
                  - generic [ref=f28e3448]:
                    - generic [ref=f28e3449]: CHAMPIONS ONCOLOGY
                    - generic [ref=f28e3450]: NOTES TO CONSOLIDATED FINANCIAL STATEMENTS (Continued)
                  - generic [ref=f28e3452]:
                    - generic [ref=f28e3454]:
                      - generic [ref=f28e3455]: Stock-based Payments
                      - generic [ref=f28e3458]: The Company generally recognizes expense for stock-based payments based on the fair value of awards on the date of grant. The Company primarily uses the Black-Scholes option pricing model to estimate fair value. If awards contain market-based vesting conditions, a Monte Carlo simulation model is used to estimate fair value. The Black-Scholes option valuation model was developed for use in estimating the fair value of short-traded options that have no vesting restrictions and are fully transferable. The Monte Carlo simulation model is a generally accepted valuation technique that incorporates multiple potential future stock price paths and is particularly appropriate for awards with market-based performance conditions, as it captures the probability of achieving the applicable market condition over the expected term of the award.
                      - generic [ref=f28e3460]: Both valuation models require the Company to estimate certain key assumptions such as expected life, volatility, risk free interest rates and dividend yield, as applicable, to determine the grant date fair value of stock-based awards. These assumptions are based on historical information and management judgment. The risk-free interest rate used is based on the United States treasury security rate with a term consistent with the expected term of the award at the time of the grant. Since the Company has limited option exercise history, it has generally elected to estimate the expected life of an award based upon the Securities and Exchange Commission-approved “simplified method” noted under the provisions of Staff Accounting Bulletin No. 107 with the continued use of this method extended under the provisions of Staff Accounting Bulletin No. 110. Estimated volatility is based upon the historical volatility of the Company's common stock. The Company does not anticipate paying a dividend, and therefore, no expected dividend yield was used. For awards valued using the Monte Carlo simulation model, the valuation also incorporates the probability of achieving the applicable market condition and, where applicable, the correlation of the Company's stock price with the relevant market index or peer group. Forfeitures are accounted for as they occur.
                    - generic [ref=f28e3462]: The Company expenses stock-based payments over the period that the awards are expected to vest. The Company expenses modification charges in the period of modification and, if required, over the remaining period the awards are expected to vest.
                    - generic [ref=f28e3465]:
                      - generic [ref=f28e3466]: Income Taxes
                      - generic [ref=f28e3469]: Deferred income taxes have been provided to show the effect of temporary differences between the recognition of expenses for financial and income tax reporting purposes and between the tax basis of assets and liabilities, and their reported amounts in the consolidated financial statements. In assessing the realizability of deferred tax assets, the Company assesses the likelihood that deferred tax assets will be recovered through tax planning strategies or from future taxable income, and to the extent that recovery is not likely or there is insufficient operating history, a valuation allowance is established. The Company adjusts the valuation allowance in the period management determines it is more likely than not that net deferred tax assets will or will not be realized. Changes in valuation allowances from period to period are included in the tax provision in the period of change. As of April 30, 2026 and 2025, the Company provided a valuation allowance for all net deferred tax assets, as recovery is not more likely than not based on an insufficient history of earnings.
                      - generic [ref=f28e3471]: The Company reflects tax benefits only if it is more likely than not that the Company will be able to sustain the tax position, based on its technical merits. If a tax benefit meets this criterion, it is measured and recognized based on the largest amount of benefit that is cumulatively greater than 50% likely to be realized. As of April 30, 2026 and 2025, the Company did not record any liabilities related to uncertain tax positions. The Company’s practice is to recognize interest and/or penalties related to income tax matters in income tax expense. The Company did not accrue any interest or penalties in the Company’s consolidated statements of operations for the years ended April 30, 2026 and 2025.
                      - generic [ref=f28e3473]: For the years ended April 30, 2026 and 2025, the Company recognized income tax expense of $246,000 and an income tax benefit of $75,000, respectively. For the year ended April 30, 2026, income tax expense of $246,000 is mainly attributable to U.S. state income taxes due to net operating loss limitations and taxable income earned in Israel and Italy relating to transfer pricing. For the year ended April 30, 2025, the income tax benefit of $75,000 is related to the same items as indicated for the year ending 2026, net of a $181,000 reversal of an uncertain tax liability in Israel.
                    - generic [ref=f28e3477]:
                      - generic [ref=f28e3478]: Revenue Recognition
                      - generic [ref=f28e3481]:
                        - generic [ref=f28e3482]:
                          - text: The Company recognizes revenue in accordance with
                          - generic [ref=f28e3483] [cursor=pointer]: ASC 606
                        - text: ", \"Revenue from Contracts with Customers\". The objective of the standard is to establish a single comprehensive revenue recognition model that is designed to create greater comparability of financial statements across industries and jurisdictions. Under this standard, companies recognize revenue to depict the transfer of goods or services to customers in amounts that reflect the consideration to which the Company expects to be entitled in exchange for those goods or services."
                  - separator [ref=f28e3487]
                  - generic [ref=f28e3488]:
                    - generic [ref=f28e3489]: CHAMPIONS ONCOLOGY
                    - generic [ref=f28e3490]: NOTES TO CONSOLIDATED FINANCIAL STATEMENTS (Continued)
                  - generic [ref=f28e3494]:
                    - generic [ref=f28e3495]: "All revenue is generated from contracts with customers. The Company recognizes revenue when control of these services is transferred to the customer in an amount, referred to as the transaction price, that reflects the consideration to which the Company is expected to be entitled in exchange for those services. The Company determines revenue recognition utilizing the following five steps: (1) identification of the contract with a customer, (2) identification of the performance obligations in the contract (promised goods or services that are distinct), (3) determination of the transaction price, (4) allocation of the transaction price to the performance obligations, and (5) recognition of revenue when, or as, the Company transfers control of the product or service for each performance obligation. The Company records revenues net of any tax assessments by governmental authorities, such as value added taxes, that are imposed on and concurrent with specific revenue generating transactions."
                    - generic [ref=f28e3497]: The majority of the Company's revenue arrangements are service contracts that are completed within a year or less. There are a few contracts that range in duration between 1 and 3 years. Substantially all of the Company's performance obligations, and associated revenue, are transferred to the customer over time. Most of the Company's contracts can be terminated by the customer without cause. In the event of termination, the Company's contracts provide that the customer pay the Company for services rendered through the termination date. The Company generally receives compensation based on a predetermined invoicing schedule relating to specific milestones for that contract.
                    - generic [ref=f28e3500]:
                      - generic [ref=f28e3501]:
                        - text: Amendments to contracts are common. The Company evaluates each amendment which meets the criteria of a contract modification under
                        - generic [ref=f28e3502] [cursor=pointer]: ASC 606
                      - text: . Each modification is further evaluated to determine whether the contract modification should be accounted for as a separate contract or as a continuation of the original agreement.
                    - generic [ref=f28e3504]:
                      - generic [ref=f28e3505]:
                        - text: The Company accounts for amendments as a separate contract as they meet the criteria under
                        - generic [ref=f28e3506] [cursor=pointer]: ASC 606-10-25-12
                      - text: .
                    - generic [ref=f28e3508]: Pharmacology Study and Other Services
                    - generic [ref=f28e3511]: The Company generally enters into contracts with customers to provide oncology services with payments based on fixed-fee arrangements. At contract inception, the Company assesses the services promised in the contracts with customers to identify the performance obligations in the arrangement. The Company's fixed-fee arrangements for oncology services are considered a single performance obligation because the Company provides a highly-integrated service.
                    - generic [ref=f28e3513]: The Company recognizes revenue over time using a progress-based input method since there is no single output measure that would fairly depict the transfer of control over the life of the performance obligation. Revenue is recognized for the single performance obligation over time due to the Company's right to payment for work performed to date and the performance does not create an asset with an alternative use. The Company recognizes revenue as portions of the overall performance obligation are completed as this best depicts the progress toward the complete satisfaction of the performance obligation.
                    - generic [ref=f28e3515]: License Revenue
                    - generic [ref=f28e3518]: The Company also enters into contracts to provide access to certain Patient Derived Xenograft ("PDX") model data via a license agreement with payments based on a fixed-fee arrangement. The Company's current data licenses contain a single performance obligation of delivering access to the data license. The Company recognizes this license revenue up-front, at a point in time, when the performance obligation is satisfied with the delivery of the data.
                    - generic [ref=f28e3520]: Incremental Costs of Obtaining a Contract (Sales Commissions)
                    - generic [ref=f28e3523]:
                      - generic [ref=f28e3524]:
                        - text: Under
                        - generic [ref=f28e3525] [cursor=pointer]: ASC 606
                      - text: ", the costs of obtaining a contract can be expensed immediately, rather than capitalized and amortized, if the amortization period is one year or shorter. Sales commissions for the Company represent contract costs with a term of one year or less. Therefore, under"
                      - generic [ref=f28e3526] [cursor=pointer]: ASC 606
                      - text: ", the Company elected the practical expedient to expense these costs as incurred."
                    - generic [ref=f28e3529]: Accounts Receivables, Unbilled Services and Deferred Revenue
                    - generic [ref=f28e3532]: In general, billings and payments are established by contractual provisions including predetermined payment schedules, which may or may not correspond to the timing of the transfer of control of the Company's services under the contract. In general, the Company's intention in its invoicing (payment terms) is to maintain cash neutrality over the life of the contract, with terms generally being 30-90 days. Upfront payments, when they occur, are intended to cover certain expenses the Company incurs at the beginning of the contract. Neither the Company nor its customers view such upfront payments and contracted payment schedules as a means of financing. Unbilled services primarily arise when the revenue recognized exceeds
