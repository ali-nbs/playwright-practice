                    - generic [ref=f28e4247]: Legal Matters
                    - generic [ref=f28e4249]: The Company is not currently party to any legal matters to its knowledge. The Company is not aware of any other matters that would have a material impact on the Company’s financial position or results of operations.
                    - generic [ref=f28e4251]: Registration Payment Arrangements
                    - generic [ref=f28e4253]: The Company has entered into an Amended and Restated Registration Rights Agreement in connection with a private placement in March 2015. This Amended and Restated Registration Rights Agreement contains provisions that may call for the Company to pay penalties in certain circumstances. This registration payment arrangement primarily relates to the Company’s ability to file a registration statement within a particular time period, have a registration statement declared effective within a particular time period and to maintain the effectiveness of the registration statement for a particular time period. The Company has not accrued any liquidated damages associated with the Amended and Restated Registration Right Agreement as the Company has filed the required registration statement and anticipates continued compliance with the agreement.
                    - generic [ref=f28e4255]: Royalties
                  - generic [ref=f28e4257]: The Company contracts with third-party vendors to license tumor samples for development into PDX models and use in our TOS business. These types of arrangements have an upfront fee ranging from approximately nil to $30,000 per tumor sample depending on the successful growth of the tumor model and ability to develop them into a sellable product. The upfront costs are expensed as incurred. In addition, under certain agreements, for a limited period of time, the Company is subject to royalty payments if the licensed tumor models are used for sale in our TOS business, ranging from 2% to 20% of the contract price after recouping certain initiation costs. Some of these arrangements also set forth an annual minimum royalty due regardless of tumor models used for sale. For the years ended April 30, 2026 and 2025, the Company has recognized approximately $594,000 and $462,000 in expense related to these royalty arrangements, respectively. Royalty expense is included in cost of oncology revenue in the accompanying consolidated statements of operations.
