                  - generic [ref=f28e6586]: Note 13. Subsequent Events
                  - generic [ref=f28e6589]:
                    - generic [ref=f28e6590]:
                      - generic [ref=f28e6591]:
                        - text: On June 5, 2026, subsequent to the 2026 fiscal year-end balance sheet date, the Company executed an amendment to its existing operating lease for its office and lab space located in Rockville, MD , extending the lease term through March 31, 2037. The amendment will be accounted for as a lease modification in accordance with
                        - generic [ref=f28e6592] [cursor=pointer]: ASC 842
                      - text: in the first quarter of fiscal 2027.
                    - generic [ref=f28e6595]:
                      - text: Based on its preliminary assessment, the Company expects the lease modification to increase its operating lease right-of-use assets and its operating lease liabilities by approximately $
                      - generic [ref=f28e6596]: "6.3"
                      - text: million. The amendment is also expected to increases the Company's future contractual minimum lease payment obligations by approximately $16.9 million over the remaining lease term through March 31, 2037. These amounts are preliminary and may change upon completion of the Company's detailed lease accounting analysis.
