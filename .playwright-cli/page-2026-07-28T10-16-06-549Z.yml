                  - separator [ref=f28e3274]
                  - generic [ref=f28e3277]: CHAMPIONS ONCOLOGY
                  - generic [ref=f28e3278]: NOTES TO CONSOLIDATED FINANCIAL STATEMENTS
                  - generic [ref=f28e3280]: Note 1. Organization and Basis of Presentation
                  - generic [ref=f28e3282]:
                    - generic [ref=f28e3284]: Background
                    - generic [ref=f28e3286]: Champions Oncology, Inc. ("we", "our", or the “Company”), is engaged in drug discovery and development through data-driven research strategies and innovative pharmacology, biomarker and data platforms. The Company’s TumorGraft Technology Platform ("the "Platform”), a comprehensive bank (the "Bank") of unique, well characterized "Patient Derived XenoGrafts" (PDX) models, is an approach to personalizing cancer care based upon the implantation of human tumors in immune-deficient mice. The Company provides a technology platform to pharmaceutical and biotechnology companies using proprietary TumorGraft studies, which the Company believes may be predictive of how drugs may perform in clinical settings. Utilizing the Platform, the Company offers multiple services to pharmaceutical and biotechnology companies seeking personalized approaches to drug development. By performing studies to predict the efficacy of oncology drugs, our Platform is designed to facilitate drug discovery with lower costs and increased speed of drug development as well as increased adoption of existing drugs.
                    - generic [ref=f28e3289]:
                      - text: "The Company has four operating subsidiaries: Champions Oncology (Israel), Limited, Champions Biotechnology U.K., Limited, Champions Oncology S.R.L., and Corellia AI, Inc. For the years ended April 30, 2026 and 2025, there were"
