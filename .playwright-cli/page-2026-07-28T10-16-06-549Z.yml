                    - generic [ref=f28e6018]: Management has evaluated the available evidence about future tax planning strategies, taxable income, and other possible sources of realization of deferred tax assets and has established a full valuation allowance against its net deferred tax assets as of April 30, 2026 and 2025. For the years ended April 30, 2026 and 2025, the Company recorded a valuation allowance of $16.3 million and $14.8 million, respectively. The net increase in the valuation allowance of $1.5 million during the fiscal year ended April 30, 2026, was mainly due to increases in the deferred tax assets related to the net operating loss carryforward, net of decreases for other timing differences. The net increase of $1.5 million related to the U.S. federal and state/local jurisdictions of $0.1 million and $1.4 million, respectively. The valuation allowance related to the state/local jurisdictions increased mainly due to changes in the blended state statutory tax rate due to changes in state apportionment percentages.
                    - generic [ref=f28e6021]: The net decrease in the valuation allowance of $3.3 million during the fiscal year ended April 30, 2025, was mainly due to decreases in the deferred tax assets related to the net operating loss carryforward, stock-based compensation, and capitalized research expenses. The net decrease of $3.3 million related to the U.S. federal and state/local jurisdictions of $3.1 million and $200,000, respectively. Management continues to assess the realizability of the deferred tax assets at each interim and annual balance sheet date based upon actual and forecasted operating results.
                    - generic [ref=f28e6024]: As of April 30, 2026 and 2025, the Company’s estimated U.S. net operating loss carry-forwards were approximately $41.0 million and $35.1 million, respectively. Net operating losses generated prior to May 1, 2018 have a 20-year carryforward and will begin expiring in 2034 for federal and 2031 for state and local tax purposes. Losses generated in the fiscal years since the year ended April 30, 2019 may be carried forward indefinitely. A valuation allowance has been recorded against all of the deferred tax assets related to the loss carryforwards.
                    - generic [ref=f28e6027]: Under the provisions of the Internal Revenue Code, certain substantial changes in the Company’s ownership may result in a limitation on the amount of net operating losses that may be utilized in future years. During the fiscal year ended April 30, 2013, approximately $12.0 million of the Company’s net operating losses became subject to limitation under Internal Revenue Code Section 382 in connection with an ownership change on January 28, 2013. As a result of the ownership change, the Company’s annual limitation on its use of net operating loss carry-forwards is approximately $432,000.
                    - generic [ref=f28e6030]: The Company files income tax returns in various jurisdictions with varying statutes of limitations. As of April 30, 2026, the earliest tax year still subject to examination for state purposes is fiscal 2022. The Company’s tax years for periods ending April 30, 2014 and forward are subject to examination by the United States and certain states due to the carry-forward of unutilized net operating losses. In Israel, tax returns remain open to review by the Israel Tax Authority (ITA) for four years from the end of the tax year in which the return was filed. The Company's tax years for periods ending April 30, 2020 and forward are subject to examination by the ITA.
                    - generic [ref=f28e6032]: The Company intends to indefinitely reinvest the earnings of its foreign subsidiaries and, therefore, has not recognized deferred taxes on the related outside basis differences.
