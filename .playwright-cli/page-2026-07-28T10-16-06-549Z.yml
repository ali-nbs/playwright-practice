                    - generic [ref=f28e5160]: Share Repurchase Program
                  - generic [ref=f28e5162]: On March 29, 2023, the Board of Directors approved a share repurchase program authorizing the Company to purchase up to an aggregate of $5.0 million of the Company’s common stock. The share repurchase program is designed in accordance with Rule 10b-18 of the Exchange Act. The shares may be purchased from time to time in the open market, as permitted under applicable rules and regulations, at prevailing market prices. The timing and amount of repurchases will depend on market conditions, share price, applicable legal requirements and other factors. The program does not obligate the Company to acquire a minimum number of shares. As of April 30, 2026, the Company had purchased approximately 120,300 shares of its common stock, at an average price of $5.73 per share, totaling approximately $708,000 and leaving an available balance of approximately $4.3 million authorized by the Board for use in the program as of that date. The Company did not purchase any shares of its common stock during the year ended April 30, 2026.
