                  - generic [ref=f28e3541]:
                    - generic [ref=f28e3542]:
                      - generic [ref=f28e3543]: the amount billed to the customer. Such situations occur due to divergences between revenue recognition and the invoicing milestones which are based on predetermined payment terms. Unbilled services are classified as a component of accounts receivable on the balance sheet.
                      - generic [ref=f28e3545]: Accounts receivable are customer obligations due under normal trade terms. The Company extends credit to its customers based on their creditworthiness and historical data and performs ongoing credit evaluations of our customers’ financial condition. The Company maintains a provision for estimated credit losses related to accounts receivable for future expected bad debt resulting from the inability or unwillingness of our customers to make required payments. We estimate our provision for estimated credit losses based on relevant information such as historical experience, current economic conditions, and future expectations of specifically identified customer balances. This provision is adjusted as appropriate to reflect current conditions. After all attempts to collect a receivable have failed, the receivable is written off against the provision. We do not obtain collateral from our customers to secure accounts receivable.
                      - generic [ref=f28e3547]: Deferred revenue consists of unearned payments received in excess of revenue recognized. As the contracted services are subsequently performed and the associated revenue recognized, the deferred revenue balance is reduced by the amount of the revenue recognized during the period. Deferred revenue is classified as a current liability on the consolidated balance sheet as the Company expects to recognize the associated revenue in less than one year.
                    - generic [ref=f28e3549]:
                      - generic [ref=f28e3550]: Segment Reporting
                      - generic [ref=f28e3553]: Operating segments are identified as components of an enterprise for which separate discrete financial information is available for evaluation by the Company’s chief operating decision maker (“CODM”) and relied upon when making decisions regarding resource allocation and assessing performance. When evaluating the Company’s financial performance, the CODM reviews total revenues, total expenses, and expenses by functional classification, using this information to make decisions on a Company-wide basis.
                      - generic [ref=f28e3556]:
                        - text: The Company currently operates in
                        - generic [ref=f28e3557]: one
                        - text: reportable segment pertaining to oncology services. The CODM for the Company is the Chief Executive Officer (the “CEO”). The Company’s CEO reviews operating results on an aggregate basis and manages the Company’s operations on a consolidated basis for the purpose of evaluating financial performance and allocating resources. Accordingly, the Company has determined that it has a single reportable and operating segment structure. The CEO uses net income or loss as well as revenue results to allocate resources in the annual budgeting and forecasting process and also uses that measure as a basis for evaluating financial performance regularly by comparing actual results with established budgets and forecasts. All significant expense categories are presented on our Consolidated Statements of Operations. The measure of segment assets is reported on the Consolidated Balance Sheet as total assets. Segment revenues and expenses are identical to that disclosed in the accompanying Consolidated Statements of Operations.
