                  - generic [ref=f28e1486]: Research and development expense increased $2.3 million, or 33.1% for the year ended April 30, 2026 compared to the prior year. The increase was primarily driven by increased investment in the Company's data platform, including higher sequencing and laboratory costs, as well as higher compensation expenses associated with these initiatives.
                  - generic [ref=f28e1488]: Sales and Marketing
                  - generic [ref=f28e1490]: Sales and marketing expense increased $1.8 million or 23.5% for the year ended April 30, 2026 compared to the prior year. The increase was primarily driven by higher compensation costs associated with the expansion of the Company's commercial organization, including personnel supporting both its pharmacology services and data licensing businesses.
                  - generic [ref=f28e1492]: General and Administrative
                  - generic [ref=f28e1494]: General and administrative expense increased $1.8 million, or 19.4% for the year ended April 30, 2026 compared to the prior year. The increase was primarily driven by higher information technology costs, stock-based compensation and compensation-related expenses, including costs associated with changes in executive leadership.
                  - generic [ref=f28e1496]: Loss on Disposal of Equipment
                  - generic [ref=f28e1498]: Loss on disposal of equipment was $111,000 and $293,000 for the years ended April 30, 2026 and 2025, respectively, a decrease of $182,000 or 62%. For both years ended April 30, 2026 and 2025, the losses resulted from the disposal of equipment which could no longer be utilized and had a net book value, or carrying value on the balance sheet, as of the disposal date.
                  - generic [ref=f28e1500]: Other Income, net
                  - generic [ref=f28e1502]: Other income, net, was $211,000 and $73,000 for the years ended April 30, 2026 and 2025, respectively. The increase was primarily attributable to higher interest income.
                  - generic [ref=f28e1504]: Income Taxes, net
                  - generic [ref=f28e1506]: For the years ended April 30, 2026 and 2025, the Company recognized income tax expense of $246,000 and an income tax benefit of $75,000, respectively. For the year ended April 30, 2026, income tax expense of $246,000 is mainly attributable to U.S. state income taxes due to net operating loss limitations and taxable income earned in Israel and Italy relating to transfer pricing. For the year ended April 30, 2025, the income tax benefit of $75,000 is related to the same items as indicated for the year ending 2026, net of a $181,000 reversal of an uncertain tax liability in Israel.
                  - generic [ref=f28e1509]: "18"
                  - separator [ref=f28e1512]
                  - generic [ref=f28e1516]: Liquidity and Capital Resources
                  - generic [ref=f28e1518]: Our liquidity needs have typically arisen from the funding of our research and development programs and the launch of new products, working capital requirements, and other strategic initiatives. In the past, we have met these cash requirements through our cash on hand, working capital management, proceeds from certain private placements and public offerings of our securities and sales of products and services. For the years ended April 30, 2026 and 2025, the Company had a net loss of approximately $1.2 million and net income of approximately $4.7 million, respectively. As of April 30, 2026, the Company had an accumulated deficit of approximately $81.1 million, negative working capital of $703,000 and cash of $4.9 million. For the twelve months ended April 30, 2026, the Company used cash flow from operations of approximately $4.5 million. Despite our negative working capital at this date and use of cash from operations, we believe that our cash on hand, together with expected cash flows from operations, are adequate to fund operations through at least August 2027. Should the Company be required to raise additional capital, there can be no assurance that management would be successful in raising such capital on terms acceptable to us, if at all.
                  - generic [ref=f28e1520]: Cash Flows
                  - generic [ref=f28e1522]: "The following discussion relates to the major components of our cash flows:"
                  - generic [ref=f28e1524]: Cash Flows from Operating Activities
                  - generic [ref=f28e1526]: Net cash used in operating activities was $4.5 million for the year ended April 30, 2026 compared to net cash provided by operating activities of $7.4 million for the year ended April 30, 2025. The decrease was primarily driven by a $6.6 million decrease in deferred revenue, compared to a $3.3 million increase in the prior year. The decrease in deferred revenue was primarily attributable to lower bookings and the timing of customer billings and study activity. Cash flow from operations was also impacted by the net loss in fiscal 2026 and an increase in accounts receivable, partially offset by an increase in accounts payable.
                  - generic [ref=f28e1528]: Cash Flows from Investing Activities
                  - generic [ref=f28e1530]: Net cash used in investing activities was $540,000 and $389,000 for the years ended April 30, 2026 and 2025, respectively. The cash used was for the investment in lab and computer equipment which, in fiscal 2026, was partially offset by proceeds from the sale of certain equipment.
                  - generic [ref=f28e1532]: Cash Flows from Financing Activities
                  - generic [ref=f28e1534]: Net cash provided by financing activities was $99,000 for the year ended April 30, 2026. Net cash provided by financing activities was $170,000 for the year ended April 30, 2025. Cash flows provided by financing activities in both 2026 and 2025 was generated from the proceeds of stock option exercises offset by financing lease payments.
                  - generic [ref=f28e1536]: Critical Accounting Policies
                  - generic [ref=f28e1539]: We prepare our Consolidated Financial Statements in accordance with U.S. Generally Accepted Accounting Principles (“GAAP”). Our significant accounting policies are described in Note 2 - Summary of Significant Accounting Policies to our Consolidated Financial Statements attached hereto. We believe the following critical accounting policies involve the most significant judgments and estimates used in the preparation of our Consolidated Financial Statements.
                  - generic [ref=f28e1541]: Revenue Recognition
                  - generic [ref=f28e1544]:
                    - generic [ref=f28e1545]:
                      - text: The Company accounts for revenue under the Financial Accounting Standards Board's ("FASB") Accounting Standards Codification ("
                      - generic [ref=f28e1546] [cursor=pointer]: ASC") 606
                    - text: ", Revenue from Contracts with Customers. In accordance with (\""
                    - generic [ref=f28e1547] [cursor=pointer]: ASC 606
                    - text: "\"), revenue is recognized when, or as, a customer obtains control of promised services. The amount of revenue recognized reflects the consideration to which the Company expects to be entitled to receive in exchange for these services."
                  - generic [ref=f28e1549]:
                    - generic [ref=f28e1550]:
                      - text: A performance obligation is a promise (or a combination of promises) in a contract to transfer distinct goods or services to a customer and is the unit of accounting under
                      - generic [ref=f28e1551] [cursor=pointer]: ASC 606
                    - text: for the purposes of revenue recognition. A contract's transaction price is allocated to each separate performance obligation based upon the standalone selling price and is recognized as revenue, when, or as, the performance obligation is satisfied. The majority of the Company's contracts have a single performance
                  - generic [ref=f28e1552]: "19"
                  - separator [ref=f28e1555]
                  - generic [ref=f28e1558]: obligation because the promise to transfer individual services is not separately identifiable from other promises in the contracts, and therefore, is not distinct.
                  - generic [ref=f28e1560]: The majority of the Company's revenue arrangements are service contracts that are completed within a year or less. There are a few contracts that range in duration between 1 and 3 years. Substantially all of the Company's performance obligations, and associated revenue, are transferred to the customer over time. Most of the Company's contracts can be terminated by the customer without cause. In the event of termination, the Company's contracts provide that the customer pay the Company for services rendered through the termination date. The Company generally receives compensation based on a predetermined invoicing schedule relating to specific milestones for that contract.
                  - generic [ref=f28e1562]:
                    - generic [ref=f28e1563]:
                      - text: Amendments to contracts are common. The Company evaluates each amendment which meets the criteria of a contract modification under
                      - generic [ref=f28e1564] [cursor=pointer]: ASC 606
                    - text: . Each modification is further evaluated to determine whether the contract modification should be accounted for as a separate contract or as a continuation of the original agreement.
                  - generic [ref=f28e1566]:
                    - generic [ref=f28e1567]:
                      - text: The Company accounts for amendments as a separate contract when they meet the criteria under
                      - generic [ref=f28e1568] [cursor=pointer]: ASC 606-10-25-12
                    - text: .
                  - generic [ref=f28e1570]: Stock-Based Payments
                  - generic [ref=f28e1573]: We typically recognize expense for stock-based payments based on the fair value of awards on the date of grant. We use the Black-Scholes option pricing model to estimate fair value. The option pricing model requires us to estimate certain key assumptions such as expected life, volatility, risk free interest rates, and dividend yield to determine the fair value of stock-based awards. These assumptions are based on historical information and management judgment. We expense stock-based payments over the period that the awards are expected to vest. In the event of forfeitures, compensation expense is adjusted.
                  - generic [ref=f28e1575]: Recent Accounting Pronouncements
                  - generic [ref=f28e1578]:
                    - generic [ref=f28e1579]:
                      - text: In December 2023, the FASB issued
                      - generic [ref=f28e1580] [cursor=pointer]: ASU 2023-09
                    - text: ", “Improvements to Tax Disclosures” ("
                    - generic [ref=f28e1581] [cursor=pointer]: Topic 740
                    - text: ). The new guidance is intended to enhance the transparency and decision usefulness of income tax disclosures through changes to the rate reconciliation and the income taxes paid information disclosed. The ASU is effective retrospectively for fiscal years beginning after December 15, 2024, with early adoption permitted. The Company adopted this ASU as of May 1, 2025, and it has been included in the required disclosures in our financial statements since.
