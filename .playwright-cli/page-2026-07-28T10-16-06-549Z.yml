                  - generic [ref=f28e1412]: Cost of Oncology Revenue
                  - generic [ref=f28e1414]: Cost of oncology revenue was $30.9 million and $28.4 million for the years ended April 30, 2026 and 2025, respectively, an increase of $2.5 million or 8.8%. The increase was primarily driven by higher outsourced laboratory costs associated with the expansion of our radiopharmacology services. During fiscal 2026, we transitioned these capabilities in-house, which we expect will reduce our reliance on outsourced laboratory services and associated costs for fiscal 2027.
