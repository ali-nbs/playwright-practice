                  - generic [ref=f28e956]: Item 1C. Cybersecurity
                  - generic [ref=f28e959]: Risk Management and Strategy
                  - generic [ref=f28e964]:
                    - text: We believe we maintain an information technology and security program appropriate for a company of our size, taking into account our operations and risks. We recognize the critical importance of maintaining the trust and confidence of our investors, employees, customers and vendors.
                    - generic [ref=f28e965]: We have implemented cybersecurity processes designed to assess, identify, and manage risks from potential unauthorized occurrences on or through our information technology systems that may result in adverse effects on the confidentiality, integrity, and availability of these systems and the data residing therein. These processes include mechanisms, controls, and certain technologies designed to prevent or mitigate system intrusion or data loss, theft, misuse, or other security incidents or vulnerabilities and maintain a stable and secure information technology environment. For example, we conduct ongoing monitoring of critical systems for any compromised or potentially compromised accounts. We conduct regular trainings on cyber and information security, along with phishing simulations, among other topics. In addition, we consult with an outside information technology consultant on a regular basis to assist with assessing, identifying, and managing cybersecurity risks, including to anticipate future threats and trends, and their impact on the Company’s risk environment.
                  - generic [ref=f28e967]: Governance
                  - generic [ref=f28e972]:
                    - text: Our Board of Directors oversees our risk management process.
                    - generic [ref=f28e973]:
                      - text: The Audit Committee, by way of Board delegation, retains oversight of the Company’s cybersecurity risks.
                      - generic [ref=f28e974]:
                        - generic [ref=f28e975]: The senior leadership team, including our Chief Financial Officer and Chief Executive Officer, provides periodic reports to our Board, as applicable.
                        - text: Our Director of Information Technology Strategy and Operations is responsible for leading the assessment and management of cybersecurity threats and periodically updating the Audit Committee as needed.
                  - generic [ref=f28e977]: To date, we have not identified risks from known cybersecurity threats, including as a result of any prior cybersecurity incidents, that have materially affected us, including our operations, business strategy, results of operations, or financial condition.
