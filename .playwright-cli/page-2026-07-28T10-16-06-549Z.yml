                    - generic [ref=f28e3340]:
                      - text: The Company considers only those investments which are highly liquid, readily convertible to cash, and with original maturities of three months or less to be cash equivalents. As of April 30, 2026 and 2025, the Company had cash balances of $4.9 million and $9.8 million, respectively, and
                      - generic [ref=f28e3341]: "no"
                      - text: cash equivalents. The Company maintains its cash balances in
                      - generic [ref=f28e3342]: three
                      - text: major financial institutions which exceed federally insured limits. The Company regularly monitors the financial stability of these financial institutions and believes that it is not exposed to any significant credit risk in its cash. If any liquidity and/or financial stability concerns arise with respect to banks and financial institutions, either nationally or in specific regions, the Company's ability to access cash or enter into new financing arrangements may be threatened, which could have a material adverse effect on its business, financial condition and results of operations.
                    - generic [ref=f28e3344]: Liquidity
                    - generic [ref=f28e3347]: Our liquidity needs have typically arisen from the funding of our research and development programs and the launch of new products, working capital requirements, and other strategic initiatives. In the past, we have met these cash requirements through our cash on hand, working capital management, proceeds from certain private placements and public offerings of our securities, and sales of products and services. For the year ended April 30, 2026, the Company had a net loss of approximately $1.2 million, an accumulated deficit of approximately $81.1 million, negative working capital of approximately $703,000 and cash of $4.9 million. Despite the negative working capital, we believe that our cash on hand, together with expected cash flows from operations, are adequate to fund operations through at least August 2027. Should the Company be required to raise additional capital, there can be no assurance that management would be successful in raising such capital on terms acceptable to us, if at all.
                    - generic [ref=f28e3351]:
                      - generic [ref=f28e3352]: Fair Value
                      - generic [ref=f28e3355]: "The carrying value of cash, accounts receivable, prepaid expenses, and other current assets, accounts payable, and accrued liabilities approximate their fair value based on the liquidity or the short-term maturities of these instruments. The fair value hierarchy promulgated by GAAP consists of three levels:"
                      - generic [ref=f28e3357]: •Level one - Quoted market prices in active markets for identical assets or liabilities;
                      - generic [ref=f28e3358]: •Level two - Inputs other than level one inputs that are either directly or indirectly observable; and
                      - generic [ref=f28e3359]: •Level three - Unobservable inputs developed using estimates and assumptions, which are developed by the reporting entity and reflect those assumptions that a market participant would use.
                    - generic [ref=f28e3362]:
                      - text: Determining which category an asset or liability falls within the hierarchy requires significant judgment. The Company evaluates its hierarchy disclosures each quarter. The Company has
                      - generic [ref=f28e3363]: "no"
                      - text: assets or liabilities that are measured at fair value on a recurring and/or non-recurring basis during the years ended April 30, 2026 and 2025.
                    - generic [ref=f28e3371]: Property and Equipment
                    - generic [ref=f28e3376]:
                      - generic [ref=f28e3377]: Property and equipment is recorded at cost and primarily consists of laboratory equipment, furniture and fixtures, computer hardware and software, leasehold improvements, and internally developed software. Assets in progress include equipment or software not yet placed in service. Depreciation and amortization is calculated on a straight-line basis over the estimated useful lives of the various assets ranging from three to seven years.
                      - text: Refer to Footnote 4, "Property and Equipment" for a detailed discussion.
                    - generic [ref=f28e3379]:
                      - generic [ref=f28e3380]: Leases
                      - generic [ref=f28e3383]:
                        - generic [ref=f28e3384]:
                          - text: The Company accounts for its leases under Financial Accounting Standards Board ("FASB")
                          - generic [ref=f28e3385] [cursor=pointer]: ASC Topic 842
                        - text: ", Leases (\""
                        - generic [ref=f28e3386] [cursor=pointer]: ASC 842
                        - text: "\"). Under this guidance, arrangements meeting the definition of a lease are classified as operating or financing leases and are recorded on the consolidated balance sheet as both a right-of-use (\"ROU\") asset and lease liability, calculated by discounting fixed lease payments over the lease term at the rate implicit in the lease or the Company’s incremental borrowing rate. As the Company's leases do not provide an implicit rate, the Company uses an incremental borrowing rate based on the information available at commencement date in determining the present value of lease payments. Lease liabilities are increased by interest and reduced by payments each period, and the right-of-use asset is amortized over the lease term. For operating leases, interest on the lease liability and the amortization of the right-of-use asset result in straight-line rent expense over the lease term."
                      - generic [ref=f28e3388]: Amortization expense for the ROU asset associated with its finance leases is recognized on a straight-line basis over the term of the lease and interest expense associated with its finance lease is recognized on the balance of the lease liability using the effective interest method based on the estimated incremental borrowing rate.
