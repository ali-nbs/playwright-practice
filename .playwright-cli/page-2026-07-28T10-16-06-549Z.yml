                  - generic [ref=f28e1392]: Pharmacology Services
                  - generic [ref=f28e1394]: •Pharmacology services revenue increased for the year ended April 30, 2026 compared to the prior year. The increase was primarily driven by improved conversion of previously booked studies into revenue, including studies that had been expected to convert in the prior fiscal year but were delayed into fiscal 2026. The timing and progress of study activity can impact the period in which bookings convert to revenue.
                  - generic [ref=f28e1396]: TOS Data License Revenue
                  - generic [ref=f28e1398]: •TOS data license revenue decreased for the year ended April 30, 2026 compared to the prior year. Fiscal 2025 revenue primarily reflected a significant data license transaction with a single customer, while fiscal 2026 revenue was generated from multiple, smaller customer contracts. Although fiscal 2026 did not include a comparable large transaction, the Company expanded its data licensing customer base during the year.
                  - generic [ref=f28e1400]: Other TOS Revenue
                  - generic [ref=f28e1402]: •Other TOS revenue includes additional clinical services provided to the Company's pharmaceutical and biotechnology customers specifically for flow cytometry and SaaS provided via Lumin. Other TOS revenue decreased for the year ended April 30, 2026 compared to the prior year, primarily due to lower flow cytometry revenue as the Company strategically shifted its focus and investment away from this area of the business.
