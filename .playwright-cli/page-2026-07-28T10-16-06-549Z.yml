                  - generic [ref=f28e568]: "1"
                  - separator [ref=f28e571]
                  - generic [ref=f28e574]: As used in this Annual Report on Form 10-K (this "Annual Report"), “Champions Oncology, Inc.,” “Champions,” the “Company,” “we,” “ours,” and “us” refer to Champions Oncology, Inc. and its subsidiaries, except where the context otherwise requires or as otherwise indicated.
                  - generic [ref=f28e576]: DISCLOSURE REGARDING FORWARD-LOOKING STATEMENTS
                  - generic [ref=f28e578]: This Annual Report contains “forward-looking statements” within the meaning of Section 27A of the Securities Act of 1933, as amended, and Section 21E of the Securities Exchange Act of 1934, as amended, (the "Exchange Act") that inherently involve risk and uncertainties. Forward-looking statements may be identified by the words “project,” “believe,” “anticipate,” “plan,” “expect,” “estimate,” “intend,” “should,” “would,” “could,” “will,” “may,” “likely” or similar expressions. Forward-looking statements in this Annual Report include statements about our business strategies and products development activities, including the anticipated benefits and risks associated with those strategies as well as statements about the sufficiency of our capital resources. One should not place undue reliance on these forward-looking statements. We cannot guarantee that we will achieve the plans, intentions or expectations expressed or implied in our forward-looking statement. There are a number of important factors that could cause actual results, levels of activity, performance or events to differ materially from those expressed or implied in the forward-looking statements we make. These important factors are described under “Risk Factors” set forth below. In addition, any forward-looking statements we make in this Annual Report speak only as of the date of this document, and we do not intend to update any such forward-looking statements to reflect events or circumstances that occur after that date, except as required by law. As a result of these and other factors, our stock price may fluctuate dramatically.
                  - generic [ref=f28e581]: PART I
                  - generic [ref=f28e583]:
                    - generic [ref=f28e584]: Item 1.
                    - text: Business
                  - generic [ref=f28e586]: Overview
                  - generic [ref=f28e588]: We are a technology-enabled research organization engaged in creating technology solutions to be utilized in drug discovery and development. Our research center operates in both regulatory and non-regulatory environments and consists of a comprehensive set of computational and experimental research platforms. Our pharmacology, biomarker, and data platforms are designed to facilitate drug discovery and development at lower costs and increased speeds.
                  - generic [ref=f28e590]: At the core of our research platforms is our unique, proprietary bank of Patient Derived Xenograft (PDX) models. This preeminent bank of PDX models is deployed into advanced in vivo and ex vivo pharmacology platforms, providing an enhanced level of insight into therapeutic programs. We currently have approximately 1,500 PDX Models in our TumorBank that we believe reflect the characteristics of patients who enroll in clinical trials (late stage, pretreated and metastatic). This characteristic of our TumorBank is an important differentiator to other established PDX banks. We implant and expand these tumors in mice, which allows for future studies and additional characterization of the tumor. Additional analytical and pharmacology experimental platforms are also available to augment the information gained from studies performed.
                  - generic [ref=f28e592]: The PDX bank is highly characterized at the molecular, phenotypic and pharmacological levels, which provides a differentiated layer of data for our large oncology dataset (the "Datacenter"). The Datacenter combines our proprietary dataset with other large publicly available datasets. This dataset currently includes approximately 3,500 molecular datasets (genomics, transcriptomics, proteomics, phosphor-proteomics), approximately 3,000 clinical drug responses, approximately 3,500 in vivo drug responses, and the accompanying clinical information on the patients from which they were derived (pre and post tumor sample acquisition of drug treatments and responses, age, gender, ethnicity, tumor stage, tumor grade, location of tumor biopsy, histology, etc.) derived from our TumorBank. One unique feature of this proprietary dataset is the fact that it is derived from a living TumorBank. This allows us to continue characterizing the TumorBank over time and increase the depth of characterization of the accumulated data. The combination of the breadth and depth of the TumorBank, and associated characterization, drives the value of our Datacenter. The Datacenter also includes approximately 20,000 publicly available datasets including genomics, transcriptomics, proteomics, and functional genomics, and patient outcome. This Datacenter facilitates our computational approach to drug discovery and provides the foundation to our Software as a Service ("SaaS") offerings. Collectively, our computational and experimental research platforms enable a more rapid and precise approach to drug discovery and development.
                  - generic [ref=f28e594]: "Through our technology platforms, we have designed an ecosystem of business lines consisting of:"
                  - generic [ref=f28e596]: •The sale of research services utilizing our innovative research platforms to biopharmaceutical companies
                  - generic [ref=f28e597]: •The sale of PDX model data and oncology research SaaS tools to cancer research scientists
                  - generic [ref=f28e598]: •The discovery and development of novel oncology therapeutics
                  - generic [ref=f28e599]: "2"
                  - separator [ref=f28e602]
                  - generic [ref=f28e606]: Translational Oncology Solutions (TOS) Business
                  - generic [ref=f28e608]: Research Services
                  - generic [ref=f28e610]: Our research services utilize our research center to assist pharmaceutical and biotechnology companies with their drug development process. We perform studies which we believe may predict the efficacy of experimental oncology drugs or approved drugs as stand-alone therapies or in combination with other drugs and can simulate the results of human clinical trials. These studies include in vivo studies that rely on implanting multiple tumors from our TumorBank in mice and testing the therapy of interest on these tumors. Studies may also include bioinformatics analysis that reveal the differences in the genetic signatures of the tumors that responded to a therapy as compared to the tumors that did not respond. Our studies can be used to determine which types of cancer, if any, may be inhibited by a drug. The studies can also be used to identify specific sub-populations, often characterized by particular genetic mutations that are differentially sensitive or resistant to a drug or drug combination. Additionally, we provide computational or experimental support to identify novel therapeutic targets, select appropriate patient populations for clinical evaluation, identify potential therapeutic combination strategies, and develop biomarker hypothesis of sensitivity or resistance. These studies include the use of our in vivo, ex vivo, analytical and computational platforms.
                  - generic [ref=f28e612]: Increasing the breadth of the TumorBank is an important strategic effort of the Company. We invest significant research and development resources to increase the number of PDX Models in our TumorBank and add unique and different sub-types of cancer that are not historically addressed. This effort also allows us to build highly valuable PDX models derived from patients with resistance to specific therapies or important molecular annotations. We also invest significant resources to increase the depth of characterization of the TumorBank. For each model, this characterization includes phenotypic analysis, molecular analyses, and pharmacologic analysis. This depth of characterization, in an individual tumor basis, is unique and not widely available.
                  - generic [ref=f28e614]: We have performed studies for approximately 500 different pharmaceutical and biotechnology companies over the past ten years, have a high rate of repeat business, and contract with pharmaceutical and biotechnology companies across North America, Europe and Asia. Studies are performed in a preclinical non-regulatory environment, as well as a Good Clinical Regulatory Practice (GCLP) regulatory environment for clinical evaluation. Typical studies are in the $125,000 price range, with an increasing number of studies in the $250,000 to $500,000 range. Studies performed in a regulatory environment can be much larger than those performed within a non-regulatory environment. Revenue from this business has grown at an average annual growth rate of 12% since 2019 and represents the primary source of our current revenue stream.
                  - generic [ref=f28e616]: Data Licenses
                  - generic [ref=f28e618]: We offer access to certain PDX model data via licensing agreements. As our platform has been expanded over time with the collection of models and the enhancement of their characterization, we have developed a robust multi-omic dataset with substantial potential for both drug discovery and development. This dataset serves as a vital resource for both our pharmaceutical and biotechnology customer who gain access to model-specific data and further their research via licensed access.
                  - generic [ref=f28e620]: Software As A Service (SaaS) Business
                  - generic [ref=f28e622]: Our SaaS business is centered around our proprietary software platform and data tool, Lumin Bioinformatics ("Lumin"), which contains comprehensive information derived from our research services and clinical studies and is sold to customers on an annual subscription basis. The software was developed by a team that consisted of bioinformatics scientists and mathematicians as well as software engineers. Lumin leverages Champions’ large Datacenter coupled with analytics and artificial intelligence to provide a robust tool for computational cancer research. It is the combination of the Datacenter and the analytics that create the foundation for Lumin. Insights developed using Lumin can provide the basis for biomarker hypotheses, reveal potential mechanisms of therapeutic resistance, and guide the direction of additional preclinical evaluations.
                  - generic [ref=f28e624]: Drug Discovery and Development Business
                  - generic [ref=f28e626]: Our nascent drug discovery and development business leverages the computational and experimental capabilities within our platforms. Our discovery strategy utilizes our Datacenter, coupled with artificial intelligence and other advanced computational
                  - generic [ref=f28e627]: "3"
                  - separator [ref=f28e630]
                  - generic [ref=f28e633]: "analytics, to identify novel therapeutic targets. We then employ the use of our proprietary experimental platforms to rapidly validate these targets for further drug development efforts. Our efforts center around three areas of focus:"
                  - generic [ref=f28e635]: 1.Targeted therapy with drug conjugates
                  - generic [ref=f28e636]: 2.Immune oncology
                  - generic [ref=f28e637]: 3.Cell therapy
                  - generic [ref=f28e639]: Our Drug Discovery and Development business is dependent on a dedicated research and development team, made up of computational and experimental scientists. Importantly, the scientific teams within our Drug Discovery and Development teams are appropriately segregated from our other businesses.
                  - generic [ref=f28e641]: We have a rich pipeline of targets at various stages of discovery and validation, with a select group that has progressed to therapeutic development. Our commercial strategy for the validated targets and therapeutics established from this business is wide-ranging and still being developed. It will depend on many factors, and will be specific for each target or therapeutic area identified.
                  - generic [ref=f28e643]: We regularly evaluate strategic options to create additional value from our drug discovery business, which may include, but are not limited to, potential spin-out transactions, licensing opportunities, or capital raises.
                  - generic [ref=f28e645]: Our sales and marketing efforts are dependent on a dedicated sales force of approximately 45 professionals that sell our services directly to pharmaceutical and biotechnology companies. Our research services team is focused on identifying and selling studies to new customers as well as increasing our revenue from our existing customer base. We spend significant resources in informing our customers and reaching out to new contacts within companies that we currently serve. These efforts are aimed at moving our customers along the adoption curve for our research platforms, thereby increasing the number of studies and the average study size. Our success in these efforts is demonstrated by the growing number of customers who have continued to increase their annual spend on our services over the years.
                  - generic [ref=f28e647]: For the fiscal year ended April 30, 2026, revenues from our products and services totaled approximately $59.4 million, an increase of approximately 4% from the previous year.
                  - generic [ref=f28e649]: Our Current Strategy
                  - generic [ref=f28e651]: "Our strategy is to use our various platform technologies to drive multiple synergistic revenue streams. We continue to build upon this with investments in research and development. Our enterprise strategy consists of the following:"
                  - generic [ref=f28e653]: •Establish a global leadership position in oncology research
                  - generic [ref=f28e654]: •A focus on bringing better drugs to patients faster
                  - generic [ref=f28e655]: •Leading innovation in oncology research and development platforms
                  - generic [ref=f28e656]: •Cultivating a solid reputation for the quality of data acquisition and interpretation
                  - generic [ref=f28e657]: •Collaborations across the global biopharma landscape
                  - generic [ref=f28e658]: •Profitable growth across all business lines
                  - generic [ref=f28e660]: Our Growth and Expansion Strategy
                  - generic [ref=f28e662]: Our strategy is to continue to use our various platform technologies to drive multiple synergistic revenue streams.
                  - generic [ref=f28e664]: "Our strategy for growth has multiple components:"
                  - generic [ref=f28e665]: "•Growing our TumorBank: We grow our TumorBank in two ways. First, we leverage a medical affairs team that works with a well-established clinical network to facilitate access to patients diagnosed with prioritized tumor subtypes. Second, we maintain the ability to utilize our legacy Personalized Oncology Services business to establish novel PDX models from patients who use this service. The PDX models are then deeply characterized at the phenotypic, molecular, and pharmacologic levels. This data characterization is then added to our Datacenter."
                  - generic [ref=f28e666]: "•Adding new experimental technologies: The fields of oncology research and drug development are evolving rapidly. To keep up with new approaches, we continuously add new technologies to platform. We are currently investing in developing additional proprietary pharmacology platforms aimed at enhancing the scientific output and driving innovation in the oncology research sector. This includes expanding our capabilities to support the evaluation of"
                  - generic [ref=f28e667]: "4"
                  - separator [ref=f28e670]
                  - generic [ref=f28e673]: radiopharmaceutical therapies through our preclinical research platforms. We are also investing in the development of sophisticated analytical platforms which allow scientists to derive deeper insights when using our pharmacology platforms. Once these experimental technologies are established they are made available to our research and development and target discovery teams.
                  - generic [ref=f28e674]: "•Computational power: We have developed sophisticated and innovative computational approaches. We have also invested in the development of novel artificial intelligence, data structures, and analytics. Our goal is to leverage our unique Datacenter to establish elegant ways to better understand the molecular dynamics of cancer, and the development of novel therapeutics."
                  - generic [ref=f28e676]: Competition
                  - generic [ref=f28e678]: "Champions currently competes in three different markets:"
                  - generic [ref=f28e680]: "Research Services: Pharmaceutical companies rely on outsourcing preclinical studies to Clinical Research Organizations. Competition in this industry is intense and based significantly on scientific, technological, and market forces, which include the effectiveness of the technology and products and the ability to commercialize technological developments. The Company faces significant competition from other healthcare companies in the United States and abroad. The majority of these competitors are, and will be, substantially larger than the Company, and have substantially greater resources and operating histories. There can be no assurance that developments by other companies will not render our products or technologies obsolete or non-competitive or that we will be able to keep pace with the technological or product developments of our competitors. These companies, as well as academic institutions, governmental agencies, and private research organizations also compete with us in recruiting and retaining highly qualified scientific, technical and professional personnel and consultants."
                  - generic [ref=f28e682]: "SaaS: There are two important components of Lumin: the Datacenter and the Analytics. While we feel our Datacenter is unique, there are a large number of publicly available datasets that can be accessed free of charge for computational research. This publicly available data repertoire is constantly growing as academic labs publish results. We continue to find ways to differentiate our dataset, however there can be no assurance that developments by other companies or academic institutions in data curation will not render our Datacenter obsolete or non-competitive. The second component of Lumin is the data analytics. While there are a minimal number of software solutions that offer the degree of analytics available within Lumin, the know-how and workflows of these analytics are well established in bioinformatics labs across academia and the biopharmaceutical industry. As a result, the barrier to entry for developing a SaaS tool leveraging these analytics is relatively low."
                  - generic [ref=f28e684]: "Drug Discovery and Development: Our Drug Discovery and Development business places us in a good position of also competing against the same customers of our Research Services and/or SaaS businesses: the global biopharmaceutical industry. The global oncology drug market was estimated to exceed $286 billion in 2026 with continued projected growth. Competition in this industry is strong and based significantly on scientific and technological forces, which rely solely on the effectiveness of therapeutics designed to treat cancer. The Company faces significant competition from other biopharmaceutical companies in the United States and abroad. The competitors have a wide range of strategic and operational approaches. Our business strategy is to work with differentiated therapeutic targets and research areas. However, given the intense degree of privacy from our competitors, we cannot guarantee that others within the industry are not also working on these targets. Further, some competitors will operate with no laboratory or experimental operations, while others will have varying degrees of laboratory space and experimental capabilities. There can be no assurance that developments by other companies will not render experimental platforms obsolete or non-competitive or that we will be able to keep pace with the technological or product developments of our competitors. These companies, as well as academic institutions, governmental agencies, and private research organizations also compete with us in recruiting and retaining highly qualified scientific, technical and professional personnel and consultants."
                  - generic [ref=f28e686]: Research and Development
                  - generic [ref=f28e688]: For the fiscal years ended April 30, 2026 and 2025, we spent approximately $9.1 million and $6.8 million, respectively, to further develop our platforms. We continue to expand our TumorBank via the inclusion of tumor tissue and implanted models through research collaborations and relationships with hospitals and academic institutions. Our research and development efforts were focused on increasing our understanding of our TumorGraft models, their clinical predictability, improving growth and tumor take rates, and other biological and molecular characteristics of the models. We are investing in developing additional proprietary pharmacology platforms aimed at enhancing the scientific output and driving innovation in the oncology research sector.
                  - generic [ref=f28e690]: "5"
                  - separator [ref=f28e693]
                  - generic [ref=f28e696]: We are also investing in the acquisition of sophisticated analytical platforms which allow scientists to derive deeper insights when using our pharmacology platforms.
                  - generic [ref=f28e698]: Government Regulation
                  - generic [ref=f28e700]: The research, development, and marketing of our products, the performance of our legacy Personalized Oncology Services (POS) testing services, and the operation of our facilities are generally subject to federal, state, local, or foreign legislation, including licensure of our laboratory located in Rockville, Maryland by the State of Maryland and compliance with federal, state, local or foreign legislation applicable to the use of live animals in scientific testing, research and education.
                  - generic [ref=f28e702]: The U.S. Food and Drug Administration (the "FDA") has claimed regulatory authority over laboratory developed tests such as our legacy POS products, but has generally not exercised it. The FDA has announced regulatory and guidance initiatives that could increase federal regulation of our business. We are subject to federal and international regulations with regard to shipment of hazardous materials, including those issued by the Department of Transportation and the International Air Transit Authority. These regulations require interstate, intrastate, and foreign shipments to comply with applicable labeling, documentation, and training requirements.
                  - generic [ref=f28e704]: Human Capital Resources
                  - generic [ref=f28e706]: As of July 15, 2026, we had 214 full-time employees, including 103 with doctoral or other advanced degrees. Of our workforce, 149 employees are engaged in research and development and laboratory operations, 45 employees are engaged in sales and marketing, and 20 employees are engaged in finance, IT, and administration.
                  - generic [ref=f28e708]: We believe that our future success will depend, in part, on our ability to continue to attract, hire, and retain qualified personnel. We continue to seek additions to our science and technical staff, although the competition for such personnel in the pharmaceutical and biotechnology industries is intense. Attracting, developing, and retaining skilled and experienced employees in our industry is crucial to our ability to compete effectively. Our ability to recruit and retain such employees depends on a number of factors, including our corporate culture and work environment, our corporate philosophy, internal talent development and career opportunities, and compensation and benefits.
                  - generic [ref=f28e710]: None of our employees are represented by a labor union or covered by collective bargaining agreements. We have never experienced a work stoppage and believe our relationship with our employees is good.
                  - generic [ref=f28e712]: Company History
                  - generic [ref=f28e714]: We were incorporated as a merger and acquisition company under the laws of the State of Delaware on June 4, 1985, under the name “International Group, Inc.” In September 1985, the Company completed a public offering and shortly thereafter acquired the worldwide rights to the Champions sports theme restaurant concept and changed its name to “Champions Sports, Inc.” In 1997, the Company sold its Champions service mark and concept to Marriott International, Inc. and until 2005, was a consultant to Marriott International, Inc. and operated one Champions Sports Bar Restaurant. In January 2007, the Company changed its business direction to focus on biotechnology and subsequently changed its name to Champions Biotechnology, Inc. On May 18, 2007, the Company acquired Biomerk, Inc., at which time we began focusing on our current line of business. In April 2011, the Company changed its name to Champions Oncology, Inc. to reflect the Company's new strategic focus on developing advanced technologies to personalize the development and use of oncology drugs.
                  - generic [ref=f28e716]: Available Information
                  - generic [ref=f28e718]:
                    - text: Our internet website address is www.championsoncology.com
                    - generic [ref=f28e719]: . Information on our website is not part of this Annual Report. Through our website, we make available, free of charge, access to all reports filed with the United States Securities and Exchange Commission (the "SEC"), including our Annual Reports on Form 10-K, our Quarterly Reports on Form 10-Q, our Current Reports on Form 8-K, our Proxy Statements on Schedules 14A and amendments to those reports, as filed with or furnished to the SEC pursuant to Section 13(a) or 15(d) of the Exchange Act, as soon as reasonably practicable after we electronically file such material with, or furnish it to, the SEC. Copies of any materials we file with, or furnish to, the SEC can also be obtained free of charge through the SEC’s website at http://www.sec.gov.
                  - generic [ref=f28e721]:
                    - generic [ref=f28e722]: Item 1A.
                    - text: Risk Factors
                  - generic [ref=f28e724]: "6"
                  - separator [ref=f28e727]
                  - generic [ref=f28e730]: You should carefully consider the risks described below together with all of the other information included in this Annual Report. The risks and uncertainties described below are not the only ones we face. Additional risks not presently known, or those we currently consider insignificant, may also impair our business operations in the future.
                  - generic [ref=f28e732]: We historically incurred losses from operating activities, may require significant capital and may never achieve sustained profitability.
                  - generic [ref=f28e734]: For the fiscal year ended April 30, 2026, the Company had a net loss of approximately $1.2 million, an accumulated deficit of approximately $81.1 million, and a cash balance of $4.9 million. The Company used cash in operations of approximately $4.5 million for the twelve months ending April 30, 2026. We believe that our cash on hand, together with expected cash flows from operations, are adequate to fund our operations through at least August 2027.
                  - generic [ref=f28e736]: "The amount of our income or losses and liquidity requirements may vary significantly from year-to-year and quarter-to-quarter and will depend on, among other factors:"
                  - generic [ref=f28e738]: •the cost of continuing to build out our TumorGraft bank;
                  - generic [ref=f28e739]: •the cost and rate of progress toward growing our technology platforms;
                  - generic [ref=f28e740]: •the cost and rate of progress toward building our business units;
                  - generic [ref=f28e741]: •the cost of increasing our research and development;
                  - generic [ref=f28e742]: •the cost of renting our laboratory and animal testing facilities and payment for associated services;
                  - generic [ref=f28e743]: •the timing and cost of obtaining and maintaining any necessary regulatory approvals;
                  - generic [ref=f28e744]: •the cost of expanding and building out our infrastructure; and
                  - generic [ref=f28e745]: •the cost incurred in hiring and maintaining qualified personnel.
                  - generic [ref=f28e747]: Currently, the Company derives revenue primarily from research services, while pursuing efforts to further develop our drug discovery business units.
                  - generic [ref=f28e749]: To become sustainably profitable, the Company will need to generate revenues to offset our operating costs, including our research and development and general and administrative expenses. We may not achieve or sustain our revenue or profit objectives. If we incur losses in the future and/or we are unable to obtain sufficient capital either from operations or externals sources, ultimately, we may have to cease operations.
                  - generic [ref=f28e751]: In order to grow revenues, we must invest capital to implement our sales and marketing efforts and to successfully develop our technology platforms. Our sales and marketing efforts may never generate significant increases in revenues or achieve profitability and it is possible that we will be required to raise additional capital to continue our operations. If we must devote a substantial amount of time to raising capital, it will delay our ability to achieve our business goals within the time frames that we now expect, which could increase the amount of capital we need. In addition, the amount of time expended by our management on fundraising distracts them from concentrating on our business affairs. If we require additional capital and are not successful in raising the needed capital, we may have to cease operations.
                  - generic [ref=f28e753]: We may incur greater costs than anticipated, which could result in sustained losses.
                  - generic [ref=f28e755]: We use reasonable efforts to assess and predict the expenses necessary to pursue our business strategies. However, implementing our business strategies may require more employees, capital equipment, supplies or other expenditure items than management has predicted. Similarly, the cost of compensating additional management, employees and consultants or other operating costs may be more than we estimate, which could result in ongoing and sustained losses.
                  - generic [ref=f28e757]: We may not be able to implement our business strategies, which could impair our ability to continue operations.
                  - generic [ref=f28e759]: Implementation of our business strategies will depend in large part on our ability to (i) attract and maintain a significant number of customers; (ii) effectively provide acceptable services to our customers; (iii) develop and license new products and technologies; (iv) maintain appropriate internal procedures, policies, and systems; (v) hire, train, and retain skilled employees and management; (vi) continue to operate despite increasing competition in our industry; and (vii) establish, develop and maintain our name recognition. Our inability to obtain or maintain any or all these factors could impair our ability to implement our business strategies successfully, which could have material adverse effects on our results of operations and financial condition.
                  - generic [ref=f28e761]: Our laboratories are subject to regulation and licensure requirements, and the healthcare industry is highly regulated; we may face substantial penalties, and our business activities may be impacted, if we fail to comply.
                  - generic [ref=f28e762]: "7"
                  - separator [ref=f28e765]
                  - generic [ref=f28e769]: Our research services are performed in laboratories that are subject to state regulation and licensure requirements. Such regulation and requirements are subject to change, and may result in additional costs or delays in providing our products to our customers. In addition, the healthcare industry in general is highly regulated in the United States at both the federal and state levels. We seek to conduct our business in compliance with all applicable laws, but many of the laws and regulations potentially applicable to us are vague or unclear. These laws and regulations may be interpreted or applied by an authority in a way that could require us to make changes in our business. We may not be able to obtain all regulatory approvals needed to operate our business or sell our products. If we fail to do so, we could be subject to civil and criminal penalties or fines or lose the authorizations necessary to operate our business, as well as incur additional liabilities from third parties. If any of these events happened, they could hurt our business and financial results.
                  - generic [ref=f28e771]: If our laboratory facilities are damaged or destroyed, or we have a dispute with one of our landlords, our business would be negatively affected.
                  - generic [ref=f28e773]: We currently utilize several office suites where our laboratories are located within one facility in Rockville, Maryland. If this facility was to be significantly damaged or destroyed, we could suffer a loss of our ongoing and future drug studies, as well as our TumorBank. In addition, we lease the laboratories from a third party. If we had a dispute with our landlord or otherwise could not utilize our space, it would take time to find and move to a new facility, which could negatively affect our results of operations.
                  - generic [ref=f28e775]: Any health crisis impacting our colony of laboratory mice could have a negative impact on our business.
                  - generic [ref=f28e777]: Our research services operations depend on having a colony of live mice available. If this population experienced a health crisis, such as a virus or other pathogen, such crisis would affect the success of our existing and future business, as we would have to rebuild the population and repeat current studies.
                  - generic [ref=f28e779]: We have limited experience marketing and selling our products and may need to rely on third parties to successfully market and sell our products and generate revenues.
                  - generic [ref=f28e781]: Currently, we rely on the internet, word of mouth, and a small sales force to market our services. We have to compete with other pharmaceutical, biotechnology and life science technology and service companies to recruit, hire, train, and retain marketing and sales personnel. However, there can be no assurance that we will be able to develop in-house sales, and as a result, we may not be able to generate product revenue.
                  - generic [ref=f28e783]: We will continue to be dependent upon key employees.
                  - generic [ref=f28e785]: Our success, currently, is dependent upon the efforts of several full-time key employees, the loss of the services of one or more of which would have a material adverse effect on our business and financial condition. We intend to continue to develop our management team and attract and retain qualified personnel in all functional areas to expand and grow our business. This may be difficult in the healthcare industry where competition for skilled personnel is intense.
                  - generic [ref=f28e787]: Because our industry is very competitive and many of our competitors have substantially greater capital resources and more experience in research and development, we may not succeed in selling or increasing sales of our products and technologies.
                  - generic [ref=f28e789]: We are engaged in a rapidly changing and highly competitive field. Potential competitors in the United States and abroad are numerous and include providers of clinical research services, most of which have substantially greater capital resources and more experience in research and development capabilities. Furthermore, new companies will likely enter our market from the United States and abroad, as scientific developments surrounding other pre-clinical and clinical services grow in the multibillion dollar oncology marketplace. Our competitors may succeed in selling their products to our pharmaceutical and biotech customers more effectively than we sell our products. In addition, academic institutions, hospitals, governmental agencies, and other public and private research organizations also may conduct similar research, seek patent protection, and may develop and commercially introduce competing products or technologies on their own or through joint ventures. If one or more of our competitors succeeds in developing similar technologies and products that are more effective or successful than any of those that we currently sell or will develop, our results of operations will be significantly adversely affected.
                  - generic [ref=f28e791]: If we are unable to protect our intellectual property, we may not be able to compete as effectively.
                  - generic [ref=f28e793]: "8"
                  - separator [ref=f28e796]
                  - generic [ref=f28e799]: It is important in the healthcare industry to obtain patent and trade secret protection for new technologies, products, and processes. Our success will depend, in part, upon our ability to obtain, enjoy, and enforce protection for any products we have, develop or acquire under United States and foreign patent laws and other intellectual property laws, preserve the confidentiality of our trade secrets, and operate without infringing the proprietary rights of third parties. Where appropriate, we will seek patent protection for certain aspects of our technology. However, while our TumorGraft Technology Platform is proprietary and requires significant know-how to both initiate and operate, it is not patented. It is, therefore, possible for competitors to develop other implantation procedures, or to discover the same procedures utilized by us, that could compete with us in our market.
                  - generic [ref=f28e801]: It also is unclear whether efforts to secure our trade secrets will provide useful protection. While we will use reasonable efforts to protect our trade secrets, our employees or consultants may unintentionally or willfully disclose our proprietary information to competitors resulting in a loss of protection. Enforcing a claim that someone else illegally obtained and is using our trade secrets, like patent litigation, is expensive and time consuming, and the outcome is unpredictable. In addition, courts outside the United States are sometimes less willing to protect trade secrets. Finally, our competitors may independently develop equivalent knowledge, methods and know-how.
                  - generic [ref=f28e803]: If we are unable to protect the confidentiality of our trade secrets, our business and competitive position would be harmed.
                  - generic [ref=f28e805]: We rely on trade secrets, including unpatented know-how, technology and other proprietary information, to maintain our competitive position. We seek to protect these trade secrets, in part, by entering into non-disclosure and confidentiality agreements with parties who have access to them, such as our employees, corporate collaborators, outside scientific collaborators, contract manufacturers, consultants, advisors and other third parties. We also seek to enter into confidentiality and invention assignment agreements with our employees and consultants. Despite these efforts, any of these parties may breach the agreements and disclose our proprietary information, including our trade secrets, and we may not be able to obtain adequate remedies for such breaches. Our trade secrets may also be obtained by third parties by other means, such as breaches of our physical or computer security systems. Enforcing a claim that a party illegally disclosed or misappropriated a trade secret is difficult, expensive and time-consuming, and the outcome is unpredictable. In addition, some courts inside and outside the United States are less willing or unwilling to protect trade secrets. If any of our trade secrets were to be lawfully obtained or independently developed by a competitor, we would have no right to prevent them, or those to whom they communicate it, from using that technology or information to compete with us. If any of our trade secrets were to be disclosed to or independently developed by a competitor, our competitive position would be harmed.
                  - generic [ref=f28e807]: Claims by others that our products infringe their patents or other intellectual property rights could adversely affect our financial condition.
                  - generic [ref=f28e809]: "The healthcare industry has been characterized by frequent litigation regarding patent and other intellectual property rights. Patent applications are maintained in secrecy in the United States and also are maintained in secrecy outside the United States until the application is published. Accordingly, we can conduct only limited searches to determine whether our technology infringes the patents or patent applications of others. Any claims of patent infringement asserted by third parties would be time-consuming and could likely:"
                  - generic [ref=f28e811]: •result in costly litigation;
                  - generic [ref=f28e812]: •divert the time and attention of our technical personnel and management;
                  - generic [ref=f28e813]: •require us to develop non-infringing technology; or
                  - generic [ref=f28e814]: •require us to enter into royalty or licensing agreements.
                  - generic [ref=f28e816]: Research service studies are subject to cancellation based on changes in customer’s development plans.
                  - generic [ref=f28e818]: Our revenue is primarily derived from studies performed for pharmaceutical and biotechnology companies to assist in the development of oncology drugs. There are many factors that could result in the change of our customers development plans for specific drugs, including without limitation to their research and development budgets and drug development strategies. These changes could lead to the cancellation or modification of on-going or planned studies. This would have a negative impact on the Company’s revenue growth and profit margin.
                  - generic [ref=f28e820]: We face competition in the life science market for computational software and for bioinformatics products.
                  - generic [ref=f28e822]: The market for our computational software platform for the life science market is competitive. We currently face competition from other scientific software providers, larger technology and solutions companies, in-house development by our customers and academic and government institutions, and the open-source community. Some of our competitors and potential competitors
                  - generic [ref=f28e823]: "9"
                  - separator [ref=f28e826]
                  - generic [ref=f28e829]: have longer operating histories in certain segments of our industry than we do and could have greater financial, technical, marketing, research and development, and other resources. We could also face competition from open-source software initiatives, in which developers provide software and intellectual property free over the Internet. In addition, some of our customers spend significant internal resources in order to develop their own software. There can be no assurance that our current or potential competitors will not develop products, services, or technologies that are comparable to, superior to, or render obsolete, the products, services, and technologies we offer. There can be no assurance that our competitors will not adapt more quickly than we do to technological advances and customer demands, thereby increasing such competitors' market share relative to ours. Any material decrease in demand for our technologies or services may have a material adverse effect on our business, financial condition, and results of operations.
                  - generic [ref=f28e831]: Drug development programs, particularly those in early stages of development, may never be commercialized.
                  - generic [ref=f28e833]: Our future success depends, in part, on our ability to select successful product candidates, complete preclinical development of these product candidates and advance them to and through clinical trials. Early-stage product candidates in particular require significant investment in development, preclinical studies and clinical trials, regulatory clearances and substantial additional investment before they can be commercialized, if at all.
                  - generic [ref=f28e835]: Our research and development programs may not lead to commercially viable products for several reasons, and are subject to the risks and uncertainties associated with drug development. For example, we may fail to identify promising product candidates, our product candidates may fail to be safe and effective in preclinical tests or clinical trials, or we may have inadequate financial or other resources to pursue discovery and development efforts for new product candidates. From time to time, we may establish and announce certain development goals for our product candidates and programs. However, given the complex nature of the drug discovery and development process, it is difficult to predict accurately if and when we will achieve these goals. If we are unsuccessful in advancing our research and development programs into clinical testing or in obtaining regulatory approval, our long-term business prospects will be harmed.
                  - generic [ref=f28e837]: Impairment of goodwill may adversely impact future results of operations.
                  - generic [ref=f28e839]: We have goodwill on our balance sheet. If the future growth and operating results of our business are not as strong as anticipated and/or our market capitalization declines, this could result in an impairment of our goodwill. To the extent any future impairment occurs, the carrying value of our assets will be written down to an implied fair value and an impairment charge will be made to our income from continuing operations. Such an impairment charge could materially and adversely affect our operating results.
                  - generic [ref=f28e841]: Our ability to use our net operating loss carry-forwards and certain other tax attributes may be limited.
                  - generic [ref=f28e843]: Under Section 382 of the Internal Revenue Code of 1986, as amended, if a corporation undergoes an “ownership change” (generally defined as a greater than 50% change (by value) in its equity ownership over a three-year period), the corporation’s ability to use its pre-change net operating loss carry-forwards and other pre-change tax attributes (such as research tax credits) to offset its post-change income may be limited. We believe that our 2016 public offering, taken together with our private placements and other transactions that have occurred since then, may have triggered an “ownership change” limitation. We may also experience ownership changes in the future as a result of subsequent shifts in our stock ownership. As a result, if we earn net taxable income, our ability to use our pre-change net operating loss carry-forwards to offset U.S. federal taxable income may be subject to limitations, which potentially could result in increased future tax liability to us.
                  - generic [ref=f28e845]: We have a limited market for our common stock, which makes our securities very speculative.
                  - generic [ref=f28e847]: Trading activity in our common stock is and has been limited. As a result, an investor may find it difficult to dispose of, or to obtain accurate quotations of the price of our common stock. There can be no assurance that a more active market for our common stock will develop, or if one should develop, there is no assurance that it will be sustained. This could severely limit the liquidity of our common stock, and would likely have a material adverse effect on the market price of our common stock and on our ability to raise additional capital. Furthermore, like many stocks quoted on the Nasdaq Capital Market, trading in our common stock is thin and characterized by wide fluctuations in trading prices, due to many factors that may have little to do with our operations or business prospects. This volatility could depress the market price of our common stock for reasons unrelated to operating performance.
                  - generic [ref=f28e849]: Investment in our common stock may be diluted if we issue additional shares in the future.
                  - generic [ref=f28e851]: "10"
                  - separator [ref=f28e854]
                  - generic [ref=f28e857]: We may issue additional shares of common stock, which will reduce shareholders’ percentage ownership and may dilute per share value. Our certificate of incorporation authorizes the issuance of 200,000,000 shares of common stock. As of July 23, 2026, we had 14,013,902 shares of common stock issued and 13,893,569 outstanding. The future issuance of all or part of the remaining authorized common stock would result in substantial dilution in the percentage of the common stock held by existing shareholders. The issuance of common stock for future services, acquisitions, or other corporate actions may have the effect of diluting the value of the shares held by existing shareholders, and might have an adverse effect on any market for our common stock.
