                  - generic [ref=f28e915]: Our business operations could be disrupted if our information technology systems fail to perform adequately.
                  - generic [ref=f28e917]: We rely on information technology networks and systems, including the Internet, to process, transmit, and store information, to manage and support a variety of business processes and activities, and to comply with regulatory, legal, and tax requirements. Our information technology systems, some of which are dependent on services provided by third parties, may be vulnerable to damage, interruption, or shutdown due to any number of causes outside of our control such as catastrophic events, natural disasters, fires, power outages, systems failures, telecommunications failures, employee error or malfeasance, security breaches, computer viruses or other malicious codes, ransomware, unauthorized access attempts, denial of service attacks, phishing, hacking, and other cyberattacks. While we have experienced threats to our data and systems, to date, we are not aware that we have experienced a material breach. Cyberattacks are occurring more frequently, are constantly evolving in nature and are becoming more sophisticated. Additionally, continued geopolitical turmoil, including the Russia-Ukraine military conflict, has heightened the risk of cyberattacks. While we attempt to continuously monitor and mitigate against cyber risks, we may incur significant costs in protecting against or remediating cyberattacks or other cyber incidents.
                  - generic [ref=f28e919]: "12"
                  - separator [ref=f28e922]
                  - generic [ref=f28e925]: Sophisticated cybersecurity threats pose a potential risk to the security and viability of our information technology systems, as well as the confidentiality, integrity, and availability of the data stored on those systems, including cloud-based platforms. In addition, new technology that could result in greater operational efficiency may further expose our computer systems to the risk of cyber-attacks. If we do not allocate and effectively manage the resources necessary to build and sustain the proper technology infrastructure and associated automated and manual control processes, we could be subject to billing and collection errors, business disruptions, or damage resulting from security breaches. If any of our significant information technology systems suffer severe damage, disruption, or shutdown, and our business continuity plans do not effectively resolve the issues in a timely manner, our product sales, financial condition, and results of operations may be materially and adversely affected, and we could experience delays in reporting our financial results. In addition, there is a risk of business interruption, violation of data privacy laws and regulations, litigation, and reputational damage from leakage of confidential information. Any interruption of our information technology systems could have operational, reputational, legal, and financial impacts that may have a material adverse effect on our business.
                  - generic [ref=f28e928]: A pandemic, epidemic, or outbreak of an infectious disease in the United States or elsewhere may adversely affect our business and we are unable to predict the potential impact.
                  - generic [ref=f28e930]: We are subject to risks related to public health crises Any outbreak of contagious diseases, or other adverse public health developments, could have a material and adverse effect on our business operations. These could include disruptions or restrictions on our ability to travel, pursue partnerships and other business transactions, receive shipments of biologic materials, as well as be impacted by the temporary closure of the facilities of suppliers. The spread of an infectious disease may also result in the inability of our suppliers to deliver supplies to us on a timely basis. In addition, health professionals may reduce staffing and reduce or postpone meetings with clients in response to the spread of an infectious disease. Though we have not yet experienced such events, if they would occur, they could result in a period of business disruption, and in reduced operations, any of which could materially affect our business, financial condition and results of operations. However, as of the date of this Annual Report, we have not experienced a material adverse effect on our business nor the need for reduction in our work force; and, currently, we do not expect any material impact on our long-term activity. The extent to which any spread of disease impacts our business will depend on future developments which are highly uncertain and cannot be predicted, including, but not limited to, information which may emerge concerning the spreading and severity of the any infectious diseases, the actions to contain these, or treat their impact.
                  - generic [ref=f28e932]: Deterioration in general economic conditions in the United States and globally, including the effect of prolonged periods of inflation on our customers and suppliers, could harm our business and results of operations.
