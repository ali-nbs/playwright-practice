                      - text: revenues earned by these subsidiaries.
                    - generic [ref=f28e3292]: Basis of Presentation
                    - generic [ref=f28e3295]: The accompanying consolidated financial statements have been prepared in accordance with accounting principles generally accepted in the United States of America (“GAAP”). The Company operates in one reportable business segment.
                    - generic [ref=f28e3299]: The Company's wholly owned subsidiary, Corellia, has issued equity‑classified stock options to certain of its employees. Stock‑based compensation expense is recognized over the requisite service period, with the corresponding equity recorded as non-controlling interest in the consolidated statements of stockholders' equity. Because the options are unexercised, they do not represent an actual ownership interest, and no portion of the Company's net income or loss is attributed to non-controlling interest until the options are exercised. Refer to Note 8.
                  - generic [ref=f28e3303]:
                    - text: Note 2.
                    - generic [ref=f28e3304]: Summary of Significant Accounting Policies
                  - generic [ref=f28e3305]:
                    - generic [ref=f28e3307]:
                      - generic [ref=f28e3308]: Principles of Consolidation
                      - generic [ref=f28e3311]: The consolidated financial statements include the accounts of the Company and its wholly-owned subsidiaries. All intercompany balances and transactions have been eliminated in consolidation.
                    - generic [ref=f28e3313]: Foreign Currency
                    - generic [ref=f28e3317]: The Company’s foreign subsidiaries' functional currency is the U.S. dollar. Transaction gains and losses are recognized in earnings. The Company is subject to foreign exchange rate fluctuations in connection with the Company’s international operations.
                    - generic [ref=f28e3320]:
                      - generic [ref=f28e3321]: Use of Estimates
                      - generic [ref=f28e3324]: The preparation of consolidated financial statements in conformity with GAAP requires management to make estimates and assumptions that affect the reported amounts of assets and liabilities and disclosures of contingent assets and liabilities at the date of the consolidated financial statements and the reported amounts of revenues and expenses during the reporting period. We base our estimates on historical experience, our observance of trends in particular areas and information or valuations and various other assumptions that we believe to be reasonable under the circumstances and which form the basis for making judgments about the carrying value of assets and liabilities that may not be readily apparent from other sources. Actual amounts could differ significantly from amounts previously estimated.
