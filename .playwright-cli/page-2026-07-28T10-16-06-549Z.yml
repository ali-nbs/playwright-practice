                    - generic [ref=f28e4348]: For the twelve months ended April 30, 2026, stock-based compensation expense for research and development includes approximately $129,000, for options granted by the Company's wholly-owned subsidiary, Corellia, to certain of its employees.
                    - generic [ref=f28e4351]: The Company has in place a 2021 Equity Incentive Plan and 2010 Equity Incentive Plan as well as the 2023 Global Equity Incentive Plan which is specific to Corellia (collectively, the "Plans"). In general, these Plans provide for stock-based compensation to the Company’s employees, directors and non-employees. The 2010 and 2021 Plans also provide for limits on the aggregate number of shares that may be granted, the term of grants and the strike price of option awards.
                    - generic [ref=f28e4353]: 2021 Equity Incentive Plan
                  - separator [ref=f28e4358]
                  - generic [ref=f28e4359]:
                    - generic [ref=f28e4360]: CHAMPIONS ONCOLOGY
                    - generic [ref=f28e4361]: NOTES TO CONSOLIDATED FINANCIAL STATEMENTS (Continued)
                  - generic [ref=f28e4363]:
                    - generic [ref=f28e4364]: As part of the 2021 Annual Shareholders Meeting, shareholders approved the adoption of the 2021 Equity Incentive Plan (“2021 Equity Plan”). The purpose of the 2021 Equity Plan is to grant (i) Non-statutory Stock Options; (ii) Incentive Stock Options; (iii) Restricted Stock Awards; and/or (iv) Stock Appreciation Rights (collectively, stock-based compensation) to its employees, directors and non-employees. Total stock awards under the 2021 Equity Plan shall not exceed 2 million shares of common stock. Options and Stock Appreciation Rights expire no later than ten years from the date of grant and the awards vest as determined by the Board of Directors (the "Board") or Chief Executive Officer. Options and Stock Appreciation Rights have a strike price not less than 100% of the fair market value of the common stock subject to the option or right at the date of grant. As of April 30, 2026, approximately 80,000 shares were left to issue under this plan and 1.9 million options granted under the 2021 plan were outstanding.
                    - generic [ref=f28e4367]: 2010 Equity Incentive Plan
                    - generic [ref=f28e4369]: On February 18, 2011, shareholders owning a majority of the issued and outstanding shares of the Company executed a written consent approving the 2010 Equity Incentive Plan (“2010 Equity Plan”). The purpose of the 2010 Equity Plan is to grant (i) Non-statutory Stock Options; (ii) Restricted Stock Awards; and (iii) Stock Appreciation Rights (collectively, stock-based compensation) to its employees, directors and non-employees. Total stock awards under the 2010 Equity Plan shall not exceed 30,000,000 shares of common stock. Options and Stock Appreciation Rights expire no later than ten years from the date of grant and the awards vest as determined by the Board. Options and Stock Appreciation Rights have a strike price not less than 100% of the fair market value of the common stock subject to the option or right at the date of grant. After February 2021, no more shares were available to be issued from this plan. As of April 30, 2026, approximately 732,000 options granted under the 2010 plan were still outstanding.
                    - generic [ref=f28e4372]: 2023 Global Equity Incentive Plan
                    - generic [ref=f28e4374]: As part of the establishment of Corellia, the subsidiary's Board of Directors approved the adoption of the 2023 Global Equity Incentive Plan ("the Plan"). The purpose of the Plan is to grant (i) Non-statutory Stock Options; (ii) Incentive Stock Options; and/or (iii) Restricted Stock Awards (collectively, stock-based compensation) to its employees, directors and non-employees. Options expire no later than ten years from the date of grant. Options awards vest as follows, unless otherwise determined by the subsidiary's Board or Plan Administrator, twenty-five percent (25%) of the options grant on the first anniversary of the vesting commencement date (and in the absence of such determination, of date on which such Options were granted), and six and one-quarter percent (6.25%) of the options grant at the end of each subsequent three-month period thereafter over the course of the following three (3) years.
                    - generic [ref=f28e4377]: Director Compensation Plan
                    - generic [ref=f28e4379]: On December 12, 2013, the Compensation Committee of the Board (the "Committee") adopted changes to the Director Compensation Plan of 2010 (the “Director Plan”) effective December 1, 2013. Under the Director Plan, independent directors of the Company were entitled to an annual award of a five-year option to purchase 8,333 shares of the Company’s common stock, and the Chairman of the Board of the Company was entitled to an annual award of a five-year option to purchase 16,667 shares of the Company’s common stock. Independent directors who serve as chairperson of a committee were also to receive an annual grant of a five-year option to purchase 1,667 shares of the Company’s common stock.
                    - generic [ref=f28e4382]: During fiscal year 2021, the Committee adopted the Director Compensation Plan of 2021 (the "2021 Plan"). Under the 2021 Plan, independent directors are entitled to an annual base compensation of $100,000 which can be received in either ten-year options to purchase shares of the Company's stock, which vest fully over a one-year period, or a combination of options and cash, where cash received is not to exceed $35,000. The Chairman of the Board’s annual compensation was set at an equivalent of $150,000. Compensation for independent directors who serve as chairperson of a committee was set at an equivalent of between $110,000 to $120,000. All options issued under the 2021 Plan vest quarterly at a rate of 25%. Option grants will typically be issued after the annual shareholder meeting which will generally be held in October of each year. New directors will receive compensation upon joining the Board equal to a pro-rata equivalent for the remainder of the year. Options issued under the 2021 Plan are issued pursuant to the 2021 Equity Plan.
