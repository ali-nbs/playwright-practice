                  - generic [ref=f21e808]: "6"
                  - separator [ref=f21e811]
                  - generic [ref=f21e814]: Walmart U.S. Segment
                  - generic [ref=f21e815]: Walmart U.S. is our largest segment and operates 4,611 stores in the U.S., including in all 50 states, Washington D.C. and Puerto Rico. Walmart U.S. is a mass merchandiser of consumer products, operating under the "Walmart" and "Walmart Neighborhood Market" brands, as well as walmart.com and the Walmart mobile application. Walmart U.S. had net sales of $483.0 billion for fiscal 2026, representing 68% of our fiscal 2026 consolidated net sales, and had net sales of $462.4 billion and $441.8 billion for fiscal 2025 and 2024, respectively.
                  - generic [ref=f21e816]: Omnichannel. Walmart U.S. provides a convenient and seamless omnichannel experience to customers, integrating retail stores and eCommerce. Substantially all our stores provide same-day pickup and delivery, offering expedited delivery options that enable us to reach customers faster and in the ways they prefer, including in-home delivery and digital pharmacy fulfillment. Our Walmart+ membership offering provides enhanced omnichannel shopping benefits including unlimited free shipping on eligible items with no order minimum, unlimited delivery from store, fuel discounts, mobile Scan & Go and access to additional member benefits.
                  - generic [ref=f21e817]: "Merchandise and Other Offerings. Walmart U.S. does business primarily in three strategic merchandise units, listed below:"
                  - generic [ref=f21e818]: •Grocery consists of a full line of grocery items, including dry grocery, snacks, dairy, meat, produce, deli and bakery, frozen foods, alcoholic and nonalcoholic beverages, as well as consumables such as health and beauty aids, pet supplies, household chemicals, paper goods and baby products;
                  - generic [ref=f21e819]: "•General merchandise includes:"
                  - generic [ref=f21e820]: ◦Entertainment (e.g., electronics, toys, seasonal merchandise, wireless, video games, movies, music and books);
                  - generic [ref=f21e821]: ◦Hardlines (e.g., automotive, hardware and paint, sporting goods, outdoor living and stationery);
                  - generic [ref=f21e822]: ◦Fashion (e.g., apparel for adults and children, as well as shoes, jewelry and accessories); and
                  - generic [ref=f21e823]: ◦Home (e.g., housewares and small appliances, bed and bath, furniture and home organization, home furnishings, home decor, fabrics and crafts).
                  - generic [ref=f21e824]: •Health and wellness includes pharmacy, over-the-counter drugs and other medical products, and optical services.
                  - generic [ref=f21e825]: Periodically, revisions are made to the categorization of the components comprising our strategic merchandise units. When revisions are made, the previous periods' presentation is adjusted to maintain comparability.
                  - generic [ref=f21e826]: "Brand name merchandise represents a significant portion of the merchandise sold in Walmart U.S. We also market lines of merchandise under our private brands, including brands such as: \"Athletic Works,\" \"bettergoods,\" \"Equate,\" \"Free Assembly,\" \"Freshness Guaranteed,\" \"George,\" \"Great Value,\" \"Holiday Time,\" \"Hyper Tough,\" \"Joyspun,\" \"Kid Connection,\" \"Mainstays,\" \"Marketside,\" \"No Boundaries,\" \"onn.,\" \"Ozark Trail,\" \"Parent's Choice,\" \"Sam's Choice,\" \"Scoop,\" \"Spring Valley,\" \"Time and Tru,\" \"Way to Celebrate\" and \"Wonder Nation.\" The Company also markets lines of merchandise under licensed brands, some of which include: \"Avia,\" \"Better Homes & Gardens,\" \"Sofia Jeans by Sofia Vergara\" and \"The Pioneer Woman.\""
                  - generic [ref=f21e827]: Other offerings in the Walmart U.S. business include advertising solutions for brands and online marketplace sellers, supply chain and fulfillment capabilities to online marketplace sellers, and data analytics and insights for suppliers and brands. Additional offerings include fuel, financial services and related products such as money orders, prepaid access, money transfers, check cashing, bill payment and certain types of installment lending.
                  - generic [ref=f21e828]: Walmart International Segment
                  - generic [ref=f21e829]: Walmart International is our second largest segment and operates 5,743 stores across 18 countries outside of the U.S. Walmart International operates through our wholly-owned subsidiaries in Canada, Chile, China, and Africa (which includes Botswana, Eswatini, Lesotho, Malawi, Mozambique, Namibia, South Africa and Zambia), and our majority-owned subsidiaries in India, as well as Mexico and Central America (which includes Costa Rica, El Salvador, Guatemala, Honduras and Nicaragua).
                  - generic [ref=f21e830]: "Walmart International includes numerous formats divided into two major categories: retail and wholesale. These categories consist of many formats, including: supercenters, supermarkets, warehouse clubs (including our membership-only Sam's Club format) and cash and carry, as well as eCommerce through websites and mobile applications, including walmart.com.mx, walmart.ca, flipkart.com, PhonePe, samclub.cn and other sites. Walmart International had net sales of $130.4 billion for fiscal 2026, representing 19% of our fiscal 2026 consolidated net sales, and had net sales of $121.9 billion and $114.6 billion for fiscal 2025 and 2024, respectively."
                  - generic [ref=f21e831]: Walmart International's purpose is to help millions of customers and members save money and live better every day by leveraging our global ecosystem and deep local expertise to provide access to affordable products and services. In addition, we share what we learn in our markets to help the enterprise innovate and grow even faster. We are deliberate about where and how we choose to operate to best enable long-term, sustainable and profitable growth.
                  - generic [ref=f21e832]: "7"
                  - separator [ref=f21e835]
                  - generic [ref=f21e838]: Omnichannel. Walmart International provides a convenient and seamless omnichannel experience to customers, integrating retail stores and eCommerce, such as through our pickup and delivery services from approximately 3,300 locations across all of our markets, including same-day and expedited delivery options across our markets. We continue to expand our marketplace offerings, which further enhances our fulfillment and advertising services.
                  - generic [ref=f21e839]: Merchandise and Other Offerings. The merchandising strategy for Walmart International is similar to that of our operations in the U.S. in terms of the breadth and scope of merchandise offered for sale. While brand name merchandise accounts for a majority of our sales, we have both leveraged U.S. private brands and developed market specific private brands to serve our customers with high quality, low priced items. Along with the private brands we market globally, such as "Equate," "George," "Great Value," "Holiday Time," "Mainstays," "Marketside," "Member's Mark" and "Parent's Choice," our international markets have developed market specific brands including "Aurrera" and "Lider." In addition, we have developed and continue to grow our relationships with regional and local suppliers in each market to ensure reliable sources of quality merchandise that is equal to national brands at low prices. Consistent with its strategy, Walmart International continues to build mutually reinforcing businesses in areas such as advertising, marketplace and fulfillment services, financial services and healthcare.
                  - generic [ref=f21e840]: Sam's Club U.S. Segment
                  - generic [ref=f21e841]: Sam's Club U.S. is a membership-only warehouse club that operates 601 clubs in 44 states in the U.S. and Puerto Rico and also operates samsclub.com and the Sam's Club mobile application. Sam's Club U.S. had net sales of $93.0 billion for fiscal 2026, representing 13% of our consolidated fiscal 2026 net sales, and had net sales of $90.2 billion and $86.2 billion for fiscal 2025 and 2024, respectively. As a membership-only club, membership income is a significant component of the segment's operating income.
                  - generic [ref=f21e842]: "Membership. The following two membership tiers are available: Club membership for a $50 annual fee and Plus membership for a $110 annual fee. All memberships include a spouse/household card at no additional cost, and members may purchase add-on memberships for $45 each, subject to tier-based limits. Club members are eligible for free curbside pickup, and Plus members receive additional benefits including free delivery-from-club and free shipping on orders of $50 or greater, exclusive discounts and convenience offers, and the ability to shop before regular shopping hours. Members may also earn Sam's Cash rewards on qualifying purchases that can be redeemed for cash, used for purchases, or used to pay membership fees."
                  - generic [ref=f21e843]: Omnichannel. Sam's Club U.S. provides a fast and seamless omnichannel experience to members, integrating physical clubs and eCommerce. Club-fulfilled curbside pickup and delivery provides fast and convenient ways to shop for members; Scan & Go mobile checkout and payment solution allows members to bypass the checkout line; and Just Go provides members with a friction-free exit experience.
                  - generic [ref=f21e844]: "Merchandise and Other Offerings. Sam's Club U.S. offers merchandise in the following four merchandise categories:"
                  - generic [ref=f21e845]: •Grocery consists of dairy, meat, bakery, deli, produce, dry, chilled or frozen packaged foods, alcoholic and nonalcoholic beverages, floral, snack foods, candy, other grocery items, as well as consumables such as health and beauty aids, protein and nutrition, paper goods, laundry and home care, baby care, pet supplies and other consumable items;
                  - generic [ref=f21e846]: "•General merchandise includes:"
                  - generic [ref=f21e847]: ◦Home, hardlines and seasonal items (such as home improvement, outdoor living, gardening, furniture, apparel, jewelry, tools and power equipment, housewares, toys and mattresses); and
                  - generic [ref=f21e848]: ◦Technology and entertainment items (such as consumer electronics and accessories, software, video games, office supplies, appliances and third-party gift cards).
                  - generic [ref=f21e849]: •Health and wellness includes pharmacy, optical and hearing services, and over-the-counter drugs; and
                  - generic [ref=f21e850]: •Fuel and other categories.
                  - generic [ref=f21e851]: Periodically, revisions are made to the categorization of the components comprising our strategic merchandise units. When revisions are made, the previous periods' presentation is adjusted to maintain comparability.
                  - generic [ref=f21e852]: Within the categories above, the Sam's Club Member's Mark private label brand offers premium-quality, "Made Without" products across a wide range of categories at competitive, value-driven prices, designed to meet the needs of members. We continue to expand its assortment to reinforce Sam's Club value proposition to our members.
                  - generic [ref=f21e853]: Other offerings in the Sam's Club U.S. business include advertising solutions for brands as well as operational insights and analytics for suppliers. Additional offerings include tire and battery installation services, photo and tech assistance, home and auto solutions, and certain financial services and related products.
                  - generic [ref=f21e854]: "8"
                  - separator [ref=f21e857]
                  - generic [ref=f21e860]: Additional Information About Our Business
                  - generic [ref=f21e861]: Competition. We compete with brick and mortar, eCommerce and omnichannel retailers operating discount, department, retail and wholesale grocery, drug, dollar, variety and specialty stores, supermarkets, supercenter-type stores, membership-only warehouse clubs, gasoline stations and social commerce platforms, as well as companies that offer services in digital advertising, fulfillment and delivery services, health and wellness and financial services. Our ability to develop and effectively operate different formats at the right locations and to deliver a customer-centric omnichannel experience largely determines our competitive position in the retail industry within the markets where we operate. Each of these landscapes is highly competitive and rapidly evolving, and new business models and the entry of new, well-funded competitors continue to intensify this competition. Some of our competitors have longer histories in these lines of business, more customers and greater brand recognition. They may be able to obtain more favorable terms from suppliers and business partners and to devote greater resources to the development of these businesses. In addition, for eCommerce and other internet-based businesses, newer or smaller businesses may be better able to innovate and compete with us.
                  - generic [ref=f21e862]: "We compete in a variety of ways, including the prices at which we sell our merchandise, merchandise and selection availability, services offered to customers, the quality of the products and services we offer, location, store and club hours, on-site amenities, the shopping convenience and overall shopping experience we offer, the attractiveness and ease of use of our digital platforms, cost and speed of and options for delivery to customers of merchandise purchased through our digital platforms or through our omnichannel integration of our physical and digital operations. We employ many strategies and programs designed to meet competitive pressures within our industry, which increasingly incorporate the use of AI-powered tools. These strategies include the following:"
                  - generic [ref=f21e863]: "•EDLP: our pricing philosophy under which we price items at everyday low prices so our customers trust that our prices will not change under frequent promotional activity;"
                  - generic [ref=f21e864]: "•EDLC: everyday low cost is our commitment to control expenses so our cost savings can be passed along to our customers;"
                  - generic [ref=f21e865]: •Omnichannel offerings such as pickup and delivery, all of which enhance convenience and seek to serve customers in the ways they want to be served;
                  - generic [ref=f21e866]: •Expanding our ecosystem and the products and services we offer in areas such as digital advertising, marketplace and fulfillment services, health and wellness, and financial services to provide our customers a broader set of offerings to meet expanding needs;
                  - generic [ref=f21e867]: •Opening new stores and clubs, as well as remodeling existing locations, to enhance the customer experience, support omnichannel capabilities, and strengthen our physical footprint in existing and new markets; and
                  - generic [ref=f21e868]: •Investing in technology, automation, and our associates to deliver growth, expand operating margins and improve returns.
                  - generic [ref=f21e869]: Seasonal Aspects of Operations. Our business is seasonal to a certain extent and varies by country due to different national and religious holidays, festivals and customs, as well as different weather patterns. Historically, our highest sales volume for each segment has occurred in the fourth quarter of our fiscal year.
                  - generic [ref=f21e870]: Suppliers, Supply Chain and Distribution. As a retailer and warehouse club operator, we utilize a global supply chain that includes both U.S. and international suppliers from whom we purchase the merchandise that we sell in our stores, clubs and online. In many instances, we purchase merchandise from producers located near the stores and clubs in which such merchandise will be sold, particularly perishable items. Consistent with applicable laws, we offer our suppliers the opportunity to efficiently sell significant quantities of their products to us. These relationships enable us to obtain pricing that reflects the volume, certainty and cost-effectiveness these arrangements provide to such suppliers, which in turn enables us to provide low prices to our customers. Our suppliers are subject to standards of conduct, including requirements that they comply with local labor laws, local worker safety laws and other applicable laws. Our ability to acquire from our suppliers the assortment and volume of products we wish to offer to our customers, to receive those products within the required time through our supply chain and to distribute those products to our stores and clubs, determines, along with other supply chain logistics matters (such as containers or port access for example), in part, our in-stock levels in our stores and clubs and the attractiveness of our merchandise assortment we offer to our customers and members.
                  - generic [ref=f21e871]: We continue to invest in supply chain automation and our fulfillment and delivery capabilities to better serve our customers. In the U.S., we utilize a network of 192 distribution facilities located strategically throughout the country using a combination of our private truck fleet as well as contracting with common carriers. During fiscal 2026, we began combining the Sam's Club U.S. supply chain function with Walmart U.S. to streamline operations and leverage our enterprise systems and infrastructure over time. Outside the U.S., we utilize a total of 179 distribution facilities strategically located in Africa, Canada, Central America, Chile, China, India and Mexico, which process and distribute both imported and domestic products to where our customers live. For fiscal 2026, the majority of our purchases of store and club merchandise were shipped through these facilities, while most of the remaining merchandise we purchased was shipped directly from suppliers to our stores and clubs. As an omnichannel retailer, we ship merchandise purchased by customers on our eCommerce platforms by a number of methods from multiple locations, including leveraging our network of stores and clubs to fulfill and deliver customer orders, as well as shipping directly from eCommerce fulfillment centers and other distribution facilities.
                  - generic [ref=f21e872]: "9"
                  - separator [ref=f21e875]
                  - generic [ref=f21e878]: Intellectual Property. We regard our trademarks, service marks, copyrights, patents, domain names, trade dress, trade secrets, proprietary technologies and similar intellectual property as important to our success, and with respect to our associates, customers and others, we rely on trademark, copyright, and patent laws, trade-secret protection, and confidentiality and/or license agreements to protect our proprietary rights. We have registered, or applied for the registration of, a number of U.S. and international domain names, trademarks, service marks and copyrights. Additionally, we have filed U.S. and international patent applications covering certain of our proprietary technology. We have licensed in the past, and expect that we may license in the future, certain of our proprietary rights to third parties.
                  - generic [ref=f21e879]:
                    - text: Government Regulation. As a company with global operations, we are subject to the laws of the United States and multiple foreign jurisdictions in which we operate and the rules and regulations of various governing bodies, which may differ among jurisdictions. For additional information, see the risk factors herein in "
                    - link "Item 1A. Risk Factors" [ref=f21e881] [cursor=pointer]:
                      - /url: "#i6e16e33efce1499a82f13fd9f63b74c6_40"
                    - text: "\" under the sub-caption \"Legal, Tax, Regulatory, Compliance, Reputational and Other Risks.\""
                  - generic [ref=f21e882]: Our Shared Value Priorities
                  - generic [ref=f21e883]: As part of our purpose to help people save money and live better, we seek to operate our business in a way that creates shared value. We believe we maximize long-term value and competitive advantage by delivering for stakeholders, customers, associates, shareholders, suppliers, partners and communities. Addressing their needs strengthens our business by building trust, creating opportunity, managing cost and risk, developing future capabilities and reinforcing the systems on which we rely.
                  - generic [ref=f21e884]: We prioritize stakeholder issues with the greatest potential to create long-term shared value - those most relevant to our business, important to stakeholder trust and where Walmart can make a meaningful impact.
                  - generic [ref=f21e885]: •Opportunity. Expanding economic opportunity for associates, suppliers and communities helps us attract and retain talent, meet customer needs and strengthen resilience. As described further below, our workforce strategy focuses on preparing our workforce for the future by aligning skills with evolving business needs and investing in career pathways and learning. We also support supplier growth through development programs and sourcing from a diverse mix of local and global suppliers.
                  - generic [ref=f21e886]: •Sustainability. Walmart's sustainability efforts focus on enhancing the resilience of our operations and product value chains to enhance surety of supply, catalyze innovation and growth, maintain everyday low cost and build stakeholder trust. Our priorities include reducing greenhouse gas emissions, regenerating natural resources, reducing product and packaging waste and supporting people who work in supply chains through responsible sourcing and the creation of economic opportunity.
                  - generic [ref=f21e887]: •Community. We serve customers globally through our omnichannel model and contribute to community vitality by providing quality jobs and training, investing in local suppliers, supporting causes important to customers and associates and assisting communities during crises and natural disasters.
                  - generic [ref=f21e888]: •Ethics and Integrity. We foster trust by promoting ethics and compliance, maintaining strong governance and oversight, engaging responsibly in public policy, using data and technology responsibly and respecting human rights.
                  - generic [ref=f21e889]: We report periodically on these priorities through environmental, social and governance disclosures on our corporate website, which are not incorporated by reference into this Annual Report on Form 10-K or incorporated by reference into any of our other filings with the SEC.
                  - generic [ref=f21e890]: Human Capital Management
                  - generic [ref=f21e891]: As Walmart grows, the way we attract, develop and reward talent - and design how work gets done - evolves alongside our business. Our business is focused on serving people and this is delivered by our approximately 2.1 million associates around the world with approximately 1.6 million associates in the U.S. and approximately 0.5 million associates internationally. In the U.S., approximately 92% of our associates are hourly and approximately 68% of our associates are full-time. Our workforce strategy reflects our commitment to creating a future-ready workforce, supporting associate growth, and fostering a culture where associates can thrive.
                  - generic [ref=f21e892]: Workforce Strategy and Enablement. Our workforce strategy focuses on aligning our organizational structure, talent capabilities and technology investments with the evolving needs of the business, including development of a digitally skilled, AI-enabled workforce. This includes preparing associates for new roles, technologies and ways of working, as well as deploying digital tools that support associate effectiveness, engagement and performance. As part of this effort, we are making everyday work simpler and more meaningful by reshaping roles to emphasize uniquely human strengths such as creativity and leadership and identifying areas where AI can automate repetitive tasks.
                  - generic [ref=f21e893]: We are committed to maintaining fair and competitive workforce practices as we evolve how work gets done. We regularly review our workforce practices to support consistency, accountability and long-term sustainability, and we maintain a performance-based culture where associates are rewarded based on meaningful factors such as qualifications, experience, performance and the work they do.
                  - generic [ref=f21e894]: "10"
                  - separator [ref=f21e897]
                  - generic [ref=f21e900]: Associate Growth and Development. Investment in associate growth and development supports skill-building, leadership development and overall business performance. Development programs are designed to meet both individual and business needs, offering multiple career pathways and learning opportunities across roles, levels and geographies. Our development approach focuses on building leadership, technical and professional capabilities and equipping associates with the skills required for a changing environment. This includes company‑wide AI learning pathways and certifications designed to meet associates where they are.
                  - generic [ref=f21e901]: Internal career mobility is an important component of our talent model. Approximately 75% of U.S. salaried store, club and supply chain management associates began their careers in hourly positions, reflecting long‑term advancement opportunities within the Company.
                  - generic [ref=f21e902]: Development is further supported through targeted programs such as Walmart Academy, which provides training in retail skills, leadership and well‑being, along with Live Better U, which offers eligible associates access to high school diplomas, certificates, skills credentials and college degrees that are aligned to business needs and in-demand roles.
                  - generic [ref=f21e903]: By investing in development, career mobility and skills, we strengthen our associate value proposition and support a workforce capable of adapting as our business evolves.
                  - generic [ref=f21e904]: Associate Experience and Engagement. Our efforts focus on supporting associate well-being, listening and a culture of belonging. We prioritize the financial, physical and mental well-being of our associates by offering competitive wages and a broad range of benefits designed to meet the diverse needs of our global workforce and their eligible dependents. In the U.S., these benefits include a 401(k) match, Associate Stock Purchase Plan match, associate discounts, predictable scheduling practices, paid time off, life insurance, medical coverage (for most plans, this includes no-cost virtual care and no-cost centers of excellence program for certain complex conditions), behavioral health services, family building benefits, maternity leave and paid parental leave for full-time associates.
                  - generic [ref=f21e905]: We focus on creating a workplace where associates feel seen, supported and connected, and where they can perform at their best. Associate perspectives help shape the workplace through listening channels such as in-person dialogue, leadership visits and listening sessions, associate engagement surveys, pulse surveys and always-on confidential reporting mechanisms, including Open Door and ethics processes.
                  - generic [ref=f21e906]: Walmart's culture is grounded in our core value of "Respect the Individual," and we believe in fostering a culture where everyone belongs-for associates and for driving business success. When associates feel valued for who they are, engagement deepens and associates are empowered to better serve our customers and members while delivering innovative solutions for our business. As part of our commitment to accountability and transparency, we publish workforce representation data and provide recurring updates to senior leadership, including our President and CEO, and to members of our Board of Directors.
                  - generic [ref=f21e907]:
                    - text: Additional information about our associates and our investments in them can be found on our corporate website, which are not incorporated by reference into this Annual Report on Form 10-K or incorporated by reference into any of our other filings with the SEC. Certain information relating to retirement-related benefits we provide to our associates is included in
                    - link "Note 10" [ref=f21e909] [cursor=pointer]:
