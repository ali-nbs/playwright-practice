                  - generic [ref=f21e1241]: Like most retailers, we process in our information systems personal information and/or payment information about our customers and members, and we also process information concerning our associates and vendors. In addition, our health and wellness business operations and third-party service providers who handle information on our behalf store and maintain protected health information. We also collect certain consumer data, which is stored digitally and used to conduct and facilitate our businesses. We utilize third-party service providers for a variety of reasons, including, without limitation, for digital storage technology, compute capacity, medical record documentation, content delivery to customers and members, back-office support and other functions. Such providers may have access to information we hold about our customers, members, associates, business partners or vendors. In addition, our eCommerce operations depend upon the secure transmission of confidential information over public networks, including information permitting cashless payments.
