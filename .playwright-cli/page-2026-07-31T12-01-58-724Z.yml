                  - generic [ref=f21e3401]: Net sales for the Walmart U.S. segment increased $20.6 billion or 4.4% and $20.6 billion or 4.7% for fiscal 2026 and 2025, respectively, when compared to the previous fiscal year. The increases in net sales were primarily due to increases in comparable sales of 4.3% and 4.8% for fiscal 2026 and 2025, respectively. Comparable sales in fiscal 2026 were driven by growth in average ticket and transactions, and also reflected growth in unit volumes and strength in all merchandise categories. Comparable sales in fiscal 2025 were driven by growth in transactions and unit volumes, with strong sales in grocery and health and wellness. Walmart U.S. eCommerce sales positively contributed approximately 4.3% and 2.9% to comparable sales for fiscal 2026 and 2025, respectively. This growth reflects continued strength in customer and Walmart+ member engagement with omnichannel offerings, and was primarily driven by store-fulfilled pickup and delivery.
                  - generic [ref=f21e3402]: Membership and other income increased slightly for fiscal 2026 and increased $0.6 billion for fiscal 2025. In both years, the increases were primarily driven by double-digit growth in membership fee revenue from Walmart+. For fiscal 2026, the increase was partially offset by decreases in certain other income items, including a reduction in recycling income. Fiscal 2025 also benefited from higher recycling income compared to the previous fiscal year.
                  - generic [ref=f21e3403]: Gross profit rate increased 22 and 47 basis points for fiscal 2026 and 2025, respectively, when compared to the previous fiscal year. The increase for fiscal 2026 was primarily driven by disciplined inventory management and growth in higher margin businesses, partially offset by mix shifts into lower margin merchandise categories. The increase for fiscal 2025 was primarily due to managing prices aligned to our competitive historic price gaps and growth in higher margin businesses, partially offset by product mix shifts into lower margin categories.
                  - generic [ref=f21e3404]: Operating expenses as a percentage of segment net sales increased 15 and 44 basis points for fiscal 2026 and 2025, respectively, when compared to the previous fiscal year. The increase for fiscal 2026 was primarily due to higher self-insured general liability claims expense and increased depreciation related to our capital investments. For fiscal 2025, the increase was primarily due to increased marketing expenses, higher variable pay as a result of exceeding planned performance and increased depreciation expenses.
                  - generic [ref=f21e3405]: As a result of the factors discussed above, segment operating income increased $1.3 billion and $1.7 billion for fiscal 2026 and 2025, respectively, when compared to the previous fiscal year.
