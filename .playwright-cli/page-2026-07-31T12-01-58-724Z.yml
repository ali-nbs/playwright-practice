                  - generic [ref=f21e2707]: ROA was 8.2% and 7.9% for fiscal 2026 and 2025, respectively. The increase in ROA was primarily due to an increase in net income as a result of net increases in the fair value of our equity and other investments combined with higher operating income, offset by an increase in average total assets due to higher purchases of property and equipment. ROI was 15.1% and 15.5% for fiscal 2026 and 2025, respectively. The decrease in ROI was primarily due to an increase in average invested capital due to higher purchases of property and equipment. ROI benefited from increased operating income due to improved business performance, which was partially offset by the incremental non-cash share-based compensation charge at PhonePe as well as certain legal matters and other business restructuring charges.
