                    - text: . The availability of our information systems and the integrity of data are essential to our business operations, including the processing of transactions, management of our associates, facilities, logistics, inventories, physical stores and clubs and our online operations. Our information systems are not fully redundant and our disaster recovery planning cannot account for all eventualities. If our systems are damaged, breached, attacked, interrupted or otherwise cease to function properly, we may have to make a significant investment to repair or replace them, and may experience loss or corruption of data as well as suffer interruptions in our business operations in the interim. Any interruption to the availability of our information systems or corruption of our data may have a material adverse effect on our business or results of operations. In addition, the cost of securing our systems against failure or attack is considerable, and increases in these costs, particularly in the wake of a breach or failure, could be significant.
                  - generic [ref=f21e1229]: In addition, we frequently update our information technology hardware, software, processes and systems. The risk of system disruption is increased when significant system changes are undertaken. If we fail to timely or successfully integrate and update our information systems and processes, system disruptions may occur and we may fail to realize the cost savings or operational benefits anticipated to be derived from these initiatives and our business, results of operations, financial condition and cash flows could be negatively impacted.
