                  - generic [ref=f21e1340]: Data privacy and protection laws or customer expectations relating to the collection, use, retention, disclosure, transfer and processing of personal information continue to undergo a rapid transformation in the U.S. and non-U.S. jurisdictions. State laws, such as the California Consumer Privacy Act ("CCPA"), in a number of states that have become effective, or will soon be effective, have created a substantially more complex regulatory regime associated with data-handling practices. Moreover, other laws and regulations related to data-handling and privacy that apply to our business, such as the Illinois Biometric Information Privacy Act, the European Union's General Data Protection Regulation ("GDPR"), the United Kingdom's General Data Protection Regulation (which implements the GDPR into U.K. law), China's Personal Information Protection Act ("PIPL"), and similar legislation in Quebec, Canada further increase the compliance obligations of our business. Certain of these laws have required us to modify our data processing practices and policies and to incur substantial costs and expenses to comply, which we anticipate will continue in the future. These and other privacy and cybersecurity laws may carry significant potential damages and civil penalties for noncompliance. These administrative fines are discretionary and based, in each case, on a multi-factored approach. Further, PIPL raises the requirements for processing personal information and requires our China business to undergo a cybersecurity assessment and obtain approval from the Cyberspace Administration of China ("CAC") as well as consent from the personal information owner before personal information collected in China may be transferred to, or accessed from, outside of China. We obtained CAC approval in September 2023 and are required to reapply by August 2026. We have made changes, and we may in the future make additional adjustments to our business practices, to comply with the personal information protection laws and regulations in China as they evolve. Residents in jurisdictions with comprehensive privacy laws generally have rights to access, correct and require deletion of their personal information, opt out of certain personal information sharing and selling, receive detailed information about how their personal information is used and may have a private right of action for data breaches. Furthermore, our marketing and customer engagement activities are subject to communications privacy laws such as the Telephone Consumer Protection Act. We may be subject to penalties and other consequences for noncompliance, including being required to change some portions of our business. Even an unsuccessful challenge by customer or regulatory authorities of our activities could result in adverse publicity, impact our reputation and could require a costly response from and defense by us.
