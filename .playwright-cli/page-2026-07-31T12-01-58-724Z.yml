                  - generic [ref=f21e910]: Our Website and Availability of SEC Reports and Other Information
                  - generic [ref=f21e911]: Our corporate website is located at www.stock.walmart.com. We file with, or furnish to, the SEC Annual Reports on Form 10-K, Quarterly Reports on Form 10-Q, Current Reports on Form 8-K, amendments to those reports, proxy statements and annual reports to shareholders, and, from time to time, other documents. The reports and other documents filed with, or furnished to, the SEC are available to investors on or through our corporate website free of charge as soon as reasonably practicable after we electronically file them with or furnish them to the SEC. The SEC maintains a website that contains reports, proxy and information statements and other information regarding issuers, such as the Company, that file electronically with the SEC. The address of that website is www.sec.gov. Our SEC filings, our Reporting Protocols for Senior Financial Officers and our Code of Conduct can be found on our website at www.stock.walmart.com. These documents are available in print to any shareholder who requests a copy by writing or calling our Investor Relations Department, which is located at our principal offices.
                  - generic [ref=f21e912]: A description of any substantive amendment or waiver of Walmart's Reporting Protocols for Senior Financial Officers or our Code of Conduct for our chief executive officer, our chief financial officer and our controller, who is our principal accounting officer, will be disclosed on our website at www.stock.walmart.com under the Corporate Governance section. Any such description will be located on our website for a period of 12 months following the amendment or waiver.
