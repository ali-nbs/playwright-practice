                        - cell [ref=f21e790]
                        - cell "BUSINESS" [ref=f21e792]
                  - generic [ref=f21e793]: General
                  - generic [ref=f21e794]: Walmart Inc. ("Walmart," the "Company" or "we") is a people-led, technology-powered omnichannel retailer dedicated to helping people around the world save money and live better by providing the opportunity to shop in both retail stores and through eCommerce, and to access our other service offerings. Through innovation, we strive to continuously improve a customer-centric experience that seamlessly integrates our eCommerce and retail stores in an omnichannel offering that saves time for our customers. Each week, we serve approximately 280 million customers who visit more than 10,900 stores in 19 countries and through our numerous eCommerce websites and mobile applications.
                  - generic [ref=f21e795]: Our strategy is to make every day easier for busy families, operate with discipline, sharpen our culture and become more digital, and make trust a competitive advantage. Making life easier for busy families includes our commitment to price leadership, which has been and will remain a cornerstone of our business, as well as increasing convenience to save our customers time. By leading on price, we earn the trust of our customers every day by providing a broad assortment of quality merchandise and services at everyday low prices ("EDLP"). EDLP is our pricing philosophy under which we price items at a low price every day so our customers trust that our prices will not change under frequent promotional activity. Everyday low cost ("EDLC") is our commitment to control expenses so our cost savings can be passed along to our customers.
                  - generic [ref=f21e796]: "Our operations comprise three reportable segments: Walmart U.S., Walmart International and Sam's Club U.S. Our fiscal year ends on January 31 for our United States (\"U.S.\") and Canadian operations. We consolidate all other operations generally using a one-month lag and on a calendar year basis. Our discussion is as of, and for the fiscal years ended, January 31, 2026 (\"fiscal 2026\"), January 31, 2025 (\"fiscal 2025\") and January 31, 2024 (\"fiscal 2024\"). During fiscal 2026, we generated total revenues of $713.2 billion, which primarily comprised net sales of $706.4 billion."
                  - generic [ref=f21e797]: We maintain our principal offices in Bentonville, Arkansas. Our common stock trades on the Nasdaq Global Select Market under the symbol "WMT."
                  - generic [ref=f21e798]: The Development of Our Company
                  - generic [ref=f21e799]: The businesses conducted by our founders began in 1945 when Sam M. Walton opened a franchise Ben Franklin variety store in Newport, Arkansas. In 1946, his brother, James L. Walton, opened a similar store in Versailles, Missouri. Until 1962, our founders' business was devoted entirely to the operation of variety stores, at which time we began to open discount stores. We completed our initial public offering in 1970. In 1983, we opened our first Sam's Club, and in 1988, we opened our first supercenter. In 1998, we opened our first Walmart Neighborhood Market. In 1991, we began our first international initiative when we entered into a joint venture in Mexico and, as of January 31, 2026, our Walmart International segment conducted business in 18 countries.
                  - generic [ref=f21e800]: In 1996, we began our first eCommerce initiative by creating both walmart.com and samsclub.com. Since then, our eCommerce presence has continued to grow. In 2007, leveraging our physical stores, walmart.com launched its Site-to-Store service, enabling customers to make a purchase online and pick up merchandise in stores. Today, customers can access pickup or delivery services at over 8,400 locations globally, reflecting our ability to leverage our store and club footprint to expand customer access. In 2018, we expanded our eCommerce and digital presence through acquisitions with our majority stakes in Flipkart and PhonePe in India. We continue to heavily invest in omnichannel and eCommerce innovation, as well as supply chain capabilities, which enables us to leverage technology, talent and expertise, and expand our assortment and service offerings, including through the integration of advanced technologies such as AI.
                  - generic [ref=f21e801]: We are enhancing our omnichannel capabilities through a combination of stores, eCommerce websites, mobile applications and service offerings, as well as our supply chain, combined with approximately 2.1 million associates as of January 31, 2026, to better serve our customers. Our strategies increasingly include the use of AI-powered tools to support customer and member-facing experiences, associate productivity and operational efficiency across our ecosystem. Together, these elements produce a global retail ecosystem that we believe allows customers to view Walmart as their primary retail destination. As we execute on our strategy globally, our business continues to expand through offerings such as membership, advertising, marketplace and fulfillment services, and financial services. These offerings represent mutually reinforcing pieces of our omnichannel model centered on our customers around the world who are increasingly seeking convenience.
                  - generic [ref=f21e802]: Information About Our Segments
                  - generic [ref=f21e803]:
                    - text: "We are engaged in global operations of retail, wholesale and other units, as well as eCommerce, located throughout the U.S., Africa, Canada, Central America, Chile, China, India and Mexico. Our operations are conducted in three reportable segments: Walmart U.S., Walmart International and Sam's Club U.S., which are further described below. Each segment contributes to the Company's operating results differently. However, each has generally maintained a consistent contribution rate to the Company's net sales in recent years other than minor changes to the contribution rate for the Walmart International segment due to fluctuations in currency exchange rates. Additional information on our operating segments and geographic information is contained in"
