                        - cell "RISK FACTORS" [ref=f21e1155]
                  - generic [ref=f21e1156]: The risks described below could, in ways we may or may not be able to accurately predict, materially and adversely affect our business, results of operations, financial position and liquidity. Our business operations could also be affected by additional factors that apply to all companies operating in the U.S. and globally. The following risk factors do not identify all risks that we may face. The disclosures below reflect our beliefs and opinions as to risk factors that could materially and adversely affect our business operations and our securities in the future. References to past events are provided by way of example only and are not intended to be a complete listing or a representation as to whether or not such risk factors have occurred in the past or their likelihood of occurring in the future.
                  - generic [ref=f21e1157]: Strategic Risks
                  - generic [ref=f21e1158]: Failure to successfully execute our omnichannel strategy and the cost of our investments in eCommerce and technology may materially adversely affect our market position, net sales and financial performance.
                  - generic [ref=f21e1159]: The retail business continues to rapidly evolve with consumers embracing the digital shopping experience and expecting a robust online marketplace of goods available for purchase and delivery. As a result, the portion of total consumer expenditures with retailers and wholesale clubs occurring through digital platforms is increasing and the pace of this increase could continue to accelerate.
                  - generic [ref=f21e1160]: Our strategy, which includes investments in eCommerce, technology, AI, talent, supply chain automation and enhancements, advertising, acquisitions, joint ventures, new store and club openings and remodels and other customer initiatives, may not adequately or effectively allow us to continue to grow our omnichannel business offerings, increase comparable sales or maintain or grow our overall market position. The success of this strategy will depend in large measure on our ability to continue building and delivering a seamless omnichannel shopping experience and interconnected ecosystem for our customers that deepens and maintains our relationships with our customers across our various businesses and partnerships. Customers are using digital means, including websites, captive and third-party digital applications, social media, and emerging agentic platforms to shop with us and our competitors and to do comparison shopping, and we use these digital means along with digital advertising, text messages and email to interact with our customers and enhance their shopping experience.
                  - generic [ref=f21e1161]:
                    - text: The success of this strategy is further subject to the related risks discussed in this
                    - link "Item 1A" [ref=f21e1163] [cursor=pointer]:
                      - /url: "#i6e16e33efce1499a82f13fd9f63b74c6_40"
                    - text: . With the interconnected components of this enterprise strategy and an increasing allocation of capital expenditures focused on these initiatives, changes in customer or member perceptions about our reputation in general, or our failure to successfully execute on individual components of this strategy may adversely affect our market position, net sales and financial performance, which could also result in impairment charges to intangible assets or other long-lived assets. In addition, a greater concentration of eCommerce sales, including increasing online grocery sales and the increasing role of AI-enabled platforms in product search, discovery, advertising and purchasing, could result in a reduction in the amount of traffic in our stores and clubs, which would, in turn, reduce the opportunities for cross-store or cross-club sales of merchandise that such traffic creates and could reduce our sales within our stores and clubs and materially adversely affect our financial performance.
                  - generic [ref=f21e1164]: Furthermore, the cost of certain investments in eCommerce, technology, talent and automation, including any operating losses incurred for those initiatives, will adversely impact our financial performance in the short-term and failure to realize the benefits of these investments may adversely impact our financial performance over the longer term.
                  - generic [ref=f21e1165]: If we do not timely identify or effectively respond to consumer trends or preferences, it could negatively affect our reputation, relationship with our customers, demand for the products and services we sell, our market share and the growth of our business.
                  - generic [ref=f21e1166]: It is difficult to predict consistently and successfully the products and services our customers will demand and changes in their shopping patterns, tastes and preferences. The success of our business depends in part on how accurately we predict consumer demand, availability of merchandise, the related impact on the demand for existing products and services and the competitive environment. Our business is dependent on our ability to make critical decisions and predictions with respect to merchandise categories that quickly respond to changing consumer spending patterns, tastes and preferences, and any incorrect calculations by us may result in lower sales, spoilage and inventory markdowns, which could adversely impact our results of operations. Our ability to predict and adapt to changing tastes and preferences depends on many factors, including obtaining accurate and relevant data on customer preferences, emphasizing relevant merchandise categories, effectively managing our inventory levels, implementing competitive and effective pricing and promotion strategies. Price transparency, assortment of products, customer experience, convenience, ease and the speed and cost of shipping are of primary importance to customers and continue to increase in importance, particularly as a result of digital tools, social media, and emerging agentic tools available to consumers and the choices available to consumers for purchasing products. In addition, to remain competitive, we must continue to develop, integrate and scale digital tools, including AI-powered search and discovery platforms and capabilities, useful interfaces and other marketing tools such as third-party recommendation engines, paid search and mobile applications. We must continue to preserve our reputation, which is impacted by public perceptions and customer experiences. It may be difficult to address negative publicity across media channels, regardless of whether it is accurate. Negative incidents, including the loss of merchandise as a result of shrink or theft, ineffective use or misuse of AI technologies, inaccurate, biased or otherwise flawed
                  - generic [ref=f21e1167]: "13"
                  - separator [ref=f21e1170]
                  - generic [ref=f21e1173]: AI search and discovery results, or a data breach as a result of a cyberattack could quickly erode trust and confidence in our business and could result in customer dissatisfaction, consumer boycotts, workforce unrest and government investigations. These incidents may involve us, our vendors that handle our data or personal information, our workforce or others with whom we do business, including third-party service providers and independent contractors. Societal expectations, preferences, trends and political expression are ever-changing and we try to adapt, evolve and maintain a balance that meets the acceptance of our customers, members, associates, shareholders, suppliers and other stakeholders, but we may not always move as quickly or in the direction that various competing interests desire or demand, which could impact our reputation. For instance, strong opinions continue to be publicly expressed both for and against various social and environmental initiatives and positions taken by many corporations, including Walmart, are tracked, monitored and subject to heightened scrutiny from consumers, investors, advocacy groups and public figures, potentially leading to consumer boycotts, negative publicity campaigns, litigation and reputational harm. Negative reputational incidents or negative perceptions of us could adversely impact our business and results of operations, including through lower sales, the termination of business relationships and negative impacts to associate retention and recruiting efforts. Moreover, failure to adequately predict customer demand and consumer spending patterns or otherwise optimize and operate our distribution and fulfillment centers could result in excess or insufficient inventory, service interruptions and increased costs, any of which could significantly harm our business. As we continue to add new fulfillment centers, our fulfillment and technology networks become increasingly complex and operating them in a way that effectively meets consumer demands continues to be challenging. There can be no assurance that we will be able to operate our networks effectively.
                  - generic [ref=f21e1174]: We face strong competition from other retailers, wholesale club operators, omnichannel retailers and other businesses which could materially adversely affect our financial performance.
                  - generic [ref=f21e1175]: Each of our segments competes for customers, employees, digital prominence, products and services and in other important aspects of its business with many other local, regional, national and global physical, eCommerce and omnichannel retailers, social commerce platforms, wholesale club operators and retail intermediaries, and emerging agentic shopping tools and platforms, as well as companies that offer services in digital advertising, data analytics/insights, fulfillment and delivery services, health and wellness and financial services. The omnichannel retail landscape is highly competitive and rapidly evolving, and the entry of new, well-funded competitors, or more rapid development of AI capabilities and agentic tools by these competitors to enhance productivity and the shopping experience, may increase competitive pressures. In addition, for eCommerce and other internet-based businesses, newer or smaller businesses may be better able to innovate and compete with us.
                  - generic [ref=f21e1176]: We compete in a variety of ways, including the prices at which we sell our merchandise, merchandise selection and availability, services offered to customers, location, store hours, in-store amenities, the shopping convenience and overall shopping experience we offer, the attractiveness and ease of use of our digital platforms, quality and accessibility of data for customers, suppliers, and associates, and cost, speed of and options for accurate delivery to customers of merchandise purchased through our digital platforms or through our omnichannel integration of our physical and digital operations.
                  - generic [ref=f21e1177]:
                    - text: A failure to respond effectively to these competitive pressures and changes in the retail and other markets in which we operate, omnichannel innovations and omnichannel ecosystems developed by our competitors or delays or failure in execution of our strategy could materially adversely affect our financial performance. See "
                    - link "Item 1. Business" [ref=f21e1179] [cursor=pointer]:
                      - /url: "#i6e16e33efce1499a82f13fd9f63b74c6_16"
                    - text: "\" above for additional discussion of the competitive landscape of our business."
                  - generic [ref=f21e1180]: Further, the protection of our proprietary rights, including our trademarks, copyrights, domain names, patents and trade secrets, is important to our business. Effective protection of our proprietary rights may not be available in every jurisdiction in which we offer our products and services, and we may not be able to prevent or deter third parties from infringing or misappropriating our intellectual property, or ensure that third parties will not independently develop equivalent or superior intellectual property rights, which could affect our ability to maintain a competitive advantage and adversely impact our business.
                  - generic [ref=f21e1181]: Certain segments of the retail industry are undergoing consolidation or substantially reducing operations, whether due to bankruptcy, economics or other factors. Such consolidation, or other business combinations or alliances, competitive omnichannel ecosystems or reductions in operations may result in competitors with improved financial resources, improved access to merchandise, greater market penetration and other improvements in their competitive positions. Such business combinations or alliances could allow these companies to provide a wider variety of products and services at competitive prices, which could adversely affect our financial performance.
                  - generic [ref=f21e1182]: General or macro-economic factors, both domestically and internationally, may materially adversely affect our financial performance.
                  - generic [ref=f21e1183]: General economic conditions and other economic factors, globally or in one or more of the markets we serve, may adversely affect our financial performance. Higher interest rates, higher prices of petroleum products, including crude oil, natural gas, gasoline and diesel fuel, increased costs for electricity and other energy, weakness in the housing market, inflation, deflation, increased costs of essential services, such as medical care and utilities, higher levels of unemployment, decreases in GDP and consumer purchasing power (including from reductions resulting from changes to government programs), unavailability of
                  - generic [ref=f21e1184]: "14"
                  - separator [ref=f21e1187]
                  - generic [ref=f21e1190]: consumer credit, higher consumer debt levels, changes in consumer spending and shopping patterns, fluctuations in currency exchange rates, higher tax rates, imposition of new taxes or other changes in tax laws, changes in healthcare laws, other regulatory changes, the imposition of export and import restrictions, tariffs, trade barriers or other measures that create barriers to or increase the costs associated with international trade, overall economic slowdown or recession and other economic factors in the U.S., or in any of the other markets in which we operate, could adversely affect consumer demand for the products and services we sell in the U.S. or such other markets, change the mix of products we sell to any one or more markets with a lower average gross margin, cause a slowdown in discretionary purchases of goods, adversely affect our net sales, growth rates, operating income and result in slower inventory turnover and greater markdowns of inventory, or otherwise materially adversely affect our operations and operating results and could result in impairment charges to intangible assets, goodwill or other long-lived assets.
                  - generic [ref=f21e1191]: In addition, the economic factors listed above, any other economic factors or circumstances resulting in higher transportation, labor, insurance or healthcare costs or commodity prices, including energy prices, and other economic factors in the U.S. and other countries in which we operate can increase our cost of sales and operating, selling, general and administrative expenses and otherwise materially adversely affect our operations and operating results.
                  - generic [ref=f21e1192]: The economic factors that affect our operations may also adversely affect the operations of our suppliers, which can result in an increase in the cost to us of the goods we sell to our customers or, in more extreme cases, in certain suppliers not producing goods in the volume typically available to us for sale, or adversely impact product margins due to higher labor and material costs of our suppliers that we are unable, or choose not, to pass on to our customers.
                  - generic [ref=f21e1193]: The performance of strategic alliances and other business relationships to support the expansion of our business could materially adversely affect our financial performance.
                  - generic [ref=f21e1194]: We may enter into strategic alliances and other business relationships in the countries in which we have existing operations or in other markets to expand our business. These arrangements may not generate the level of sales or profitability we anticipate when entering into the arrangement or may otherwise adversely impact our business and competitive position relative to the results we could have achieved in the absence of such alliance. In addition, any investment we make in connection with a strategic alliance, business relationship or in certain of our divested markets, could materially adversely affect our financial performance.
                  - generic [ref=f21e1195]: Operational Risks
                  - generic [ref=f21e1196]: Global or regional health pandemics or epidemics could negatively impact our business, financial position and results of operations.
                  - generic [ref=f21e1197]: The emergence, severity, magnitude and duration of global or regional pandemics, epidemics or other health crises are uncertain and difficult to predict. A pandemic, epidemic or contagious disease outbreak that affects humans or the food supply, such as the avian flu impact on poultry and egg production could impact our business operations, demand for our products and services, in-stock positions, costs of doing business, access to inventory, supply chain operations, ability to predict future performance, exposure to litigation and financial performance, among other things. In the event of any global or regional health crisis, customer demand for certain products may fluctuate, customer behaviors may change and consumer disposable income could be negatively impacted, which may challenge our ability to anticipate and/or adjust inventory levels to meet that demand. These risks and their impacts are difficult to predict and could otherwise disrupt and adversely affect our operations and our financial performance.
                  - generic [ref=f21e1198]: To the extent that a future pandemic, epidemic or contagious disease outbreak occurs, such events may also heighten other risks described in this Item 1A, including but not limited to those related to consumer behavior and expectations, competition, our reputation, implementation of strategic initiatives, cybersecurity threats, payment-related risks, technology systems disruption, supply chain disruptions, labor availability and cost, and litigation and regulatory requirements.
                  - generic [ref=f21e1199]: Natural disasters, climate change, geopolitical events, catastrophic and other events could materially adversely affect our financial performance.
                  - generic [ref=f21e1200]: Natural disasters and weather conditions, which may include hurricanes, tropical storms, typhoons, floods, wildfires, cyclones, tornadoes, winter storms, droughts, extreme temperatures, could have a material adverse effect on our operations and financial performance, and a changing climate could exacerbate certain of these events and conditions. Moreover, geopolitical tensions or events such as war; civil unrest (including theft, looting or vandalism); terrorist attacks; acts of violence, including active shooter situations (such as those that have occurred in our U.S. stores); or similar disruptions in countries or regions in which our suppliers operate or through which goods are transported could materially adversely affect our operations and financial performance. Protecting the safety of our associates, including our senior leaders, is critical to preventing business disruption and executing on our business strategies and objectives.
                  - generic [ref=f21e1201]: The occurrence of these events could result in immediate and longer-term impacts on our operations, including physical damage or loss of properties, the closure of stores, clubs and distribution or fulfillment centers, limited operating hours, workforce shortages and challenges in labor availability, the inability of customers and associates to reach or have transportation to our
                  - generic [ref=f21e1202]: "15"
                  - separator [ref=f21e1205]
                  - generic [ref=f21e1208]: stores and clubs affected by such events, the evacuation of the populace from areas in which our stores, clubs and distribution and fulfillment centers are located, the unavailability of our digital platforms to our customers, and changes in the purchasing patterns of consumers (including the frequency of visits by consumers to physical retail locations, whether as a result of limitations on large gatherings, travel and movement limitations or otherwise). These events could also lead to temporary or long-term disruption in our supply chains, including by disrupting or delaying the delivery of goods to our distribution and fulfillment centers, stores and customers, negatively impacting consumers' disposable income; reducing the availability of products in our stores; increasing the costs of procuring products; increasing transportation costs (whether due to fuel prices, fuel supply or otherwise); disrupting critical infrastructure systems, banking systems, utility services or energy availability to our stores, clubs and our facilities; and disrupting communications with our stores, clubs and our other facilities.
                  - generic [ref=f21e1209]: We bear the majority of the costs associated with adaptation and the risk of losses incurred as a result of physical damage to, or destruction of, any stores, clubs, distribution or fulfillment centers and transportation vehicles and equipment; theft, loss or spoilage of inventory; and business interruption caused by such events. These events and their impacts could otherwise disrupt and adversely affect our operations and could materially adversely affect our financial performance. Moreover, our operations in the U.S. comprise a significant portion of our financial and operational performance. Therefore, any of the above matters that uniquely impact or are specifically concentrated in the U.S. could materially adversely affect our financial condition, results of operations or cash flows.
                  - generic [ref=f21e1210]: Risks associated with our suppliers could materially adversely affect our financial performance.
