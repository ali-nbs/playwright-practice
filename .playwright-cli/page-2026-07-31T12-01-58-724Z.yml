                  - generic [ref=f21e1350]: We are subject to risks related to litigation claims, and other legal proceedings that may materially adversely affect our results of operations, financial position and liquidity.
                  - generic [ref=f21e1351]: We operate globally in a highly regulated and litigious environment. We are or may be involved in legal proceedings, including litigation, arbitration and other claims, investigations, inspections, audits, claims, inquiries and similar actions by pharmacy, healthcare, tax, consumer protection, employment, environmental and other governmental authorities as well as private individuals. We may also be involved in legal proceedings brought by regulatory authorities, organizations and individuals relating to products, product claims or product packaging, including that such products or packaging are made of plastic, do not meet required safety standards, contain PFAS or other chemicals, are not appropriately disposed, contain incorrect weight or measurement, or contain misrepresentations about country of origin or assembly, recyclability, compostability, biodegradability or reusability. We may also have indemnification obligations for legal commitments of certain business customers we contract with and businesses we have divested. Legal proceedings, in general, and securities, derivative actions, class and representative actions and multi-district litigation, in particular, can be expensive and disruptive. Some of these suits may purport or may be determined to be class actions and/or involve parties seeking large and/or indeterminate amounts, including punitive or exemplary damages, and may remain unresolved for several years. For example, we are increasingly named as a defendant in cases that allege novel theories of personal injury or economic loss from consumer products, including multidistrict litigation relating to acetaminophen and baby food. We are a defendant in a number of cases containing class, representative or collective action allegations in which the plaintiffs have brought claims under federal, state and local wage and hour and employment laws, as well as a number of cases containing class-action allegations in which the plaintiffs have brought claims under federal and state competition and consumer protection laws. We cannot provide any assurance as to the scope and outcome of these matters and no assurance that our business, financial position, results of operations or cash flows will not be materially adversely affected.
                  - generic [ref=f21e1352]: We are increasingly named as a defendant in cases that involve allegations relating to the retail prices charged to customers and costs we negotiate with suppliers. These cases include purported class actions under federal and state antitrust and competition, consumer protection and related laws brought by customers, retailers and others, including cases related to our wholesale purchase and retail sale of batteries and soft drinks. We cannot provide any assurance as to the scope and outcome of these matters and no assurance that our business, financial position, results of operations or cash flows will not be materially adversely affected.
                  - generic [ref=f21e1353]: Claims for insurance-related liabilities, such as workers' compensation, general liability, auto liability, product liability and certain employee-related healthcare benefits, are funded predominantly through self-insurance. Insurance coverage is maintained for certain risks to limit exposures arising from significant losses. The types and amounts of insurance may vary from time to time based on our risk-management strategy, risk tolerance, regulatory requirements, market conditions and other factors. Significant claims or events, regulatory changes, a substantial rise in costs of health care or costs to maintain our insurance or the failure to maintain adequate insurance coverage could have an adverse impact on our financial condition and results of operations. Although we maintain specific coverages for catastrophic property losses, we still bear a significant portion of the risk of losses incurred as a result of any physical damage to, or the destruction of, any stores, warehouses, depots, manufacturing or home office facilities, loss or spoilage of inventory, and business interruption. Such losses could materially impact our cash flows and results of operations.
