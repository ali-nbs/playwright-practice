                  - generic [ref=f21e1328]: "Our health and wellness operations in the U.S. are subject to numerous federal, state and local laws and regulations including, but not limited to, those related to: licensing; reimbursement arrangements and other requirements and restrictions; registration and regulation of pharmacies; dispensing and sale of controlled substances and products containing pseudoephedrine; governmental (including Medicare and Medicaid) and commercial reimbursement; data privacy and security and the sharing and interoperability of data, including obligations and restrictions related to health information (such as those imposed under HIPAA); protection of consumer health data; billing and coding for healthcare services and properly handling overpayments; debt collection; necessity and adequacy of healthcare services; relationships with referral sources and referral recipients and other fraud and abuse issues, such as those addressed by anti-kickback and false claims laws and patient inducement regulations; qualification of healthcare practitioners; quality and standards of medical services and equipment; and the practice of the professions of pharmacy and optometry."
                  - generic [ref=f21e1329]: Health-related legislation at the federal and state level may have an adverse effect on our business or require us to modify certain aspects of our operations. For example, in the U.S., the Drug Enforcement Administration ("DEA") and various other regulatory authorities regulate the purchase, distribution, maintenance and dispensing of pharmaceuticals and controlled substances. We are required to hold valid DEA and state-level licenses, meet various security and operating standards and comply with the federal and various state-controlled substance acts and related regulations governing the sale, dispensing, disposal and holding of controlled substances. The DEA, the U.S. Food and Drug Administration and state regulatory authorities have broad enforcement powers, including the ability to seize or recall products and impose significant criminal, civil and administrative sanctions for violations of these laws and regulations. In addition, there has been recent heightened governmental and public scrutiny of pharmaceutical product pricing, which has resulted in federal and state legislation and regulations, executive orders and other initiatives and proposals designed to increase transparency in pharmaceutical product pricing and reform government program reimbursement methodologies (for example, the Inflation Reduction Act, which includes, among other matters, policies designed to impact drug prices and reduce drug spending by the federal government). Other health reform efforts at the federal and state levels may also impact our business or require us to modify certain aspects of our operations. States may enact conflicting laws, mandating changes in operations that negatively impact our ability to execute uniformly and achieve economies of scale across states. We may not be able to predict the nature or success of reform initiatives, and the resulting uncertainties may have an adverse effect on our business.
