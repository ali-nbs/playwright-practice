                  - generic [ref=f21e2801]: Free Cash Flow
                  - generic [ref=f21e2803]:
                    - generic [ref=f21e2804]: Free cash flow is considered a non-GAAP financial measure. Management believes, however, that free cash flow, which measures our ability to generate additional cash from our business operations, is an important financial measure for use in evaluating the Company's financial performance. Free cash flow should be considered in addition to, rather than as a substitute for, consolidated net income as a measure of our performance and net cash provided by operating activities as a measure of our liquidity. See
                    - link "Liquidity and Capital Resources" [ref=f21e2806] [cursor=pointer]:
                      - /url: "#i6e16e33efce1499a82f13fd9f63b74c6_103"
                    - text: for discussions of GAAP metrics including net cash provided by operating activities, net cash used in investing activities and net cash used in financing activities.
                  - generic [ref=f21e2807]:
                    - text: We define free cash flow as net cash provided by operating activities in a period minus payments for property and equipment made in that period. Walmart's definition of free cash flow is limited in that it does not represent residual cash flows available for discretionary expenditures due to the fact that the measure does not deduct the payments required for debt service and other contractual obligations or payments made for business acquisitions. Therefore, we believe it is important to view free cash flow as a measure that provides supplemental information to our
                    - link "Consolidated Statements of Cash Flows" [ref=f21e2809] [cursor=pointer]:
                      - /url: "#i6e16e33efce1499a82f13fd9f63b74c6_139"
                    - text: .
                  - generic [ref=f21e2810]: Although other companies report their free cash flow, numerous methods may exist for calculating a company's free cash flow. As a result, the method used by management to calculate our free cash flow may differ from the methods used by other companies to calculate their free cash flow.
                  - generic [ref=f21e2811]: The following table sets forth a reconciliation of free cash flow, a non-GAAP financial measure, to net cash provided by operating activities, which we believe to be the GAAP financial measure most directly comparable to free cash flow, as well as information regarding net cash used in investing activities and net cash used in financing activities.
