                  - generic [ref=f21e1877]:
                    - text: "I. SUPPLEMENTAL INFORMATION: The Company is involved in legal proceedings arising in the normal course of its business, including litigation, arbitration and other claims, and investigations, inspections, subpoenas, audits, claims, inquiries and similar actions by governmental authorities. We discuss certain legal proceedings in"
                    - link "Note 9" [ref=f21e1879] [cursor=pointer]:
                      - /url: "#i6e16e33efce1499a82f13fd9f63b74c6_178"
                    - text: to our Consolidated Financial Statements included in "
                    - link "Item 8. Financial Statements and Supplementary Data" [ref=f21e1881] [cursor=pointer]:
                      - /url: "#i6e16e33efce1499a82f13fd9f63b74c6_115"
                    - text: ",\" which is captioned \"Contingencies,\" under the sub-caption \"Legal Proceedings.\" We refer you to that discussion for important information concerning those legal proceedings, including the basis for such actions and, where known, the relief sought. We provide the following additional information concerning those legal proceedings, including the name of the lawsuit, the court in which the lawsuit is pending, and the date on which the petition commencing the lawsuit or appeal was filed, in addition to disclosure of certain other legal matters."
                  - generic [ref=f21e1882]: "Opioid-Related Litigation: In re National Prescription Opiate Litigation (MDL No. 2804) (the \"MDL\") is pending in the U.S. District Court for the Northern District of Ohio and includes approximately 230 cases with claims against the Company as of March 6, 2026. In addition, the following 13 other opioid-related cases against the Company and its subsidiaries were pending in U.S. state and federal courts and Canadian courts as of March 6, 2026: Baby Doe 1, et al. v. Allergan Finances, LLC, et al., U.S. Dist. Ct., E.D. Tenn., 4/29/25; Marshall Cty. Bd. of Educ., et al. v. Cephalon, Inc., et al., U.S. Dist. Ct., N.D. W. Va., 10/28/24; Reiner v. CVS Pharm., Inc., et al., Nev. 5th Jud. Dist. Ct., Nye Cty., 2/26/24; Chaney v. CVS Pharm., Inc., et al., Ky. Cir. Ct., Perry Cty., 12/11/23; City of Grande Prairie, et al. v. Apotex Inc., et al., Alta. King's Bench Ct., Calgary Jud. Ctr., 4/27/23; Lac La Ronge Indian Band, et al. v. Apotex Inc., et al., Sask. King's Bench Ct., Prince Albert Jud. Ctr., 3/17/23; Commonwealth of Pennsylvania ex rel. Allegheny Cty. Dist. Att'y Stephen A. Zappala, Jr. v. CVS Ind., LLC, et al., Pa. Ct. Com. Pl., Delaware Cty., 8/8/22; Baby Doe, et al., ex rel. Their Guardian Ad Litem v. Endo Health Sols., Inc., et al., U.S. Dist. Ct., M.D. Tenn., 8/3/22; Paynter ex rel. Minor Child(ren) Z.N.B. v. McKesson Corp., et al., W. Va. Cir. Ct., Kanawha Cty., 3/28/22; Blankenship ex rel. Minor Child Z.D.B. v. McKesson Corp., et al., W. Va. Cir. Ct., Kanawha Cty., 1/14/22; Miss. Baptist Med. Ctr. Inc., et al. v. Amneal Pharm., LLC, et al., Miss. 1st Jud. Dist., Hinds Cty. Cir. Ct., 5/15/20; Dallas Cty. Hosp. Dist. d/b/a Parkland Health & Hosp. Sys., et al., v. Amneal Pharm., LLC, et al., Tex. Dist. Ct., 152nd Jud. Dist., Harris Cty., 11/20/19; Fla. Health Scis. Ctr., Inc., et al. v. Sackler, et al., Fla. Cir. Ct., 17th Jud. Cir., Broward Cty., 9/16/19."
