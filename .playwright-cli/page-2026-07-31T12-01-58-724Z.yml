                  - generic [ref=f21e1303]: Changing our operations in accordance with new or changed restrictions on international trade or newly imposed sanctions can be expensive, time-consuming and disruptive to our operations. Such restrictions can be announced with little or no advance notice and we may not be able to effectively mitigate all adverse impacts from such measures. In addition, tensions between nation-state governments and conflicts of laws may lead to challenges for our operations. If disputes and conflicts further escalate in the future, actions by governments in response, or consumer boycotts in certain regions, could be significantly more severe and restrictive and could adversely affect our business or financial performance and our reputation. Political uncertainty surrounding trade and other international disputes could also have a negative effect on consumer confidence and spending, which could also adversely affect our business or financial performance and our reputation. The economies of some of the countries in which we have operations have in the past suffered from high rates of inflation and currency devaluations, which, if they recur, could adversely affect our financial performance. Other factors which may impact our international operations include foreign trade, monetary and fiscal policies of the U.S. and other countries, laws, regulations and other activities of foreign governments, agencies and similar organizations, and risks associated with having numerous facilities located in countries that have historically been less stable than the U.S. Additional risks inherent in our international operations generally include, among others, the costs and difficulties of managing international operations, adverse tax consequences and greater difficulty in enforcing intellectual property rights in countries other than the U.S. The various risks inherent in doing business in the U.S. generally also exist when doing business outside of the U.S., and may be exaggerated by the difficulty of doing business in numerous sovereign jurisdictions due to differences in culture, geopolitical tensions or events, laws and regulations.
