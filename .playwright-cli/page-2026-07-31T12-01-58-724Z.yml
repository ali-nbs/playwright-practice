                        - cell "MANAGEMENT'S DISCUSSION AND ANALYSIS OF FINANCIAL CONDITION AND RESULTS OF OPERATIONS" [ref=f21e2204]
                  - generic [ref=f21e2205]: Overview
                  - generic [ref=f21e2206]: This discussion, which presents our results for the fiscal years ended January 31, 2026 ("fiscal 2026"), January 31, 2025 ("fiscal 2025") and January 31, 2024 ("fiscal 2024"), should be read in conjunction with our Consolidated Financial Statements and the accompanying notes. We intend for this discussion to provide the reader with information that will assist in understanding our financial statements, the changes in certain key items in those financial statements from period to period and the primary factors that accounted for those changes. We also discuss certain performance metrics that management uses to assess the Company's performance. Additionally, the discussion provides information about the financial results of each of the three segments of our business to provide a better understanding of how each of those segments and its results of operations affect the financial condition and results of operations of the Company as a whole.
                  - generic [ref=f21e2207]: Throughout this Item 7, we discuss segment operating income, comparable store and club sales and other measures. Management measures the results of the Company's segments using each segment's operating income, including certain corporate overhead allocations, as well as other measures. From time to time, we revise the measurement of each segment's operating income and other measures as determined by the information regularly reviewed by our chief operating decision maker.
                  - generic [ref=f21e2208]: In discussing our operating results, the term currency exchange rates refers to the currency exchange rates we use to convert the operating results for countries where the functional currency is not the U.S. dollar into U.S. dollars. We calculate the effect of changes in currency exchange rates as the difference between current period activity translated using the current period's currency exchange rates and the comparable prior year period's currency exchange rates. Additionally, no currency exchange rate fluctuations are calculated for non-USD acquisitions until owned for 12 months. Throughout our discussion, we refer to the results of this calculation as the impact of currency exchange rate fluctuations.
                  - generic [ref=f21e2209]: Recent Developments, Macroeconomic Conditions and Potential Impacts
                  - generic [ref=f21e2210]:
                    - text: "We expect continued uncertainty in our business and the global economy due to the following factors: tariffs and trade restrictions; inflationary trends; fluctuations in global currencies; swings in macroeconomic conditions and their effect on consumer confidence; changes in employment trends; volatility in fuel prices; and supply chain pressures, any of which may impact our results. While we operate in a highly dynamic tariff environment, less than one third of what we sell in the U.S. is imported, with most of our imports coming from China, Mexico, Vietnam, India and Canada. Information on certain risks, factors, and uncertainties that can affect our operating results and an investment in our securities can be found herein under \""
                    - link "Item 1A. Risk Factors" [ref=f21e2212] [cursor=pointer]:
                      - /url: "#i6e16e33efce1499a82f13fd9f63b74c6_40"
                    - text: ."
                  - generic [ref=f21e2213]: "Our net sales and gross profit margin are influenced in part by our pricing and merchandising strategies in response to cost increases. Those pricing strategies include, but are not limited to: absorbing cost increases instead of passing those cost increases on to our customers and members; reducing prices in certain merchandise categories; focusing on opening price points for certain food categories; and when necessary, passing cost increases on to our customers and members. Merchandising strategies include, but are not limited to: working with our suppliers to reduce product costs and share in absorbing cost increases; focusing on private label brands and smaller pack sizes; earlier-than-usual purchasing and in greater volumes or moderating purchasing in certain categories; and securing ocean carrier and container capacity. These strategies have and may continue to impact gross profit as a percentage of net sales."
                  - generic [ref=f21e2214]: In July 2025, the One Big Beautiful Bill Act (the "OBBB Act") was enacted, introducing a series of corporate tax changes in the U.S., including 100% bonus depreciation on qualified property and full expensing for research and development expenditures. The impacts of the OBBB Act were not material to our income tax expense or effective tax rate. Certain provisions decreased cash taxes paid in fiscal 2026 and may change the timing of cash tax payments in future periods.
                  - generic [ref=f21e2215]:
                    - text: For a detailed discussion on results of operations by reportable segment, refer to "
                    - link "Results of Operations" [ref=f21e2217] [cursor=pointer]:
                      - /url: "#i6e16e33efce1499a82f13fd9f63b74c6_91"
                    - text: "\" below."
                  - generic [ref=f21e2218]: Company Performance Metrics
                  - generic [ref=f21e2219]: "We are committed to helping customers save money and live better through everyday low prices, supported by everyday low costs. At times, we adjust our business strategies to maintain and strengthen our competitive positions in the countries in which we operate. We define our financial priorities as follows:"
                  - generic [ref=f21e2220]: •Growth - serve customers through a seamless omnichannel experience;
                  - generic [ref=f21e2221]: •Margin - improve our operating income margin through productivity initiatives as well as category and business mix; and
                  - generic [ref=f21e2222]: •Returns - improve our Return on Investment through margin improvement and disciplined capital spend.
                  - generic [ref=f21e2223]: "33"
                  - separator [ref=f21e2226]
                  - generic [ref=f21e2229]: Growth
                  - generic [ref=f21e2230]: Our objective of prioritizing growth means we will focus on serving customers and members however they want to shop through our omnichannel business model. This includes increasing comparable store and club sales through increasing membership at Sam's Club U.S. and through Walmart+, accelerating eCommerce sales growth and expansion of omnichannel initiatives that complement our strategy.
                  - generic [ref=f21e2231]: Comparable sales is a metric that indicates the performance of our existing stores and clubs by measuring the change in sales for such stores and clubs, including eCommerce sales, for a particular period over the corresponding period in the previous year. Walmart's definition of comparable sales includes sales from stores and clubs open for the previous 12 months, including remodels, relocations, expansions and conversions, as well as eCommerce sales. We measure the eCommerce sales impact by including all sales initiated digitally, including omnichannel transactions which are fulfilled through our stores and clubs as well as certain other business offerings that are part of our ecosystem, such as our advertising net sales. Comparable sales are also referred to as "same-store" sales by others within the retail industry. The method of calculating comparable sales varies across the retail industry. As a result, our calculation of comparable sales is not necessarily comparable to similarly titled measures reported by other companies.
                  - generic [ref=f21e2232]: Our discussion of our comparable sales below refers to our calendar comparable sales calculated using our fiscal calendar, which may result in differences when compared to comparable sales using the retail calendar (also known as the 4-5-4 calendar) as provided in our quarterly earnings releases. We report on comparable sales in the U.S. as we believe it is a meaningful metric within the context of the U.S. retail market where there is a single currency, one inflationary market and generally consistent store and club formats from year to year.
