                  - generic [ref=f21e2306]: Walmart U.S. comparable sales increased 4.3% and 4.8% in fiscal 2026 and 2025, respectively. Comparable sales in fiscal 2026 were driven by growth in average ticket and transactions, and also reflected growth in unit volumes and strength in all merchandise categories. Comparable sales in fiscal 2025 were driven by growth in transactions and unit volumes, with strong sales in grocery and health and wellness. Walmart U.S. eCommerce sales positively contributed approximately 4.3% and 2.9% to comparable sales for fiscal 2026 and 2025, respectively. This growth reflects continued strength in customer and Walmart+ member engagement with omnichannel offerings, and was primarily driven by store-fulfilled pickup and delivery.
                  - generic [ref=f21e2307]: Sam's Club U.S. comparable sales increased 2.9% and 4.7% in fiscal 2026 and 2025, respectively. For fiscal 2026, comparable sales were driven by growth in unit volumes and transactions, reflecting strong sales in grocery, health and wellness and general merchandise. For fiscal 2025, comparable sales were driven by growth in transactions and unit volumes, with strong sales in grocery and health and wellness. Additionally, fiscal 2026 and 2025 growth was partially offset by lower fuel sales, negatively impacting comparable sales by 1.9% and 1.5%, respectively, primarily due to lower fuel prices. Sam's Club U.S. eCommerce sales positively contributed approximately 3.3% and 2.3% to comparable sales for fiscal 2026 and 2025, respectively, which reflects continued strength in member engagement with omnichannel offerings.
                  - generic [ref=f21e2308]: "34"
