                  - generic [ref=f21e2399]: (1)Gross profit defined as net sales less cost of sales.
                  - generic [ref=f21e2400]: Gross profit as a percentage of net sales ("gross profit rate") increased 8 and 40 basis points for fiscal 2026 and 2025, respectively, when compared to the previous fiscal year. The increase in fiscal 2026 was primarily driven by the Walmart U.S. segment, due to disciplined inventory management, as well as growth in higher margin businesses globally. The increase in fiscal 2025 was primarily driven by the Walmart U.S. segment, due to managing prices aligned to our competitive historic price gaps, as well as growth in higher margin businesses globally. In both years, the increases were partially offset by mix shifts into lower margin merchandise categories across segments, as well as ongoing channel and format mix shifts in the Walmart International segment.
                  - generic [ref=f21e2401]: Operating expenses as a percentage of net sales increased 20 and 36 basis points for fiscal 2026 and 2025, respectively, when compared to the previous fiscal year. The increase for fiscal 2026 was primarily due to higher self-insured general liability claims expense in the U.S. of approximately $0.9 billion, influenced by rising costs to resolve claims across retail and related industries, a charge of $0.7 billion related to modification of certain share-based compensation arrangements for our PhonePe subsidiary and increased depreciation related to our capital investments. The increase for fiscal 2025 was primarily due to higher variable pay as a result of exceeding planned performance, increased marketing and higher depreciation expenses.
                  - generic [ref=f21e2402]: Operating income as a percentage of net sales decreased 13 basis points for fiscal 2026 and increased 15 basis points for fiscal 2025, respectively, primarily due to the factors described above and strong growth in membership income globally.
                  - generic [ref=f21e2403]: Returns
                  - generic [ref=f21e2404]:
                    - text: As we execute our financial framework, we believe our return on capital will improve over time. We measure return on capital with our return on investment and free cash flow metrics. In addition, we provide returns in the form of share repurchases and dividends, which are discussed in the
                    - link "Liquidity and Capital Resources" [ref=f21e2406] [cursor=pointer]:
                      - /url: "#i6e16e33efce1499a82f13fd9f63b74c6_103"
                    - text: section.
                  - generic [ref=f21e2407]: Return on Assets and Return on Investment
                  - generic [ref=f21e2408]: We include Return on Assets ("ROA") and Return on Investment ("ROI") as metrics to assess our return on capital. ROA is the most directly comparable measure based on our financial statements presented in accordance with generally accepted accounting principles in the U.S. ("GAAP") while ROI is considered a non-GAAP financial measure. Management believes ROI is a meaningful metric to share with investors because it helps investors assess how effectively Walmart is deploying its assets. Trends in ROI can fluctuate over time as management balances long-term strategic initiatives with possible short-term impacts.
                  - generic [ref=f21e2409]: Our calculation of ROI is considered a non-GAAP financial measure because it uses financial measures that differ from those used in ROA, the most directly comparable GAAP financial measure. ROA is consolidated net income for the period divided by average total assets for the period. We define ROI as operating income plus interest income, depreciation and amortization, and rent expense for the trailing 12 months divided by average invested capital during the period. We consider average invested capital to be the average of our beginning and ending total assets, plus average accumulated depreciation and amortization, less average accounts payable and average accrued liabilities for that period. Although ROI is a standard financial measure, numerous methods exist for calculating a company's ROI. As a result, the method used by management to calculate our ROI may differ from the methods used by other companies to calculate their ROI.
