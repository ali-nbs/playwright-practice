                    - text: "II. ENVIRONMENTAL MATTERS:"
                    - generic [ref=f21e1893]: Item 103 of SEC Regulation S-K requires disclosure of certain environmental matters when a governmental authority is a party to the proceedings and such proceedings involve potential monetary sanctions that the Company reasonably believes will exceed $1 million.
                  - generic [ref=f21e1894]: In October 2023, the Company received a Finding of Violation from the U.S. Environmental Protection Agency (the "EPA") alleging violations of the Clean Air Act in connection with the Company's refrigeration leak detection and repair program at certain of its facilities. The Company is cooperating with the EPA in its investigation. The EPA may seek to impose monetary and non-monetary penalties for the alleged violations of the Clean Air Act. The Company is unable to predict the final outcome of this matter, but the EPA could seek penalties in excess of $1 million. Although the Company does not believe this matter will have a material adverse effect on its business, financial position, results of operations, or cash flows, the Company can provide no assurance that its business, financial position, results of operations or cash flows will not be materially adversely affected.
