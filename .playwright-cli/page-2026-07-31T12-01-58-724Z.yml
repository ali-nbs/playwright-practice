                  - generic [ref=f21e748]: "Such forward-looking statements are not statements of historical facts, but instead express our estimates or expectations for our consolidated, or one of our segment's, economic performance or results of operations for future periods or as of future dates or events or developments that may occur in the future or discuss our plans, objectives or goals. These forward-looking statements may relate to:"
