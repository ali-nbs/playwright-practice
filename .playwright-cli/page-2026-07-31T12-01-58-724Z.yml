                  - generic [ref=f21e1368]: Not satisfying stakeholder expectations with respect to our social and environmental efforts could adversely affect our reputation or subject us to regulatory or litigation risk.
                  - generic [ref=f21e1369]: We strive to deliver shared value through our business, although stakeholder expectations continue to evolve and are not uniform, and our diverse stakeholders expect us to make significant progress in certain areas. We have established, and may continue to establish, various goals and initiatives on certain matters, including with respect to climate change, waste, packaging, plastic usage and other topics. We periodically publish information about our shared value priorities, strategies, progress and challenges through our online social and environmental reporting, which is not incorporated by reference into and does not form any part of this Annual Report on Form 10-K. Achievement of these aspirations and goals is subject to risks and uncertainties, many of which are outside of our control, and we cannot guarantee that we will achieve our goals or that our initiatives will achieve their desired results. Consequently, it is possible that we may fail, or be perceived to have failed, in the achievement of our social and environmental goals and certain customers, associates, shareholders, investors, suppliers, business partners, government agencies and non-governmental organizations might not be satisfied with our progress. Furthermore, federal, state and local regulatory authorities, private organizations and individuals may challenge our approach to social and environmental issues, including allegations that we failed in our efforts, should not have undertaken such efforts or that we improperly engaged with other entities in our approach to social and environmental issues. These challenges could involve administrative proceedings or litigation, including as class or mass actions. A failure or perceived failure to meet our goals or to otherwise meet evolving and diverse stakeholder expectations could adversely affect public perception of our business, associate morale or customer or shareholder support.
