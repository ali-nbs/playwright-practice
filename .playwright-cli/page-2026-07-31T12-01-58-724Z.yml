                  - generic [ref=f21e1359]: Our amended and restated bylaws designate the Court of Chancery of the State of Delaware as the sole and exclusive forum for certain types of actions and proceedings that may be initiated by our shareholders, which could increase the costs for our shareholders to bring claims, discourage our shareholders from bringing claims, or limit our shareholders' ability to obtain a favorable judicial forum for disputes with us or our directors, officers, associates or shareholders in such capacity.
                  - generic [ref=f21e1360]: Our amended and restated bylaws designate the Delaware Court of Chancery as the exclusive forum for certain shareholder claims, including derivative claims alleging a violation of duty by a current or former director, officer, associate or shareholder, unless we agree otherwise in writing. This exclusive forum provision may increase the cost for shareholders to bring claims or limit their ability to choose a favorable forum, potentially discouraging lawsuits. Alternatively, if a court finds this provision unenforceable, we may face higher costs resolving such matters in other jurisdictions, which could negatively impact our business and financial results. However, this provision does not affect the exclusive or concurrent jurisdiction of federal courts over actions brought under the federal securities laws, including the Exchange Act, as amended, the Securities Act of 1933, as amended, and the rules and regulations promulgated thereunder.
