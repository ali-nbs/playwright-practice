                  - generic [ref=f21e3603]: Net sales for the Walmart International segment increased $8.5 billion or 7.0% and $7.2 billion or 6.3% for fiscal 2026 and 2025, respectively, when compared to the previous fiscal year. Net sales growth was primarily due to positive comparable sales growth across our international markets, which includes strong eCommerce growth of $6.3 billion and $4.7 billion for fiscal 2026 and 2025, respectively. The increases were partially offset by negative fluctuations in currency exchange rates of $2.8 billion and $3.2 billion for fiscal 2026 and 2025, respectively.
                  - generic [ref=f21e3604]: Gross profit rate decreased 49 basis points for fiscal 2026 and increased 20 basis points for fiscal 2025, when compared to the previous fiscal year. For fiscal 2026, the decrease was primarily due to ongoing channel and format mix shifts, as well as strategic growth investments in price and delivery capabilities, partially offset by growth in higher margin businesses. The increase in fiscal 2025 was primarily due to improved eCommerce margin and business mix changes, partially offset by ongoing channel and format mix changes.
                  - generic [ref=f21e3605]:
                    - text: Operating expenses as a percentage of segment net sales increased 10 basis points for fiscal 2026 and decreased 5 basis points for fiscal 2025, when compared to the previous fiscal year. The increase for fiscal 2026 was primarily due to a charge of $0.7 billion related to PhonePe's modification of certain share-based payment arrangements in contemplation of a potential public offering (refer to
                    - link "Note 3" [ref=f21e3607] [cursor=pointer]:
                      - /url: "#i6e16e33efce1499a82f13fd9f63b74c6_151"
                    - text: ), partially offset by strong sales as well as format mix shifts. The decrease for fiscal 2025 was primarily due to increased sales driving expense leverage, partially offset by planned investments in associate wages and strategic priorities in Mexico and Central America.
                  - generic [ref=f21e3608]: As a result of the factors discussed above, segment operating income decreased $0.4 billion and increased $0.6 billion for fiscal 2026 and 2025, respectively, when compared to the previous fiscal year.
