                  - generic [ref=f21e3200]:
                    - text: Our effective income tax rate was 24.4%, 23.4%, and 25.5% for fiscal 2026, 2025 and 2024, respectively. The increase in effective income tax rate in fiscal 2026 compared to fiscal 2025 is primarily due to the share-based compensation charge recorded at the Company's PhonePe subsidiary, which provided no tax benefit. The decrease in effective tax rate in fiscal 2025 compared to fiscal 2024 is primarily due to the tax impact on changes in fair value of our investments. Our effective income tax rate may also fluctuate as a result of various factors, including changes in our assessment of unrecognized tax benefits, valuation allowances, business operations, acquisitions, investments, entry into new businesses and geographies, intercompany transactions, changes in tax law, changes in the administrative practices, principles, and interpretations related to tax, and the mix and size of earnings among our U.S. operations and international operations, which are subject to statutory rates that are generally higher than the U.S. statutory rate. The reconciliation from the U.S. statutory rate to the effective income tax rates for fiscal 2026, 2025 and 2024 is provided in
                    - link "Note 8" [ref=f21e3202] [cursor=pointer]:
                      - /url: "#i6e16e33efce1499a82f13fd9f63b74c6_172"
                    - text: .
                  - generic [ref=f21e3203]: As a result of the factors discussed above, we reported $22.3 billion and $20.2 billion of consolidated net income for fiscal 2026 and 2025, respectively, which represent increases of $2.1 billion and $3.9 billion for fiscal 2026 and 2025, respectively, when compared to the previous fiscal year. Diluted net income per common share attributable to Walmart ("EPS") was $2.73, $2.41 and $1.91 for fiscal 2026, 2025 and 2024, respectively.
