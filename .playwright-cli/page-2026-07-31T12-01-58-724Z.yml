                  - generic [ref=f21e1317]: In addition, legislatures and taxing authorities in many jurisdictions in which we operate may enact changes to, or seek to enforce novel interpretations of, existing tax laws, including both temporary and permanent measures. For example, the Organization for Economic Cooperation and Development (the "OECD") and other countries (including countries in which we operate) have committed to enacting substantial changes to numerous long-standing tax principles impacting taxation of large multinational enterprises. In particular, the OECD's Global Minimum Tax (Pillar Two) has become effective in many jurisdictions where we operate and continues to evolve through ongoing legislative and administrative guidance. These rules are complex, and may require significant data, systems and process changes to comply. The impact of these developments, as well as other changes in domestic and international tax laws and regulations could have a material effect on our cash taxes, affect our effective tax rate and increase our compliance, audit and controversy costs, any of which could materially adversely affect our financial performance.
