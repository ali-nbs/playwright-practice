                  - generic [ref=f21e1854]:
                    - text: We own office facilities in Bentonville, Arkansas, that serve as our principal office and own and lease office facilities throughout the U.S. and internationally for operations as well as for field and market management. The land on which our stores are located is either owned or leased by the Company. Owned retail units on leased land are reflected as leased locations in the table above. We use independent contractors to construct our buildings. All store leases provide for annual rentals, some of which escalate during the original lease or provide for additional rent based on sales volume. Substantially all of the Company's store and club leases have renewal options, some of which include rent escalation clauses. For further information on our distribution network, see the caption "Distribution" under "
                    - link "Item 1. Business" [ref=f21e1856] [cursor=pointer]:
