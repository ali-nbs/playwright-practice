                  - generic [ref=f11e10868]: RV and marina base rental income in our Core Portfolio for the six months ended June 30, 2026 increased $0.2 million, or 0.1%, from the same period in 2025 due to an increase in Annual RV and marina base rental income of 4.8%, partially offset by decreases in Seasonal and Transient RV and marina base rental income of 14.1% and 8.1%, respectively. The increase in Core Annual RV and marina base rental income was driven by an increase in rate of 5.2%. The decreases in Seasonal and Transient RV and marina base rental income were primarily due to lower occupancy in the South and Central regions.
                  - generic [ref=f11e10869]: Utility and other income in our Core Portfolio for the six months ended June 30, 2026 increased $3.9 million, or 6.0%, from the same period in 2025. The increase was primarily due to an increase in utility income and pass-through income of $3.2 million and $0.7 million, respectively. The increase in utility income was driven by higher expenses driving additional recovery primarily in water, sewer and trash, and the increase in pass-through income was primarily driven by increases in real estate tax pass-throughs to customers in Florida. The utility recovery rate (utility income divided by utility expenses) for the six months ended June 30, 2026 and 2025 was approximately 50.4% and 48.2%, respectively.
                  - generic [ref=f11e10870]: Property Operating Expenses
                  - generic [ref=f11e10871]: Property operating expenses, excluding property management, in our Core Portfolio for the six months ended June 30, 2026 increased $6.8 million, or 2.3%, from the same period in 2025 driven by increases in Utility expense of $2.9 million, Repairs and maintenance of $2.8 million and Real estate taxes of $0.4 million, partially offset by a decrease in Insurance and other expenses of $0.7 million. The increase in Utility expense was due to increases in sewer, water and trash expenses, partially offset by decreases in gas and cable expenses. The increase in Repair and maintenance expense was driven by increases in extraordinary repairs and maintenance as a result of adverse weather events, lawn and common area maintenance, contract repairs, pool and maintenance and housekeeping supplies expenses, partially offset by a decrease in security guard expenses. The increase in Real estate taxes was primarily due to an increase in our Florida, Kentucky, Ohio and Wisconsin portfolios, partially offset by lower real estate tax assessments in our Texas portfolio. The decrease in Insurance and other expenses was due to a decrease in insurance expense as a result of our property and casualty renewal on April 1, 2026, partially offset by an increase in administrative and rental home expenses.
