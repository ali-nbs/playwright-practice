                  - generic [ref=f11e11554]: Liquidity and Capital Resources
                  - generic [ref=f11e11555]: Liquidity
                  - generic [ref=f11e11556]: Our primary demands for liquidity include payment of operating expenses, dividend distributions, debt service, including principal and interest, capital improvements on Properties, home purchases and property acquisitions. We expect similar demand for liquidity will continue for the short-term and long-term. Our primary sources of cash include operating cash flows, proceeds from financings, borrowings under our unsecured Line of Credit (“LOC”) and proceeds from issuance of equity and debt securities, including issuances under our at-the-market (“ATM”) equity offering program.
                  - generic [ref=f11e11557]: One of our stated objectives is to maintain financial flexibility. Achieving this objective allows us to take advantage of strategic opportunities that may arise. When investing capital, we consider all potential uses, including returning capital to our stockholders or the conditions under which we may repurchase our stock. These conditions include, but are not limited to, market price, balance sheet flexibility, alternative opportunistic capital uses and capital requirements. We believe effective management of our balance sheet, including maintaining various access points to raise capital, managing future debt maturities and borrowing at competitive rates, enables us to meet this objective. Accessing long-term, low-cost secured debt continues to be our focus.
                  - generic [ref=f11e11558]: As of June 30, 2026 and December 31, 2025, secured debt encumbered a total of 112 of our Properties, and the gross carrying value of such Properties was approximately $3,304.6 million and $3,266.6 million, respectively.
                  - generic [ref=f11e11559]: On November 1, 2024, we entered into our current ATM equity offering program with certain sales agents, pursuant to which we may sell, from time-to-time, shares of our common stock, par value $0.01 per share, having an aggregate offering price of up to $700.0 million. As of June 30, 2026, the full capacity of our current ATM equity offering program remained available for issuance.
                  - generic [ref=f11e11560]: As of June 30, 2026, we had available liquidity in the form of approximately 406.0 million shares of authorized and unissued common stock, par value $0.01 per share, and 10.0 million shares of authorized and unissued preferred stock registered for sale under the Securities Act of 1933, as amended.
                  - generic [ref=f11e11562]: We also utilize interest rate swaps to add stability to our interest expense and to manage our exposure to interest rate movements. Interest rate swaps designated as cash flow hedges involve the receipt of variable amounts from a counterparty in exchange for making fixed-rate payments over the life of the agreements without exchange of the underlying notional amount. The changes in the fair value of the designated derivative are recorded in Accumulated other comprehensive income/(loss) on the Consolidated Balance Sheets and subsequently reclassified into earnings in the Consolidated Statements of Income and Comprehensive Income in the period that the hedged forecasted transaction affects earnings. For additional information regarding our interest rate swaps, see Part I. Item 1. Financial Statements-Note 8. Derivative Instruments and Hedging Activities.
                  - generic [ref=f11e11563]: We expect to meet our short-term liquidity requirements, including principal payments, capital improvements and dividend distributions for the next twelve months, generally through available cash, net cash provided by operating activities, issuances of equity under our ATM equity offering program and our LOC. As of June 30, 2026, our LOC had a remaining borrowing capacity of $372.4 million with the option to increase the borrowing capacity by $200.0 million, subject to certain conditions. The LOC bears interest at a rate of SOFR plus 0.10% plus 1.25% to 1.65% and requires an annual facility fee of 0.20% to 0.35%.
                  - generic [ref=f11e11564]: We expect to meet certain long-term liquidity requirements, such as scheduled debt maturities, property acquisitions and capital improvements, using long-term collateralized and uncollateralized borrowings, including the existing LOC and the issuance of debt securities or the issuance of equity including under our ATM equity offering program.
