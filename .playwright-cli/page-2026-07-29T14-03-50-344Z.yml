                  - generic [ref=f11e11536]: Casualty-related charges/(recoveries), net
                  - generic [ref=f11e11537]: During the six months ended June 30, 2025, we recognized expenses of approximately $1.1 million related to debris removal and cleanup costs from hurricane events, with an insurance recovery revenue accrual of $0.8 million related to the expenses incurred during the same periods. During the six months ended June 30, 2026 and 2025, we also recognized insurance recovery revenue in excess of expenses for Hurricane Ian of $7.1 million and $0.6 million, respectively, within Casualty-related charges/(recoveries), net. The debris and cleanup costs and offsetting recovery accrual and reimbursement of capital expenditures are presented in Casualty-related charges/(recoveries), net in the Consolidated Statements of Income and Comprehensive Income.
