                  - generic [ref=f11e7681]: For the quarter ended June 30, 2026, property operating revenues in our Core Portfolio increased 4.9% and property operating expenses in our Core Portfolio, excluding property management, increased 2.9% from the same period in 2025, resulting in increased Income from property operations, excluding property management, of 6.5%.
                  - generic [ref=f11e7683]: "22"
                  - separator [ref=f11e7686]
                  - generic [ref=f11e7687]: Management’s Discussion and Analysis (continued)
                  - generic [ref=f11e7689]: While we continue to focus on increasing the number of manufactured homeowners in our Core Portfolio, we also believe that renting our vacant homes represents an attractive source of occupancy and an opportunity to potentially convert the renter to a new homebuyer in the future. We continue to expect there to be fluctuations in the sources of occupancy gains depending on local market conditions, availability of vacant sites and success with converting renters to homeowners. Our Core Portfolio average occupancy includes both homeowners and renters in our MH communities and was 93.8% for the quarter ended June 30, 2026, 94.3% for the quarter ended June 30, 2025 and 94.0% for the quarter ended December 31, 2025. The decline in average occupancy compared to the quarter ended June 30, 2025 was primarily driven by 503 expansion sites that were added since June 30, 2025. During the quarter ended June 30, 2026, our Core Portfolio occupancy increased by 13 sites, which included increases in rental occupancy of 11 sites and homeowner occupancy of 2 sites compared to March 31, 2026. As of June 30, 2026, we had 2,146 occupied rental homes in our Core MH communities.
                  - generic [ref=f11e7690]: RV and marina base rental income in our Core Portfolio increased 1.8% for the quarter ended June 30, 2026, compared to the same period in 2025, due to an increase in Core Annual RV and marina base rental income of 5.4%, offset by decreases in Core Seasonal and Transient RV and marina base rental income of 11.2% and 8.9%, respectively. The increase in Core Annual RV and marina base rental income was driven by a 5.3% increase in rate and a 0.1% gain in occupancy since the quarter ended June 30, 2025. The decreases in Core Seasonal and Transient RV and marina base rental income were primarily due to lower occupancy.
                  - generic [ref=f11e7691]: We closed 98 new home sales during the quarter ended June 30, 2026 compared to 117 new home sales during the quarter ended June 30, 2025.
                  - generic [ref=f11e7692]: Our gross investment in real estate increased $234.3 million to $8,413.0 million as of June 30, 2026 from $8,178.7 million as of December 31, 2025, primarily due to the consolidation of our investments in certain RVC joint ventures of $103.3 million and capital improvements during the six months ended June 30, 2026.
