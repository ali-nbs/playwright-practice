                  - generic [ref=f11e5793]: Note 11 - Commitments and Contingencies
                  - generic [ref=f11e5795]:
                    - generic [ref=f11e5796]: We are involved in various legal and regulatory proceedings (“Proceedings”) arising in the ordinary course of business. The Proceedings include, but are not limited to, legal claims made by employees, vendors and customers, and notices, consent decrees, information requests, additional permit requirements and other similar enforcement actions by governmental agencies relating to our utility infrastructure, including water and wastewater treatment plants and other waste treatment facilities and electrical systems. Additionally, in the ordinary course of business, our operations are subject to audit by various taxing authorities. Management believes these Proceedings taken together do not represent a material liability. In addition, to the extent any such Proceedings or audits relate to newly acquired Properties, we consider any potential indemnification obligations of sellers in our favor.
                    - generic [ref=f11e5797]: Beginning on August 31, 2023 through December 4, 2023, certain private party plaintiffs filed several putative class actions in the U.S. District Court for the Northern District of Illinois, Eastern Division, against Datacomp Appraisal Systems, Inc. (“Datacomp”) and several owner/operators of manufactured housing communities, including ELS (the “Datacomp Litigation”), alleging that the community owner/operators used JLT Market Reports produced by Datacomp to conspire to raise manufactured home lot rents in violation of Section 1 of the Sherman Act. ELS purchased Datacomp in connection with the MHVillage/Datacomp acquisition during the year ended December 31, 2021. On December 15, 2023, the plaintiffs filed an amended consolidated complaint captioned, In re Manufactured Home Lot Rents Antitrust Litigation, No. 1:23-cv-6715. Plaintiffs seek both injunctive relief and monetary damages, including attorneys’ fees. The defendants filed a motion to dismiss on January 29, 2024. On December 4, 2025, the Court granted defendants’ motion to dismiss without prejudice. On January 26, 2026, plaintiffs filed an amended complaint, and defendants filed a motion to dismiss on March 31, 2026.
                    - generic [ref=f11e5798]: We believe that the Datacomp Litigation is without merit, and we intend to vigorously defend our interests in this matter. As of June 30, 2026, we have not made an accrual, as we are unable to predict the outcome of this matter or reasonably estimate any possible loss.
                  - generic [ref=f11e5800]: Note 12 - Reportable Segments
                  - generic [ref=f11e5802]: "We have identified two reportable segments: (i) Property Operations and (ii) Home Sales and Rentals Operations. The Property Operations segment owns and operates land lease Properties and the Home Sales and Rentals Operations segment purchases, sells and leases homes at the Properties. Each segment is primarily evaluated based on Net Operating Income (“NOI”), which is defined as total operating revenues less total operating expenses. Segments are assessed before interest income and depreciation and amortization. The distribution of the Properties throughout the United States reflects our belief that geographic diversification helps insulate the total portfolio from regional economic influences."
