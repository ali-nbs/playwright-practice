                  - generic [ref=f11e7870]: Non-GAAP Financial Measures
                  - generic [ref=f11e7872]:
                    - text: Management’s discussion and analysis of financial condition and results of operations include certain Non-GAAP financial measures that in management’s view of the business are meaningful as they allow investors the ability to understand key operating details of our business that may not always be indicative of recurring annual cash flow of the portfolio. These Non-GAAP financial measures as determined and presented by us may not be comparable to similarly titled measures reported by other companies, and include Income from property operations and Core Portfol
                    - generic [ref=f11e7873]: io, FFO and No
                    - text: rmalized FFO.
                  - generic [ref=f11e7875]:
                    - text: We believe investors should review Income from property operations and Core Portfolio, FFO and
                    - generic [ref=f11e7876]: Normalized FFO
                    - text: ", along with GAAP net income and cash flows from operating activities, investing activities and financing activities, when evaluating an equity REIT’s operating performance. A discussion of Income from property operations and Core Portfolio, FF"
                    - generic [ref=f11e7877]: O and Normaliz
                    - text: ed FFO, and a reconciliation to net income are included below.
                  - generic [ref=f11e7878]: "23"
                  - separator [ref=f11e7881]
                  - generic [ref=f11e7882]: Management’s Discussion and Analysis (continued)
                  - generic [ref=f11e7884]: Income from Property Operations and Core Portfolio
                  - generic [ref=f11e7887]:
                    - text: We use Income from property operations, Income from property operations, excluding property management, and
                    - generic [ref=f11e7888]: Core Portfolio income from property operations, excluding property management
                    - text: ", as alternative measures to evaluate the operating results of our Properties. Income from property operations represents rental income, membership subscriptions and upgrade revenue, utility and other income less property and rental home operating and maintenance expenses, real estate taxes, membership sales and marketing expenses and property management expenses. Income from property operations, excluding property management, represents Income from property operations excluding property management expenses. Property management represents the expenses associated with indirect costs such as off-site payroll and certain administrative and professional expenses. We believe exclusion of property management expenses is helpful to investors and analysts as a measure of the operating results of our Properties, excluding items that are not directly related to the operation of the Properties. For comparative purposes, we present bad debt expense within Insurance and other in the current and prior periods. We believe that this Non-GAAP financial measure is helpful to investors and analysts as a measure of the operating results of our Properties."
                  - generic [ref=f11e7890]:
                    - text: Our Core Portfolio consists of our Properties owned and operated during all of 2025 and 2026.
                    - generic [ref=f11e7891]: Core Portfolio income from property operations, excluding property management
                    - text: ", is useful to investors for annual comparison as it removes the fluctuations associated with acquisitions, dispositions and significant transactions or unique situations. Our Non-Core Portfolio includes all Properties that were not owned and operated during all of 2025 and 2026, including six Properties in Florida impacted by Hurricane Ian, two Properties in California that were impacted by storm and flooding events and seven acquired RVC properties."
                  - generic [ref=f11e7893]:
                    - text: FFO and
                    - generic [ref=f11e7894]: Normalized FFO
                  - generic [ref=f11e7895]: We define FFO as net income, computed in accordance with GAAP, excluding gains or losses from sales of properties, depreciation and amortization related to real estate, impairment charges and adjustments to reflect our share of FFO of unconsolidated joint ventures. Adjustments for unconsolidated joint ventures are calculated to reflect FFO on the same basis. We compute FFO in accordance with our interpretation of standards established by the National Association of Real Estate Investment Trusts (“NAREIT”), which may not be comparable to FFO reported by other REITs that do not define the term in accordance with the current NAREIT definition or that interpret the current NAREIT definition differently than we do.
                  - generic [ref=f11e7897]: We believe FFO, as defined by the Board of Governors of NAREIT, is generally a measure of performance for an equity REIT. While FFO is a relevant and widely used measure of operating performance for equity REITs, it does not represent cash flow from operations or net income as defined by GAAP, and it should not be considered as an alternative to these indicators in evaluating liquidity or operating performance.
                  - generic [ref=f11e7900]:
                    - text: We define
                    - generic [ref=f11e7901]: Normalized FFO
                    - text: as FFO excluding non-operating income and expense items, such as gains and losses from early debt extinguishment, including prepayment penalties, defeasance costs, transaction/pursuit costs and other, and other miscellaneous non-comparable items.
                    - generic [ref=f11e7902]: Normalized FFO
                    - text: presented herein is not necessarily comparable to
                    - generic [ref=f11e7903]: Normalized FFO
                    - text: presented by other real estate companies due to the fact that not all real estate companies use the same methodology for computing this amount.
                  - generic [ref=f11e7905]:
                    - text: We believe that FFO and
                    - generic [ref=f11e7906]: Normalized FFO
                    - text: are helpful to investors as supplemental measures of the performance of an equity REIT. We believe that by excluding the effect of gains or losses from sales of properties, depreciation and amortization related to real estate and impairment charges, which are based on historical costs and may be of limited relevance in evaluating current performance, FFO can facilitate comparisons of operating performance between periods and among other equity REITs. We further believe that
                    - generic [ref=f11e7907]: Normalized FFO
                    - text: provides useful information to investors, analysts and our management because it allows them to compare our operating performance to the operating performance of other real estate companies and between periods on a consistent basis without having to account for differences not related to our normal operations. For example, we believe that excluding the early extinguishment of debt and other miscellaneous non-comparable items from FFO allows investors, analysts and our management to assess the sustainability of operating performance in future periods because these costs do not affect the future operations of the properties. In some cases, we provide information about identified non-cash components of FFO and
                    - generic [ref=f11e7908]: Normalized FFO
                    - text: because it allows investors, analysts and our management to assess the impact of those items.
                  - generic [ref=f11e7909]: Our definitions and calculations of these Non-GAAP financial and operating measures and other terms may differ from the definitions and methodologies used by other REITs and, accordingly, may not be comparable. These Non-GAAP financial and operating measures do not represent cash generated from operating activities in accordance with GAAP, nor do they represent cash available to pay distributions and should not be considered as an alternative to net income, determined in accordance with GAAP, as an indication of our financial performance, or to cash flows from operating activities, determined in accordance with GAAP, as a measure of our liquidity, nor is it indicative of funds available to fund our cash needs, including our ability to make cash distributions.
