                  - generic [ref=f11e10042]: During the quarter ended June 30, 2025, we recognized expenses of approximately $0.3 million related to debris removal and cleanup costs from hurricane events, with insurance recovery revenue accrual of approximately $0.2 million related to the expenses incurred during the same period. During the quarters ended June 30, 2026 and 2025, we also recognized excess insurance recovery revenue of approximately $7.1 million and $0.6 million, respectively, for reimbursement of capital expenditures related to Hurricane Ian. The debris and cleanup costs and offsetting recovery accrual and reimbursement of capital expenditures are presented in Casualty-related charges/(recoveries), net in the Consolidated Statements of Income and Comprehensive Income.
