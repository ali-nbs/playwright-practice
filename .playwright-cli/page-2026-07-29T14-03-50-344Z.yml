                  - generic [ref=f11e10637]: "(1)Rental income consists of the following total portfolio income items in this table: 1) MH base rental income, 2) Rental home income, 3) RV and marina base rental income and 4) Utility income, which is calculated by subtracting Other income in the Consolidated Statements of Income and Comprehensive Income from Utility and other income in this table. The difference between the sum of the total portfolio income items and Rental income in the Consolidated Statements of Income and Comprehensive Income is bad debt expense, which is presented in Insurance and other in this table."
                  - generic [ref=f11e10638]: (2)Membership upgrade product offerings consist of two- to four-year term subscription products, which are recognized in Annual membership subscriptions. Prices for two-year products range between $4,000 to $8,000 and between approximately $7,000 to $14,000 for the four-year product, which results in approximately $2,500 to $3,000 of earned revenue on an annual basis.
                  - generic [ref=f11e10639]: (3)Membership upgrade revenue is net of deferrals of $0.2 million for the six months ended June 30, 2025.
                  - generic [ref=f11e10640]: (4)Includes bad debt expense for all periods presented.
