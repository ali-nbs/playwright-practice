                  - generic [ref=f11e11811]: Financing Activities
                  - generic [ref=f11e11812]: Net cash used in financing activities increased $64.3 million to $223.7 million for the six months ended June 30, 2026 from $159.4 million for the six months ended June 30, 2025. The increase was primarily due to an increase in distributions to common stockholders and OP unit holders of $13.1 million and decrease in term loan proceeds of $150.0 million, partially offset by a decrease in cash outflows related to principal payments and mortgage debt repayment of $86.3 million, an increase in net line of credit borrowings of $9.5 million and a decrease in cash outflows related to debt issuance and defeasance costs of $2.5 million.
