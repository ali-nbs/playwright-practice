                  - generic [ref=f11e7465]: In our Home Sales and Rentals Operations business, our revenue streams include home sales, home rentals and brokerage services and ancillary activities. We generate revenue through home sales and rental operations by selling or leasing manufactured homes and cottages that are located in Properties owned and managed by us. We believe renting our vacant homes represents an attractive source of occupancy and an opportunity to convert the renter to a homebuyer in the future. Additionally, home sale brokerage services are offered to our residents who may choose to sell their homes rather than relocate them when moving from a Property. At certain Properties, we operate ancillary facilities, such as golf courses, pro shops, stores and restaurants.
                  - generic [ref=f11e7466]: In the manufactured housing industry, options for home financing, also known as chattel financing, are limited. Chattel financing options available today include community owner-funded programs or third-party lender programs that provide subsidized financing to customers and often require the community owner to guarantee customer defaults. Third-party lender programs have stringent underwriting criteria, sizable down payment requirements, short term loan amortization and high interest rates.
                  - generic [ref=f11e7468]:
