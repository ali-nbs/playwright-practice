                  - generic [ref=f11e11907]: Change in Control Severance Plan
                  - generic [ref=f11e11908]: On July 28, 2026, the Board of Directors adopted the Equity LifeStyle Properties, Inc. Change in Control Severance Plan (the “Change in Control Severance Plan”). The Change in Control Severance Plan provides for the payment of severance payments and benefits to participants in the event of a qualifying termination of employment with the Company upon or following a change in control transaction. The Company’s Chief Executive Officer, President, and executive vice presidents are eligible to participate in the Change in Control Severance Plan.
                  - generic [ref=f11e11909]: "Under the Change in Control Severance Plan, if a participant’s employment is terminated by the Company without “cause” or by the participant for “good reason” during the period beginning on the date of a “change in control” transaction and ending on the second anniversary thereof, the participant will be eligible to receive: (i) a lump-sum cash payment equal to (a) with respect to the Chief Executive Officer, 3 times base salary and target annual bonus, and (b) with respect to the other participants, 2 times base salary and target annual bonus; (ii) a lump-sum cash payment equal to a prorated portion of the participant’s target annual bonus for the year of termination; (iii) accelerated vesting of outstanding equity awards; and (iv) continued participation in the health, dental and vision benefit plans at the same cost to the participant as before the termination (or payment of plan premiums in lieu of such continued subsidized coverage) for 24 months (or until the participant becomes eligible for no-less favorable coverage from another employer)."
                  - generic [ref=f11e11910]: A participant’s right to receive the severance payments and benefits described above is subject to their delivery and non-revocation of a general release of claims and restrictive covenant agreement in favor of the Company. The payments and benefits provided under the Change in Control Severance Plan in connection with a change in control may not be eligible for a federal income tax deduction by the Company pursuant to Section 280G of the Internal Revenue Code of 1986 (the “Code”). These payments and benefits may also subject an eligible participant to an excise tax under Section 4999 of the Code. If the payments or benefits payable to an eligible participant in connection with a change in control, under the Change in Control Severance Plan or otherwise, would be subject to the excise tax imposed under Section 4999 of the Code, then those payments or benefits will either be provided in full, or reduced if such reduction would result in a greater net after-tax benefit to the participant.
                  - generic [ref=f11e11911]: "38"
                  - separator [ref=f11e11914]
                  - generic [ref=f11e11917]: The Change in Control Severance Plan may be amended or terminated by the Board of Directors at any time before a change in control. Without the express written consent of an affected participant, the Change in Control Severance Plan may not be amended or terminated during the two-year period following a change in control, or following a participant’s termination that entitles the participant to severance benefits. Additionally, the Board of Directors may add or remove participants at any time before a change in control. An individual may not be removed as a participant or have severance entitlements reduced on or after the date of a change in control without the individual’s express written consent.
                  - generic [ref=f11e11918]: The foregoing description of the Change in Control Severance Plan is qualified in its entirety by reference to the full text of the Change in Control Severance Plan, which is filed as Exhibit 10.1 to this Quarterly Report on Form 10-Q and is incorporated herein by reference.
