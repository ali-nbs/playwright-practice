                    - generic [ref=f11e4967]: As of June 30, 2026, we were in compliance in all material respects with the covenants in all our borrowing arrangements.
                  - generic [ref=f11e4968]: Note 8 - Derivative Instruments and Hedging Activities
                  - generic [ref=f11e4970]:
                    - generic [ref=f11e4971]: Cash Flow Hedges of Interest Rate Risk
                    - generic [ref=f11e4972]: We record all derivatives at fair value. Our objective in utilizing interest rate derivatives is to add stability to our interest expense and to manage our exposure to interest rate movements. To accomplish this objective, we primarily use interest rate
                  - generic [ref=f11e4973]: "14"
                  - separator [ref=f11e4976]
                  - generic [ref=f11e4977]:
                    - generic [ref=f11e4978]: Equity LifeStyle Properties, Inc.
                    - generic [ref=f11e4979]: Notes to Consolidated Financial Statements
                    - generic [ref=f11e4981]: Note 8 - Derivative Instruments and Hedging Activities (continued)
                  - generic [ref=f11e4982]:
                    - generic [ref=f11e4983]: swaps as part of our interest rate risk management strategy. Interest rate swaps designated as cash flow hedges involve the receipt of variable amounts from a counterparty in exchange for making fixed-rate payments over the life of the agreements without exchange of the underlying notional amount.
                    - generic [ref=f11e4984]: The changes in the fair value of designated derivatives that qualify as a cash flow hedge are recorded in Accumulated other comprehensive income/(loss) on the Consolidated Balance Sheets and subsequently reclassified into earnings in the Consolidated Statements of Income and Comprehensive Income in the period that the hedged forecasted transaction affects earnings and are presented in the same line item as the earnings effect of the hedged item. For cash flow hedges, this is typically when the periodic swap settlements are made. Proceeds or payments from premiums and periodic settlements of derivative instruments are classified in the same section of the Consolidated Statements of Cash Flows as the underlying hedged item.
