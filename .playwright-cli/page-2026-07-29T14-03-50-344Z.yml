                  - generic [ref=f11e3434]: The accompanying notes are an integral part of the consolidated financial statements.
                  - generic [ref=f11e3435]: "8"
                  - separator [ref=f11e3438]
                  - generic [ref=f11e3439]:
                    - generic [ref=f11e3441]: Equity LifeStyle Properties, Inc.
                    - generic [ref=f11e3442]: Notes to Consolidated Financial Statements
                    - generic [ref=f11e3444]: Note 1 - Organization and Basis of Presentation
                  - generic [ref=f11e3447]:
                    - generic [ref=f11e3448]:
                      - generic [ref=f11e3449]: Equity LifeStyle Properties, Inc. (“ELS” or the “Company”), a Maryland corporation, together with MHC Operating Limited Partnership (the “Operating Partnership”) and its other consolidated subsidiaries (the “Subsidiaries”), are referred to herein as “we,” “us,” and “our”. We are a fully integrated owner of lifestyle-oriented properties (“Properties”) consisting of property operations and home sales and rental operations primarily within manufactured home (“MH”) and recreational vehicle (“RV”) communities and marinas. We provide our customers the opportunity to place manufactured homes and cottages, RVs and/or boats on our Properties either on a long-term or short-term basis. Our customers may lease individual developed areas (“Sites”) or enter into right-to-use contracts, also known as membership subscriptions, which provide them access to specific Properties for limited stays.
                      - generic [ref=f11e3450]: Our Properties are owned primarily by the Operating Partnership and managed internally by affiliates of the Operating Partnership. ELS is the sole general partner of the Operating Partnership. The Operating Partnership meets the criteria as a VIE, where we are the general partner and controlling owner of 96.8% as of June 30, 2026. The limited partners do not have substantive kick-out or participating rights. Our sole significant asset is our investment in the Operating Partnership, and consequently, substantially all of our assets and liabilities represent those assets and liabilities of the Operating Partnership. Additionally, we have the power to direct the Operating Partnership’s activities and the obligation to absorb its losses or the right to receive its benefits. Accordingly, we are the primary beneficiary, and we have continued to consolidate the Operating Partnership.
                    - generic [ref=f11e3452]: Equity method of accounting is applied to entities in which ELS does not have a controlling interest but with respect to which it can exercise significant influence over operations and major decisions. Our exposure to losses associated with unconsolidated joint ventures is primarily limited to the carrying value of these investments. Accordingly, distributions from a joint venture in excess of our carrying value are recognized in earnings.
                    - generic [ref=f11e3454]: The accompanying unaudited interim consolidated financial statements have been prepared pursuant to Securities and Exchange Commission (“SEC”) rules and regulations for Quarterly Reports on Form 10-Q. Accordingly, they do not include all of the information and note disclosures required by U.S. Generally Accepted Accounting Principles (“GAAP”) for complete financial statements and should be read in conjunction with the consolidated financial statements and notes thereto included in our Annual Report on Form 10-K for the year ended December 31, 2025.
                    - generic [ref=f11e3455]: Intercompany balances and transactions have been eliminated. All adjustments to the unaudited interim consolidated financial statements are of a normal, recurring nature and, in the opinion of management, are necessary for a fair presentation of results for these interim periods. Revenues and expenses are subject to seasonal fluctuations, and accordingly, quarterly interim results may not be indicative of full year results.
                  - generic [ref=f11e3456]: Note 2 - Summary of Significant Accounting Policies
                  - generic [ref=f11e3458]:
                    - generic [ref=f11e3459]: (a) Revenue Recognition
                    - generic [ref=f11e3461]:
                      - generic [ref=f11e3462]:
                        - generic [ref=f11e3463]:
                          - text: Our revenue streams are predominantly derived from customers renting our Sites or entering into membership subscriptions. Our MH Sites and annual RV and marina Sites are leased on an annual basis. Seasonal RV and marina Sites are leased to customers generally for one to six months. Transient RV and marina Sites are leased to customers on a short-term basis. Leases with our customers are accounted for as operating leases. Rental income is accounted for in accordance with Accounting Standards Codification (
                          - generic [ref=f11e3464] [cursor=pointer]: ASC) 842
                        - text: ", Leases, and is recognized over the term of the respective lease or the length of a customer’s stay. We do not separate expenses reimbursed by our customers (“utility recoveries”) from the associated rental revenue as we meet the practical expedient criteria to combine these lease and non-lease components. We account for and present rental revenue and utility recoveries as a single component under Rental income in the Consolidated Statements of Income and Comprehensive Income as the timing and pattern of transfer for rental revenue and the associated utility recoveries are the same. The change in allowance for credit losses related to the collectability of lease receivables is presented as a reduction to Rental income. Lease receivables are presented within Other assets, net on the Consolidated Balance Sheets and are net of an allowance for credit losses."
                      - generic [ref=f11e3465]:
                        - generic [ref=f11e3466]:
                          - text: Annual membership subscriptions and membership upgrades are accounted for in accordance with
                          - generic [ref=f11e3467] [cursor=pointer]: ASC 606
                        - text: ", Revenue from Contracts with Customers."
                        - generic [ref=f11e3468]: Membership subscriptions provide our customers access to specific Properties for limited stays at a specified group of Properties. Upgraded memberships provide enhanced benefits for members in good standing, including longer stays, the ability to make earlier reservations, potential discounts on rental units, and potential access to additional properties. Beginning in the first quarter of 2025, membership upgrade product offerings include two- to four-year term subscription products. Prior to the introduction of subscription-based upgrade products, membership upgrades required non-refundable upfront payments, with an option to finance the upfront payments. Beginning in the first quarter of 2025, upfront
                  - generic [ref=f11e3469]: "9"
                  - separator [ref=f11e3472]
                  - generic [ref=f11e3473]:
                    - generic [ref=f11e3475]: Equity LifeStyle Properties, Inc.
                    - generic [ref=f11e3476]: Notes to Consolidated Financial Statements
                    - generic [ref=f11e3478]: Note 2 - Summary of Significant Accounting Policies (continued)
                  - generic [ref=f11e3479]:
                    - generic [ref=f11e3480]:
                      - generic [ref=f11e3481]: payment upgrade products and related financing options are no longer being offered by the Company, but members in good standing are entitled to enhanced benefits for as long as they choose to remain in the program.
                      - generic [ref=f11e3482]: Membership subscriptions, including subscription-based membership upgrades, are presented within Annual membership subscriptions in the Consolidated Statements of Income and Comprehensive Income. Payments for membership subscriptions are deferred and recognized on a straight-line basis over the period during which access to Sites at certain Properties is provided. Membership subscription receivables are presented within Other assets, net on the Consolidated Balance Sheets and are net of an allowance for credit losses. Non-refundable upfront payments on our legacy product offerings are recognized on a straight-line basis over 24 years and are presented within Membership upgrade revenue in the Consolidated Statements of Income and Comprehensive Income. Financed upgrade sales (also known as contract receivables) are presented within Notes receivable, net on the Consolidated Balance Sheets and are net of an allowance for credit losses.
                      - generic [ref=f11e3484]: Revenue from home sales is recognized when the earnings process is complete. The earnings process is complete when the home has been delivered, the purchaser has accepted the home and title has transferred. We have a limited program under which we purchase loans made by an unaffiliated lender to homebuyers at our Properties. Financed home sales (also known as chattel loans) are presented within Notes receivable, net on the Consolidated Balance Sheets and are net of an allowance for credit losses.
                    - generic [ref=f11e3485]: (b) Restricted Cash
                    - generic [ref=f11e3487]: As of June 30, 2026 and December 31, 2025, restricted cash consisted of $24.1 million and $18.2 million, respectively, primarily related to cash reserved for customer deposits and escrows for insurance and real estate taxes.
                    - generic [ref=f11e3490]: (c) Fair Value of Financial Instruments
                    - generic [ref=f11e3492]:
                      - generic [ref=f11e3493]: "We disclose the estimated fair value of our financial instruments according to a fair value hierarchy. The valuation hierarchy is based on the transparency of the lowest level of input that is significant to the valuation of an asset or a liability as of the measurement date. The three levels are defined as follows:"
                      - generic [ref=f11e3494]: Level 1 - Inputs to the valuation methodology are quoted prices (unadjusted) for identical assets or liabilities in active markets.
                      - generic [ref=f11e3495]: Level 2 - Inputs to the valuation methodology include quoted prices for similar assets and liabilities in active markets and inputs that are observable for the asset or liability, either directly or indirectly, for substantially the full term of the financial instrument.
                      - generic [ref=f11e3496]: Level 3 - Inputs to the valuation methodology are unobservable and significant to the fair value measurement.
                      - generic [ref=f11e3497]:
                        - generic [ref=f11e3498]: The carrying values of cash and restricted cash, accounts receivable and accounts payable approximate their fair market values due to the short-term nature of these instruments. The carrying value of notes receivable approximates the fair market value as the interest rates are generally comparable to current market rates. As of December 31, 2025, notes receivable included a $56.1 million term loan made to RVC Core, LLC, an equity method investment of the Company, which was secured by the underlying Properties within the joint venture. During the quarter ended June 30, 2026, the $56.1 million term loan was eliminated in consolidation upon the acquisition of the remaining 20% ownership interest in RVC Core, LLC. Refer to
                        - text: Note 5. Investment in Real Estate.
                      - generic [ref=f11e3499]: The fair market value of mortgage notes payable, term loans and interest rate derivatives are measured with Level 2 inputs using quoted prices and observable inputs from similar liabilities as disclosed in Note 7. Borrowing Arrangements and Note 8. Derivative Instruments and Hedging Activities.
