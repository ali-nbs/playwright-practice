                  - generic [ref=f11e7367]: Item 2. Management’s Discussion and Analysis of Financial Condition and Results of Operations
                  - generic [ref=f11e7369]: The following discussion and analysis should be read in conjunction with the consolidated financial statements and accompanying notes thereto included in this Quarterly Report on Form 10-Q and in our Annual Report on Form 10-K for the year ended December 31, 2025 (“2025 Form 10-K”), as well as information in Part II. Item 7. Management’s Discussion and Analysis of Financial Condition and Results of Operations in our 2025 Form 10-K.
                  - generic [ref=f11e7370]: Overview and Outlook
                  - generic [ref=f11e7371]: We are a self-administered and self-managed real estate investment trust (“REIT”) with headquarters in Chicago, Illinois. We are a fully integrated owner of lifestyle-oriented properties (“Properties”) consisting of property operations and home sales and rental operations primarily within manufactured home (“MH”) and recreational vehicle (“RV”) communities and marinas. As of June 30, 2026, we owned or had an ownership interest in a portfolio of 453 Properties located throughout the United States and Canada containing 173,559 individual developed areas (“Sites”). These Properties are located in 35 states and British Columbia.
                  - generic [ref=f11e7372]: We invest in properties in sought-after locations near retirement and vacation destinations and urban areas across the United States with a focus on delivering an exceptional experience to our residents and guests that results in delivery of value to stockholders. Our business model is intended to provide an opportunity for increased cash flows and appreciation in value. We seek growth in earnings, Funds from Operations (“FFO”), Normalized Funds from Operations (“Normalized FFO”) and cash flows by enhancing the profitability and operation of our Properties and investments. We accomplish this by attracting and retaining high quality customers to our Properties, who take pride in our Properties and in their homes and efficiently managing our Properties by increasing occupancy, maintaining competitive market rents and controlling expenses. We also actively pursue opportunities that fit our acquisition criteria and are currently engaged in various stages of negotiations relating to the possible acquisition of additional properties.
                  - generic [ref=f11e7374]: We believe the demand from baby boomers for MH and RV communities will continue to be strong over the long term. It is estimated that approximately 10,000 Americans turn 65 years old every day and all baby boomers will be at least age 65 by 2030. These individuals, seeking an active lifestyle, will continue to drive the market for second-home sales as vacation properties, investment opportunities or retirement retreats. We expect it is likely that we will continue to see high levels of second-home sales and that manufactured homes and cottages in our Properties will continue to provide a viable second-home alternative to site-built homes. We also believe the Millennial and Generation Z demographic will contribute to our future long-term customer pipeline. After conducting a comprehensive study of RV ownership, according to the Recreational Vehicle Industry Association (“RVIA”), data suggested that RV sales are expected to benefit from an increase in demand from those born in the United States from 1980 to 2003, or Millennials and Generation Z, over the coming years. We believe the demand from baby boomers and these younger generations will continue to outpace supply for MH and RV communities. The entitlement process to develop new MH and RV communities is extremely restrictive. As a result, there have been limited new communities developed in our target geographic markets.
                  - generic [ref=f11e7375]: We generate the majority of our revenues from customers renting our Sites or entering into right-to-use contracts, also known as membership subscriptions, which provide them access to specific Properties for limited stays. MH Sites are generally leased on an annual basis to residents who own or lease factory-built homes, including manufactured homes. Annual RV and marina Sites are leased on an annual basis to customers who generally have an RV, factory-built cottage, boat or other unit placed on the site, including those Northern properties that are open for the summer season. Seasonal RV and marina Sites are leased to customers generally for one to six months. Transient RV and marina Sites are leased to customers on a short-term basis. The revenue from seasonal and transient Sites is generally higher during the first and third quarters. We consider the transient revenue stream to be our most volatile as it is subject to weather conditions and other factors affecting the marginal RV customer’s vacation and travel preferences. We also generate revenue from customers renting our marina dry storage. Additionally, we have interests in joint venture Properties for which revenue is classified as Equity in income/(loss) of unconsolidated joint ventures in the Consolidated Statements of Income and Comprehensive Income.
