                    - generic [ref=f11e3659]: (e) Insurance Recoveries
                    - generic [ref=f11e3661]: We carry comprehensive insurance coverage for losses resulting from property damage and environmental liability and business interruption claims on all of our Properties. We record the estimated amount of expected insurance proceeds for property damage, clean-up costs and other losses incurred as an asset (typically a receivable from our insurance carriers) and income up to the amount of the losses incurred when receipt of insurance proceeds is deemed probable. Any amount of insurance recovery in excess of the losses incurred and any amount of insurance recovery related to business interruption are considered a gain contingency and are recognized in the period in which the insurance proceeds are received.
