                  - generic [ref=f11e9137]: _____________________
                  - generic [ref=f11e9138]: "(1)Rental income consists of the following total portfolio income items in this table: 1) MH base rental income, 2) Rental home income, 3) RV and marina base rental income and 4) Utility income, which is calculated by subtracting Other income in the Consolidated Statements of Income and Comprehensive Income from Utility and other income in this table. The difference between the sum of the total portfolio income items and Rental income in the Consolidated Statements of Income and Comprehensive Income is bad debt expense, which is presented in Insurance and other in this table."
                  - generic [ref=f11e9139]: (2)Membership upgrade product offerings consist of two- to four-year term subscription products, which are recognized in Annual membership subscriptions. Prices for two-year products range between $4,000 to $8,000 and between approximately $7,000 to $14,000 for the four-year product, which results in approximately $2,500 to $3,000 of earned revenue on an annual basis.
                  - generic [ref=f11e9140]: (3)Includes bad debt expense for all periods presented.
                  - generic [ref=f11e9141]: (4)See Non-GAAP Financial Measures section of the Management’s Discussion and Analysis for definitions and reconciliations of these Non-GAAP measures to Net Income available for Common Stockholders.
                  - generic [ref=f11e9143]: Total Portfolio income from property operations for the quarter ended June 30, 2026 increased $11.8 million, or 6.7%, from the same period in 2025 driven by increases of $11.5 million, or 6.6%, from our Core Portfolio and $0.3 million from our Non-Core Portfolio.
