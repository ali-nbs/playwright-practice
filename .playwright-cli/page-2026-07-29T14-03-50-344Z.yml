                  - generic [ref=f11e9367]: RV and marina base rental income in our Core Portfolio for the quarter ended June 30, 2026 increased $1.9 million, or 1.8%, from the same period in 2025 due to an increase in Core Annual RV and marina base rental income of 5.4%, offset by decreases in Core Seasonal and Transient RV and marina base rental income of 11.2% and 8.9%, respectively. The increase in Core Annual RV and marina base rental income was driven by an increase in rate of 5.3%. The decrease in Core Transient RV and marina base rental income was primarily due to lower occupancy in the South, Pacific West and Central regions.
                  - generic [ref=f11e9368]: Utility and other income in our Core Portfolio for the quarter ended June 30, 2026 increased $2.2 million, or 6.6%, from the same period in 2025. The increase was primarily due to increases of $1.8 million and $0.4 million in utility income and pass-through income, respectively. The increase in utility income was driven by higher expenses driving additional recovery primarily in sewer, electric, trash and water. The utility recovery rate (utility income divided by utility expenses) for the quarters ended June 30, 2026 and 2025 were approximately 50.5% and 48.8%, respectively. The increase in pass-through income was primarily driven by increases in real estate tax pass-throughs to customers in Florida.
                  - generic [ref=f11e9369]: Property Operating Expenses
                  - generic [ref=f11e9370]: Property operating expenses, excluding property management, in our Core Portfolio for the quarter ended June 30, 2026 increased $4.3 million, or 2.9%, from the same period in 2025, driven by increases in Utility expense of $2.2 million and Repairs and maintenance of $1.4 million, partially offset by a decrease in Insurance and other of $0.5 million. The increase in Utility expense was due to increases in sewer, water and trash expenses. The increase in Repair and maintenance expense was due to increases in extraordinary repair and maintenance expense, lawn and common area maintenance expense and pool expense. The decrease in Insurance and other was due primarily to a decrease in insurance expense as a result of our April 1, 2026 property and casualty insurance renewal.
