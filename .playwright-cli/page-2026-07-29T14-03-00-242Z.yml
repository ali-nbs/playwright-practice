                    - generic [ref=f10e7073]:
                      - generic [ref=f10e7074]: "Our maximum exposure to loss from the involvement with the Fund JVs as of June 30, 2026 is $68.8 million. This amount consists of: (i) the carrying amount of our equity investments, totaling $28.1 million, (ii) remaining unfunded capital commitments of $20.2 million, and (iii) deferred profit related to sales to the Fund JVs of $20.6 million. Our total capital commitment to the Fund JVs as of June 30, 2026 is $77.3 million. For details related to our maximum exposure to loss from the involvement with the Fund JVs and our capital commitments, see Part II, Item 8, Note"
                      - text: 7-Investments in Unconsolidated Affiliates in our 2025 Form 10-K.
                    - generic [ref=f10e7075]: Our share of income or loss from each Fund JV for the period represents the change in our calculated liquidation claim from the beginning to the end of the reporting period, adjusted for capital contributions and distributions made during the period. The resulting equity‑method income or loss is presented as a single line item, Equity in earnings (loss) of unconsolidated affiliates, in our condensed consolidated statements of operations.
                    - generic [ref=f10e7076]:
                      - text: We record our share of profit from sales of our products to the Fund JVs as a reduction of equity in earnings (loss) of unconsolidated affiliates. This share of profit reduces the carrying amount of our investments in unconsolidated affiliates. To the extent the cumulative reduction of equity in earnings (loss) of unconsolidated affiliates exceed the investment’s carrying amount, the excess is presented as either Deferred profit in transactions with unconsolidated affiliates, or Accrued expenses and other current liabilities
                      - generic [ref=f10e7077]:
                        - text: ", based on the expected timing of realization. The deferred profit reverses (increasing equity in earnings (loss) of unconsolidated affiliates and restoring the investment balance) as profit is realized over the remaining useful life through depreciation of the underlying assets. As of June 30, 2026, and December 31, 2025, the deferred profit balances were $20.6 million and $13.9 million, of which $19.6 million and $13.9 million were classified as a noncurrent liability, respectively. During the six months ended June 30, 2026, we recognized $12.7 million of equity‑method losses from unconsolidated affiliates. Of this amount, $14.0 million related to the elimination of intra‑entity profit on asset sales in accordance with"
                        - generic [ref=f10e7078] [cursor=pointer]: ASC 323
                      - text: ", which will be recognized over the useful lives of the underlying assets as they are depreciated, and $1.3 million related to the allocation of losses from the Fund JVs under the HLBV method."
