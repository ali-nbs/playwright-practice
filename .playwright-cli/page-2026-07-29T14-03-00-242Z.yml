                  - generic [ref=f10e12107]: Operating Activities
                  - generic [ref=f10e12108]: "Our operating activities consisted of net income adjusted for certain non-cash items plus changes in our operating assets and liabilities or working capital. Net cash provided by operating activities for the six months ended June 30, 2026, was primarily due to business‑driven changes in working capital totaling $88.2 million. These changes included:"
                  - generic [ref=f10e12110]: •A $276.7 million increase in accounts receivable and contract assets, which grew due to the timing of milestone billings and customer acceptance cycles.
                  - generic [ref=f10e12111]: •A $226.2 million increase in deferred revenue and customer deposits, primarily driven by a higher level of new customer deposits compared to the prior year period. This reflected the timing and mix of system deployments, including a lower proportion of projects without significant upfront billings. Deferred revenue increased modestly compared to the prior year period;
                  - generic [ref=f10e12112]: •A $132.3 million increase in prepaid expenses and other current assets due to upfront service‑related payments aligned with expanding field service activity, and $50.0 million payment in connection with the assignment of certain option rights related to a customer project arrangement;
                  - generic [ref=f10e12113]: •A $115.1 million increase in inventory. Inventory increased as we built additional units to support future customer demand and to manage lead times in our supply chain; and
