                  - generic [ref=f10e13056]: Total Gross Profit
                  - generic [ref=f10e13057]: Gross profit increased by $248.4 million and $385.3 million for the three and six months ended June 30, 2026, respectively, compared to the corresponding periods in the prior year. This increase was predominantly driven by a $243.6 million and a $395.4 million increase in product gross profit, and a $7.8 million and a $15.4 million increase in service gross profit, partially offset by a $2.0 million and a $15.0 million decrease of electricity gross profit, and a $1.0 million and a $10.5 million increase of installation gross loss.
                  - generic [ref=f10e13058]: Product Gross Profit
                  - generic [ref=f10e13059]: Product gross profit increased by $243.6 million and $395.4 million for the three and six months ended June 30, 2026, respectively, compared to the corresponding periods in the prior year. The increase was primarily attributable to (i) increased product demand driven by a significant deployment for a large AI infrastructure customer and multiple projects executed through our joint venture with Brookfield; (ii) the recognition of a $37.4 million recovery of previously paid import tariffs; and (iii) lower material, labor, and overhead costs due to ongoing manufacturing process improvements and increased automation. The overall increase was partially offset by an increase in product warranty.
                  - generic [ref=f10e13060]: Installation Gross Loss
                  - generic [ref=f10e13061]: Installation gross loss increased by $1.0 million and $10.5 million for the three and six months ended June 30, 2026, respectively, compared to the corresponding periods in the prior year. The increase in gross loss was primarily driven by project mix and the timing of milestone achievement. Depending on customer requirements, Bloom may provide a full-scope installation solution, which results in higher installation revenue and associated installation costs, or the customer may engage a third-party installation partner, resulting in lower installation revenue and costs for Bloom. Installation gross profit (loss) may vary based on several factors, including the scope of installation services provided by Bloom, customer and project mix, the economics of underlying projects, and the timing of milestone execution.
                  - generic [ref=f10e13062]: Service Gross Profit
                  - generic [ref=f10e13063]: Service gross profit increased by $7.8 million and $15.4 million for the three and six months ended June 30, 2026, respectively, compared to the corresponding periods in the prior year. The increase was primarily attributable to higher revenue from maintenance contracts associated with our fleet of Energy Server systems, which contributed $17.3 million and $26.7 million for the three and six months ended June 30, 2026, respectively. The increase was partially offset by higher product performance guarantee costs of $3.0 million and $4.6 million for the same periods, reflecting the effects of fleet degradation.
