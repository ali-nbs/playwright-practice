                    - generic [ref=f10e8732]: Capped Calls
                    - generic [ref=f10e8733]:
                      - text: Please refer to Part II, Item 8, Note 8-Outstanding Loans and Security Agreements, section Capped Calls
                      - generic [ref=f10e8734]: in our 2025 Form 10-K for discussion of privately negotiated capped call transactions in connection with the pricing of the 3.0% Green Notes due June 2028.
                    - generic [ref=f10e8735]: Conversions of the Green Notes
                    - generic [ref=f10e8736]: During the six months ended June 30, 2026, the Green Notes became eligible for conversion after the satisfaction of the Closing Price Condition specified in the underlying indentures for such notes. During the six months ended June 30, 2026, holders elected to convert approximately $147.0 million aggregate principal amount of the Green Notes. Under the conversion provisions of the respective indentures for the Green Notes, and consistent with our obligation to settle conversions in cash, shares of common stock, or a combination thereof, we issued 6,676,924 shares of common stock during the period. As of June 30, 2026, an additional 877,687 shares of common stock related to converted Green Notes had not yet been issued and remained unsettled.
                    - generic [ref=f10e8738]:
                      - generic [ref=f10e8739]:
                        - text: Following the conversions, the outstanding carrying value of the 3.0% Green Notes due June 2028 and 3.0% Green Notes due June 2029 decreased by $97.6 million and $47.0 million, respectively. As a result, we recognized $
                        - generic [ref=f10e8740]: "144.6"
                        - text: million in
                      - text: Additional paid-in capital in our condensed consolidated balance sheets. The impact on other line items within our condensed
                  - generic [ref=f10e8741]: "25"
                  - separator [ref=f10e8744]
                  - generic [ref=f10e8747]:
                    - generic [ref=f10e8748]: consolidated balance sheets and our condensed consolidated statements of operations was not material. No gain or loss was recognized in connection with the conversions.
                    - generic [ref=f10e8749]: We will continue to assess conversion eligibility each fiscal quarter in accordance with the conditions described in the Indentures governing the Green Notes.
                    - generic [ref=f10e8750]: Redemption of the 3.0% Green Notes due June 2028
                    - generic [ref=f10e8752]: On June 9, 2026, we issued a notice of redemption (the “Redemption Notice”) for all the remaining outstanding 3.0% Green Notes due June 2028 pursuant to the indenture dated May 16, 2023 governing such notes (the “Indenture”). The redemption date was scheduled for July 10, 2026 (the “Redemption Date”).
                    - generic [ref=f10e8754]: In accordance with the terms of the Indenture, holders had the right to convert their notes at any time from the date of the Redemption Notice until the close of business on the business day immediately preceding the Redemption Date. Any notes not converted would be redeemed for cash at a price equal to 100% of the principal amount, plus accrued and unpaid interest, if any, to, but excluding, the Redemption Date.
                    - generic [ref=f10e8756]: Revolving Credit Facility
                    - generic [ref=f10e8757]:
                      - generic [ref=f10e8758]: On December 19, 2025, we entered into a senior secured multicurrency Revolving Credit Facility in an aggregate available amount of $600.0 million, including a letter of credit sub-facility of up to $90.0 million (the “Revolving Credit Facility”). For details, see Part II, Item 8, Note 8-
                      - text: Outstanding Loans and Security Agreements, section Revolving Credit Facility in our 2025 Form 10-K.
                    - generic [ref=f10e8759]: As of June 30, 2026, and December 31, 2025, no amounts were drawn under the facility. As of June 30, 2026, $90.0 million of standby letters of credit had been issued under the facility, reducing available borrowings to $510.0 million.
