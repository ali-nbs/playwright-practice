                  - generic [ref=f10e14158]: PART II-OTHER INFORMATION
                  - generic [ref=f10e14159]: ITEM 1-LEGAL PROCEEDINGS
                  - generic [ref=f10e14161]: We are, and from time to time we may become, involved in legal proceedings or subject to claims arising in the ordinary course of our business. For a discussion of our legal proceedings, see Part I, Item 1, Note 12-Commitments and Contingencies in this Quarterly Report on Form 10-Q. We are not presently a party to any other legal proceedings that in the opinion of our management and if determined adversely to us, would individually or taken together have a material adverse effect on our business, operating results, financial condition or cash flows.
                  - generic [ref=f10e14163]: ITEM 1A-RISK FACTORS
                  - generic [ref=f10e14165]: "There were no material changes in risk factors as disclosed in our 2025 Form 10-K, except as set forth below:"
                  - generic [ref=f10e14166]: Techniques employed by short sellers may in the future drive down the market price of our common stock.
                  - generic [ref=f10e14167]: Short selling is the practice of selling securities that the seller does not own but rather has borrowed from a third-party with the intention of buying identical securities back at a later date to return to the lender. The short seller hopes to profit from a decline in the value of the securities between the sale of the borrowed securities and the purchase of the replacement shares, as the short seller expects to pay less in that purchase than it received in the sale. As it is in the short seller’s best interests for the price of the stock to decline, many short sellers publish, or arrange for the publication of, negative opinions or allegations regarding the relevant issuer and its business prospects, including regarding its supply chain, commercial arrangements, or financial reporting, in order to create negative market momentum and generate profits for themselves after selling a stock short. These short attacks have led to selling of shares in the market.
                  - generic [ref=f10e14168]: Short sellers have published reports containing allegations regarding us and our business, and we have been, and may in the future be, the subject of such activities. The publication of any such articles, reports or other statements regarding us has and may continue to bring about a temporary, or possibly long-term, decline in the market price of our common stock, and may adversely affect our relationships with customers, suppliers, and financing parties. We may have to expend a significant amount of resources to investigate such allegations and/or defend ourselves. While we have and would continue to strongly defend against any such short seller attacks, we may be constrained in the manner in which we can proceed against the relevant short seller by applicable state law or issues of commercial confidentiality, including because we treat information regarding our suppliers and sourcing arrangements as confidential and proprietary. Responding to short attacks has been and may continue to be costly and time-consuming, disrupt our operations, and divert the attention of management and our employees.
                  - generic [ref=f10e14170]: ITEM 2-UNREGISTERED SALES OF EQUITY SECURITIES AND USE OF PROCEEDS
                  - generic [ref=f10e14172]: On April 9, 2026, in connection with the partnership between the Company and Oracle to provide on-site solid state power for AI data centers, we issued the Warrant to Oracle to purchase up to an aggregate of 3,531,073 shares of our common stock, with an exercise price of $113.28 per share. The Warrant was fully vested and immediately exercisable, in whole or in part, at any time until 5:00 p.m. (Eastern time) on October 9, 2026, at Oracle’s election, by cash payment or by cashless exercise.
                  - generic [ref=f10e14173]: On May 1, 2026, Oracle performed a cashless exercise of the Warrant. As a result of the cashless exercise, we issued 1,905,433 shares of our common stock on a net basis. Under the terms of the warrant agreement, Oracle could elect either net or gross settlement. Because net settlement would result in 1.4 million fewer shares being issued than a gross settlement, we agreed to issue Oracle an additional 248,798 shares of common stock as an inducement for Oracle to elect net settlement.
