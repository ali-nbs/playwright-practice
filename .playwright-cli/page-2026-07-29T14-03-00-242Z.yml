                  - generic [ref=f10e13827]: Interest Income
                  - generic [ref=f10e13828]: Interest income is earned on invested cash balances, primarily held in money market funds. Interest income increased by $14.3 million and $26.3 million for the three and six months ended June 30, 2026, respectively, compared to the same periods in the prior year, primarily due to an increase in average invested cash balances following the refinancing of debt into a 0% coupon instrument maturing in 2030. As a result, average balances invested in money market funds increased by approximately $2.4 billion and $2.3 billion during the three and six months ended June 30, 2026, respectively.
                  - generic [ref=f10e13829]: "51"
                  - separator [ref=f10e13832]
                  - generic [ref=f10e13835]: Interest Expense
                  - generic [ref=f10e13836]: Interest expense is primarily due to our debt held by third parties and interest expense related to managed services agreements.
                  - generic [ref=f10e13837]: Interest expense decreased by $5.5 million and $11.3 million for the three and six months ended June 30, 2026, respectively, compared to the corresponding periods in the prior year, primarily due to lower interest expense on outstanding debt. The decrease was driven mainly by reductions in interest expense associated with the 3% Green Notes due June 2028 of $4.9 million and $10.0 million, respectively, and with the 3% Green Notes due June 2029 of $3.6 million and $6.6 million, respectively, for the three and six months ended June 30, 2026. These reductions primarily resulted from the induced conversion of the notes during the fourth quarter of fiscal year 2025 (see Part II, Item 8, Note 8-Outstanding Loans and Security Agreements, section Induced Conversions of the Existing Notes in our 2025 Form 10-K). The decrease was partially offset by $3.0 million and $6.0 million of amortization of debt issuance costs related to the 0% Notes issued on November 4, 2025, and $0.8 million and $1.4 million of amortization of issuance costs associated with the revolving credit facility entered into on December 19, 2025, for the three and six months ended June 30, 2026, respectively (see Part II, Item 8, Note 8-Outstanding Loans and Security Agreements, section Revolving Credit Facility in our 2025 Form 10-K).
                  - generic [ref=f10e13838]: Equity in Earnings (Loss) of Unconsolidated Affiliates
                  - generic [ref=f10e13839]:
                    - text: During the year ended December 31, 2025, the Company and Brookfield entered into joint venture structures. Brookfield is considered the principal owner, and accounts for the JVs on a consolidated basis. For the three and six months ended June 30, 2026, Equity in earnings (loss) of unconsolidated affiliates
                    - generic [ref=f10e13840]:
                      - text: reflects (i) the
                      - generic [ref=f10e13841] [cursor=pointer]: ASC 323
                    - text: ", Investments-Equity Method and Joint Ventures elimination of intra‑entity profit on sales to joint ventures formed with Brookfield-deferred and recognized over the assets’ depreciable lives-and (ii) the Company’s equity pickup of those joint ventures’ net results under the HLBV method. For details, refer to Part II, Item 1, Note 7-Investments in Unconsolidated Affiliates in this Quarterly Report on Form 10-Q."
                  - generic [ref=f10e13842]: Other Income, Net
                  - generic [ref=f10e13843]: Other income, net is primarily derived from foreign currency transactions and other income related to managed services transactions. Other income, net for the six months ended June 30, 2026, improved by $4.1 million, compared to the prior year period, primarily as a result of $11.1 million other income related to managed services transactions, partially offset by an increase in loss from foreign currency transactions of $6.8 million. Change in Other income, net for the three months ended June 30, 2026, was immaterial.
                  - generic [ref=f10e13844]: Loss on extinguishment of debt
                  - generic [ref=f10e13845]: Loss on extinguishment of debt for the three and six months ended June 30, 2025, was $32.3 million, recognized in connection with the exchange of $112.8 million aggregate principal amount of the 2.5% Green Convertible Senior Notes due August 2025 for $115.7 million aggregate principal amount of 3.0% Green Notes due June 2029, which settled on May 13, 2025.
                  - generic [ref=f10e13846]: (Loss) Gain on Revaluation of Embedded Derivatives
                  - generic [ref=f10e13847]: (Loss) gain on revaluation of embedded derivatives is derived from the change in fair value of our sales contracts of embedded Escalation Protection Plan derivatives valued using historical grid prices and available forecasts of future electricity prices to estimate future electricity prices. (Loss) gain on revaluation of embedded derivatives for the three and six months ended June 30, 2026, compared to the same periods in the prior year, was not material.
