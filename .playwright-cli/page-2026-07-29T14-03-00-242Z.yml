                      - generic [ref=f10e4366]:
                        - generic [ref=f10e4367]: In April 2026, the Financial Accounting Standards Board (the “FASB”) issued Accounting Standards Update (“ASU”) 2026-01,
                        - generic [ref=f10e4368]:
                          - text: Equity (
                          - generic [ref=f10e4369] [cursor=pointer]: Topic 505
                        - text: "): Initial Measurement of Paid-in-Kind Dividends on Equity-Classified Preferred Stock"
                        - generic [ref=f10e4370]: (“ASU 2026-01”). This guidance requires entities to initially measure paid-in-kind (“PIK”) dividends on equity-classified preferred stock based on the dividend rate specified in the related agreement applied to the instrument’s liquidation preference. The amendments are intended to improve comparability by reducing diversity in practice related to the measurement of such dividends and do not affect the timing of recognition. The standard is effective for fiscal years beginning after December 15, 2026, including interim periods within those fiscal years, with early adoption permitted. The Company is evaluating ASU 2026-01 guidance and does not currently expect it to have a material impact on its condensed consolidated financial statements.
