                    - generic [ref=f10e4887]: For additional information on deferred revenue, see Part II, Item 8, Note 3-Revenue Recognition, section Deferred Revenue in our 2025 Form 10-K.
                    - generic [ref=f10e4888]: As of June 30, 2026, and December 31, 2025, we have unsatisfied performance obligations of $442.4 million and $394.4 million, respectively, primarily related to product sales and installation services. We expect to recognize the associated revenue within the next 1 to 2 years, consistent with customers’ project deployment schedules. In addition, as of June 30, 2026, and December 31, 2025, we had unsatisfied performance obligations of $51.7 million and $25.0 million, respectively, related mainly to deferred service contracts which we expect to recognize over the remaining contractual terms ranging from 1 to 25 years.
                    - generic [ref=f10e4890]: We do not disclose the value of the unsatisfied performance obligations for (i) contracts with an original expected length of one year or less and (ii) contracts for which we recognize revenue at the amount to which we have the right to invoice for services performed.
