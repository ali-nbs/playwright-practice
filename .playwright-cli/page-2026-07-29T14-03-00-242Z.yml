                  - generic [ref=f10e11994]: Liquidity and Capital Resources
                  - generic [ref=f10e11995]: Overview of Liquidity Position
                  - generic [ref=f10e11996]: As of June 30, 2026, and December 31, 2025, we had unrestricted cash and cash equivalents of $2,666.9 million and $2,454.1 million, respectively. Our cash and cash equivalents consist of highly liquid investments with maturities of three months or less, including money market funds of $2,218.8 million and $2,386.6 million as of June 30, 2026, and December 31, 2025, respectively. We seek to maintain these balances with high credit quality counterparties, regularly monitor the amount of our credit exposure to any one issuer and diversify our investments in order to minimize our exposure.
                  - generic [ref=f10e11997]: "42"
