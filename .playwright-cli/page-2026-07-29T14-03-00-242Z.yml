                  - generic [ref=f10e13070]: Electricity Gross Profit
                  - generic [ref=f10e13071]: Electricity gross profit decreased by $2.0 million and $15.0 million for the three and six months ended June 30, 2026, respectively, compared to the corresponding periods in the prior year. The decrease for the three months ended June 30, 2026, was not material. The decrease for the six months ended June 30, 2026, was predominantly due to a one-time settlement of a customer contract after redeploying assets for our partner in the first quarter of fiscal year 2025.
