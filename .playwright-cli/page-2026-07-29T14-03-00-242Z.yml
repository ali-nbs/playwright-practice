                  - generic [ref=f10e13599]: Total stock-based compensation expense for the three and six months ended June 30, 2026, increased by $26.2 million and $51.0 million, respectively, compared to the corresponding periods in the prior year. The increase was primarily attributable to higher stock-based compensation expense related to PSUs and RSUs of $19.1 million and $33.5 million, respectively, increased expense associated with the 2018 ESPP of $3.3 million and $5.2 million, respectively, and a net increase of $3.8 million and $12.4 million, respectively, related to capitalized stock-based compensation and the cash-settled component of certain stock-based awards. The increase was driven principally by (i) grants of new awards to executive officers, (ii) an increase in Bloom’s stock price, and (iii) higher employee participation and contributions under the 2018 ESPP.
