                  - generic [ref=f10e11922]: 16. Subsequent Events
                  - generic [ref=f10e11924]:
                    - generic [ref=f10e11925]:
                      - generic [ref=f10e11926]: In May 2026, we made a $50.0 million payment to acquire contractual rights under an option arrangement. Under the related agreements, in July 2026 the rights were assigned to a Brookfield vehicle, and such vehicle agreed to make a $50.0 million payment to us upon their exercise of the option and acquisition of the underlying project. In the event the Brookfield vehicle does not proceed with the acquisition or in certain other events, Brookfield may put the option rights back to the original holder, Oracle, with Bloom receiving recovery of the $50.0 million through corresponding contractual arrangements. Bloom is not intended to retain a long-term ownership interest in the underlying assets or participate in the project’s long-term economics. See Part I, Item 1, Note 6-
                      - text: Balance Sheet Components in this Quarterly Report on Form 10-Q.
                    - generic [ref=f10e11927]: The redemption of the 3.0% Green Notes due June 2028 was completed on July 10, 2026.
                    - generic [ref=f10e11929]: There have been no other subsequent events that occurred during the period subsequent to the date of these condensed consolidated financial statements that would require adjustment to our disclosure in the condensed consolidated financial statements as presented.
                  - generic [ref=f10e11930]: "38"
                  - separator [ref=f10e11933]
                  - generic [ref=f10e11936]: ITEM 2-MANAGEMENT’S DISCUSSION AND ANALYSIS OF FINANCIAL CONDITION AND RESULTS OF
                  - generic [ref=f10e11938]: OPERATIONS
                  - generic [ref=f10e11939]: This Quarterly Report on Form 10-Q contains forward-looking statements within the meaning of Section 27A of the Securities Act of 1933, as amended (the “Securities Act”), and Section 21E of the Securities Exchange Act of 1934, as amended (the “Exchange Act”). All statements contained in this Quarterly Report on Form 10-Q other than statements of historical fact, including statements regarding our future operating results and financial position, our business strategy and plans and our objectives for future operations, are forward-looking statements. Generally, the words “believe,” “may,” “will,” “estimate,” “continue,” “anticipate,” “predict,” “project,” “potential,” “seek,” “intend,” “could,” “would,” “should,” “expect,” “plan” and similar expressions are intended to identify forward-looking statements. However, the absence of these words or similar expressions does not mean that a statement is not forward-looking.
                  - generic [ref=f10e11941]: "Forward-looking statements in this Quarterly Report on Form 10-Q include, but are not limited to, our plans and expectations regarding future financial results, including our expectations regarding: our ability to be successful in the AI data center market and new international markets; the rate of AI adoption and demand for data centers; our ability to innovate, develop new products and improve upon our existing products; our ability to anticipate and address customer demand; our strategic partnerships with SK ecoplant Co., Ltd. and parties which provide financing and capital for project financings; our competitive position in the energy market for on-site power; future deployment of our Bloom Energy Server systems, Bloom Electrolyzers, and other solutions; our ability to increase efficiency of our products; our ability to market our products successfully in connection with the global energy transition and shifting attitudes around climate change; our business strategy and plans and our objectives for future operations; operating results; the sufficiency of our cash, our cash flows from operating activities, and our liquidity and our ability to obtain financing; projected costs and cost reductions; our ability to increase production capacity and achieve cost reductions in our fuel cell products and installation requirements; the adequacy of our agreements with our suppliers; management’s plans and objectives for future operations; our ability to repay our debt obligations as they come due; trends in average selling prices; the success of our customer financing arrangements and ability to secure financiers to support customer financing needs for our product deployment; capital expenditures; warranty matters; outcomes of litigation; risks related to cybersecurity breaches, privacy and data security; the likelihood of any impairment of project assets, long-lived assets and investments; trends in revenue, cost of revenue and gross profit (loss); trends in operating expenses including research and development expense, sales and marketing expense and general and administrative expense and expectations regarding these expenses as a percentage of revenue; legislative actions and regulatory and environmental compliance; government shutdowns; general business and macroeconomic conditions in our markets including inflationary pressure; our supply chain (including any direct or indirect effects from the Russia-Ukraine war, armed conflicts in the Middle East, or geopolitical developments related to China); the impact of tariffs on our supply chain and fuel cell product; the impact of changes in government incentives, including the impact of the Inflation Reduction Act of 2022 (the “IRA”) and the One Big Beautiful Bill Act (the “OBBBA”); industry trends; our exposure to foreign exchange, interest and credit risk; and the impact of recently adopted accounting pronouncements."
                  - generic [ref=f10e11942]: You should not rely upon forward-looking statements as predictions of future events. We have based the forward-looking statements contained in this Quarterly Report on Form 10-Q primarily on our current expectations and projections about future events and trends that we believe may affect our business, financial condition, operating results and prospects. We operate in a very competitive and rapidly changing environment. New risks and uncertainties emerge from time to time, and it is not possible for us to predict all risks and uncertainties or the extent to which any factor or combination of factors may cause actual results to differ materially from those contained in any forward-looking statements we may make in this Quarterly Report on Form 10-Q. We cannot assure you that the results, events and circumstances reflected in the forward-looking statements will be achieved or occur. Actual results, events or circumstances could differ materially and adversely from those described or anticipated in the forward-looking statements.
                  - generic [ref=f10e11943]: The forward-looking statements made in this Quarterly Report on Form 10-Q relate only to events as of the date on which the statements are made. We undertake no obligation to update any forward-looking statements made in this Quarterly Report on Form 10-Q to reflect events or circumstances after the date of this Quarterly Report on Form 10-Q or to reflect new information or the occurrence of unanticipated events, except as required by law. We may not actually achieve the plans, intentions or expectations disclosed in our forward-looking statements and you should not place undue reliance on our forward-looking statements.
                  - generic [ref=f10e11944]: Our actual results and timing of selected events may differ materially from those anticipated in these forward-looking statements as a result of many factors including those discussed under in the section titled "Risk Factors" in Part I, Item 1A of our Annual Report on Form 10-K for the fiscal year ended December 31, 2025 (“2025 Form 10-K”), as well as those described from time to time in our others filings filed with the Securities and Exchange Commission.
                  - generic [ref=f10e11945]: "39"
                  - separator [ref=f10e11948]
                  - generic [ref=f10e11951]: The following discussion and analysis should be read in conjunction with our condensed consolidated financial statements and notes thereto included elsewhere in this Quarterly Report on Form 10-Q.
                  - generic [ref=f10e11952]: Overview
                  - generic [ref=f10e11953]: Description of Bloom Energy
                  - generic [ref=f10e11954]: "Bloom Energy is a global leader in onsite power generation, delivering a foundational platform purpose-built for the digital era and the global energy transition. We manufacture a versatile fuel cell energy platform, supporting the commercial availability of two primary products: the Bloom Energy Server® fuel cell system for generating electricity and the Bloom Electrolyzer™ for producing hydrogen. Our primary product, the Bloom Energy Server is a proprietary high-temperature solid-oxide fuel cell technology that converts fuels-including natural gas, biogas, and hydrogen-into electricity at high density without combustion or moving parts, achieving lower emissions and higher efficiency than legacy systems."
                  - generic [ref=f10e11955]: For additional overview information, refer to Part I, Item 7, Management’s Discussion and Analysis of Financial Condition and Results of Operations, sections Overview and Key Macro Trends in our 2025 Form 10-K.
                  - generic [ref=f10e11956]: Developments With Respect to Factors Affecting Our Performance
                  - generic [ref=f10e11957]: Freight, Logistics and Transportation Costs
                  - generic [ref=f10e11958]: Global freight and logistics markets remained volatile during the first half of fiscal year 2026, with continued pressure on ocean, ground and specialized heavy-equipment transportation rates. While transportation availability improved relative to peak levels experienced in prior years, higher fuel prices, labor costs, and routing inefficiencies related to geopolitical conditions contributed to elevated logistics costs. In addition, on a selective basis we also incurred higher logistics costs in connection with expediting deliveries of materials and supplies by air carrier to manufacture, and deliver our Energy Server products to meet customer timelines.
                  - generic [ref=f10e11959]: Given the size, weight, and modular configuration of Bloom Energy Server systems and related balance‑of‑plant components, changes in freight pricing can meaningfully affect our cost of revenues and project-level margins, particularly for large multi-megawatt deployments and international shipments. We continue to pursue mitigation strategies including negotiating indexed freight arrangements where feasible, renegotiating air freight rates, optimizing factory-to-site routing, consolidating shipments, and increasing regional sourcing; however, there can be no assurance that such actions will fully offset future freight rate increases, especially in periods of elevated demand or fuel price volatility.
                  - generic [ref=f10e11960]: Supply Chain Update
                  - generic [ref=f10e11961]: Since the discussion of our supply chain contained in Part 1, Item 7, Management’s Discussion and Analysis of Financial Condition and Result of Operations, section Other Factors Affecting our Performance in our 2025 Form 10-K, although throughout 2026 there has been a general worldwide shortage of electronic components, we have continued to not experience significant component shortages, electronic or otherwise to date. Approaches we have taken as we continue to scale our manufacturing include supplier diversification and qualifying multiple suppliers for single or limited source components, enhancing our predictive analytics capabilities, and employing flexible sourcing strategies. As we continue to scale our business, we have been pro-active in working with our suppliers to ensure continued adequacy of supply while also maintaining our quality standards. Such strategies have included entering into long-term contracts, non-cancelable purchase orders and, in select cases, take-or-pay contracts where demand for such items is competitive and where components are highly dependent upon underlying scarce commodity items. We do not currently anticipate experiencing supply chain shortages which would impact our 2026 production forecast; however, we cannot give assurances as to potential future developments or their related impacts.
                  - generic [ref=f10e11962]: On July 8, 2026, a report was published by a short seller containing allegations regarding, among other things, our supply chain, including the sourcing and sufficiency of certain raw materials used in our products. As stated in our Current Report on Form 8-K furnished on July 9, 2026, we rejected the report’s conclusions regarding our supply chain, and we believe we have sufficient supply of the relevant raw materials to meet our current fuel cell demand and backlog. Publications of this nature, whether or not accurate, have resulted in significant volatility in the trading price of our common stock, and we cannot predict whether similar publications may occur in the future or their potential impacts. We have incurred, and may continue to incur, costs in connection with evaluating and responding to the report, and any related inquiries or demands could result in additional costs and divert management’s attention. See Part II, Item 1A, “Risk Factors.”
                  - generic [ref=f10e11963]: "40"
                  - separator [ref=f10e11966]
                  - generic [ref=f10e11969]: Continuing Impact of Tariffs
                  - generic [ref=f10e11970]: During the year ended December 31, 2025, pursuant to the International Emergency Economic Powers Act (“IEEPA”), the U.S. government announced significant additional tariffs on products imported from various countries, including countries where we source materials used in our Energy Server products. In February 2026, the U.S. Supreme Court ruled that certain tariffs imposed under the IEEPA were unlawful and required refunds of such tariffs collected, which refunds we are also separately pursuing. However, following the Supreme Court’s decision, the U.S. presidential administration invoked other laws to collect tariffs and announced new temporary ten percent tariffs on imports from all countries, in addition to any existing non-IEEPA tariffs. Following the expiration of such temporary tariffs, in late July 2026 the U.S. presidential administration imposed new tariffs of 10% to 12.5% targeting imports from approximately 60 economies which covers almost all U.S. imports. Certain materials which we require, such as imports of steel, aluminum, copper, and derivative metal products continue to be subject to their own separate tariff regime.
                  - generic [ref=f10e11971]: There remains uncertainty regarding the duration of existing and newly announced tariffs, potential changes or pauses to such tariffs, tariff levels, and whether additional tariffs or other retaliatory actions may be imposed, modified, or suspended. These and future changes in tariffs, trade policies, trade actions, or retaliatory trade measures in response, have resulted and may continue to result in additional costs and pricing pressures, supply chain disruptions, volatility in the demand for our Energy Server products, and increased economic or geopolitical risks, which could adversely impact our business, financial condition, and results of operations, materially or in ways that we cannot predict.
                  - generic [ref=f10e11972]: Commodity Pricing Volatility
                  - generic [ref=f10e11973]: Commodity input pricing remained an important factor affecting our cost structure during the first half of fiscal year 2026. Certain raw materials and components used in our fuel cell stacks, power electronics, structural assemblies, and balance‑of‑plant systems-including steel alloys, specialty metals, electronic components, natural gas‑linked inputs, and rare earth‑dependent materials experienced price fluctuations. While we do not generally purchase commodities directly at spot prices, supplier pricing may reflect changes in underlying commodity indices over time. Increases in commodity prices may not be immediately recoverable through customer pricing due to contractual arrangements, competitive dynamics, or fixed‑price project structures, creating potential margin pressure. We utilize supplier diversification, long‑term sourcing agreements, inventory planning, and selective contractual pass‑through mechanisms where available to mitigate commodity cost risks; however, sustained or rapid commodity price increases could adversely affect our results of operations.
                  - generic [ref=f10e11974]: Inflationary Pressures on Parts and Labor
                  - generic [ref=f10e11975]: Although headline inflation moderated compared to prior periods, inflationary pressures have continued to persist across several cost categories relevant to our business during the first half of fiscal year 2026, including certain electrical parts and components, labor, manufacturing and field installation services. Wage inflation in skilled manufacturing and technical field labor categories, coupled with higher costs for third‑party contractors, continued to exert upward pressure on our operating expenses and cost of revenues. In addition, increases in insurance, regulatory compliance, and professional services costs contributed to higher overhead compared to prior periods. General inflationary impacts on labor and services are passed on to us by our suppliers through increased prices for parts. We seek to manage inflationary impacts through productivity initiatives, automation, supplier negotiations, selective price adjustments, and ongoing cost‑reduction programs. However, the timing and extent of these mitigations may not fully align with the pace of cost increases, particularly in periods of rapid scale‑up or accelerated deployment schedules.
                  - generic [ref=f10e11976]: Developments with Respect to Installation of our Energy Server Products
                  - generic [ref=f10e11977]: Since the discussion of the delivery and installation of our Energy Server systems contained in our 2025 Form 10-K under Part II, Item 7-Management’s Discussion and Analysis of Financial Condition and Results of Operations, section Delivery and Installation, we have sought to evolve Bloom’s approach to installation to a consult only model, particularly for large load sites where we request our customers to utilize one of our certified third party installers for the equipment installation and project construction work and we operate as consultants to such certified installers as to Bloom Energy server products. Through its operating history, Bloom has developed working relationships with established engineering, procurement and construction (“EPC”) companies. We recently instituted a certified third-party installation program where we train these established EPC companies on the installation of our Energy Server product and then provide certification based on their proven installation capabilities as to our Energy Server. Purchasers of our Energy Server product are then able to select their preferred third-party EPC provider from our certified installer list, and negotiate and enter into installation agreements directly with the EPC company. Bloom is available to provide consulting services for the installation of its Energy Server product. Our preferred installation partners undergo a rigorous qualification process prior to selection based upon criteria such as experience
                  - generic [ref=f10e11978]: "41"
                  - separator [ref=f10e11981]
                  - generic [ref=f10e11984]: with Bloom’s product, other energy infrastructure installation experience, balance sheet, reputation, and safety record. Following selection, such EPC companies undergo extensive training on our Energy Server systems and its proper installation.
                  - generic [ref=f10e11985]: Increasing Opposition to Data Center Development
                  - generic [ref=f10e11986]: Opposition to data center development has been increasing. For example, in July 2026, the governor of New York state signed an executive order to create a moratorium on new hyperscale data centers that included temporarily pausing State environmental permits for up to one year in order to build a regulatory framework to address concerns which have been expressed by consumers and communities in the State related to matters such as utility rates and the environment. Prolonged and widespread opposition to data center development due to ratepayer impacts, environmental concerns, noise, and other expressed strains on local communities may have longer term adverse impacts on our business. In addition to potential direct impacts such as adversely affecting the size of this target market or causing project cancellations, additional indirect impacts may include (among other things) further increasing the sales and installation cycle, increasing the time, cost, expense, and complexity of obtaining required permits for the development, and reducing government support and incentives for such developments, any of which may also have adverse impacts on our business, financial condition, and operating results. Despite recent increasing opposition to data center development, demand for our Energy Server systems in connection with such developments has continued to be robust, particularly in light of our Energy Server’s near-zero criteria pollutants, low water usage and lower CO2 emissions than the combustion generation it displaces on the margin. In addition, installation of our islanded systems serving the power demands of the data center helps to insulate the local community from adverse effects on utility rates. We believe the release of a future regulatory framework in New York state or other jurisdictions could provide further competitive advantages to our Energy Server systems by further limiting the ability to use other traditional alternatives for power. The benefits of such data center developments utilizing our Energy Server systems which bring jobs, infrastructure, and other economic benefits need to be balanced against the identified concerns.
                  - generic [ref=f10e11987]: For additional information with respect of other factors affecting our performance, refer to Part I, Item 7, Management’s Discussion and Analysis of Financial Condition and Results of Operations, section Other Factors Affecting our Performance in our 2025 Form 10-K.
                  - generic [ref=f10e11988]: Sustainability
                  - generic [ref=f10e11989]: We are driven by the promise of our contribution to the transformation and decarbonization of energy and mobility sectors globally. We are committed to making our technology available across a growing list of applications including biogas, carbon capture, hydrogen, combined heat and power, and microgrid projects to increase sustainability. Our natural gas-based Energy Server systems are also an important source of near-term emission reductions.
                  - generic [ref=f10e11990]: In April 2026, we released our 2025 Impact Report, Built for AI. Designed for Communities (the “Impact Report”), our sixth dedicated report, using generally accepted sustainability frameworks and standards, including alignment with Sustainability Accounting Standards Board (“SASB”) standards and the Task Force on Climate-related Financial Disclosure (“TCFD”) recommendations. In addition, the report also mapped to select Global Reporting Initiative (“GRI”) disclosures and to the International Financial Reporting Standard (“IFRS”) S2 disclosure standard.
                  - generic [ref=f10e11991]: The Impact Report as well as an ESG policy and resource library can be found on our website at https://www.bloomenergy.com/sustainability. Website references throughout this document are provided for convenience only, and the content on the referenced websites is not incorporated by reference into this report.
