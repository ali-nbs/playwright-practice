                  - separator [ref=f10e12467]
                  - generic [ref=f10e12470]: Total Revenue
                  - generic [ref=f10e12471]: Total revenue increased by $664.1 million and $1.1 billion, or 165.5% and 149.8%, for the three and six months ended June 30, 2026, respectively, compared to the corresponding periods in the prior year. The increase was primarily driven by higher product revenue, which increased by $638.8 million and $1.1 billion, an increase in service revenue by $14.6 million and $22.9 million, and an increase in installation revenue by $13.6 million and $5.9 million, respectively. These increases were partially offset by decreases in electricity revenue of $2.9 million and $19.9 million for the three and six months ended June 30, 2026, respectively.
                  - generic [ref=f10e12472]: Product Revenue
                  - generic [ref=f10e12473]: Product revenue increased by $638.8 million and $1.1 billion, or 215.4% and 212.5%, for the three and six months ended June 30, 2026, respectively, compared to the corresponding periods in the prior year. The increase was primarily due to stronger demand for our power solutions to meet the time‑to‑power needs of a growing market, including a significant deployment for a large AI infrastructure customer and multiple projects executed through the joint venture with Brookfield.
                  - generic [ref=f10e12474]: Installation Revenue
                  - generic [ref=f10e12475]: Installation revenue increased by $13.6 million and $5.9 million, or 36.4% and 8.3%, for the three and six months ended June 30, 2026, respectively, compared to the corresponding periods in the prior year. The increase was driven by the timing of achieving key project milestones on sites requiring full Bloom installations. Depending on customer requirements, Bloom may provide a full-scope installation solution, which results in higher installation revenue, or the customer may engage a third-party installation partner, resulting in lower installation revenue for Bloom. Installation revenue may vary based on several factors, including the scope of installation services provided by Bloom, customer and project mix, the economics of underlying projects, and the timing of milestone execution.
                  - generic [ref=f10e12476]: Service Revenue
                  - generic [ref=f10e12477]: Service revenue increased by $14.6 million and $22.9 million, or 26.8% and 21.2%, for the three and six months ended June 30, 2026, respectively, compared to the corresponding periods in the prior year. The increase was primarily attributable to higher revenue from maintenance contracts associated with our fleet of Energy Server systems, which contributed $17.3 million and $26.7 million for the three and six months ended June 30, 2026, respectively. This increase was partially offset by higher product performance guarantee costs of $3.0 million and $4.6 million for the same periods.
                  - generic [ref=f10e12478]: Electricity Revenue
                  - generic [ref=f10e12479]: Electricity revenue includes both revenue from contracts with customers and revenue from contracts that contain leases.
                  - generic [ref=f10e12480]: Electricity revenue decreased by $2.9 million and $19.9 million, or 22.3% and 50.1%, for the three and six months ended June 30, 2026, respectively, compared to the corresponding periods in the prior year. The decrease for the three months ended June 30, 2026, was primarily due to lower straight-line electricity revenue resulting from repowering of certain Managed Services related sites. The decrease for the six months ended June 30, 2026, was predominantly due to a one-time settlement of a customer contract after redeploying assets for our partner in the first quarter of fiscal year 2025, as well as lower straight-line electricity revenue resulting from repowering of certain Managed Services related sites.
