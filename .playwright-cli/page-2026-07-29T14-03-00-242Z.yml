                  - generic [ref=f10e12124]: Investing Activities
                  - generic [ref=f10e12125]: Our investing activities have consisted of capital expenditures, including investments to increase our production capacity, and investments in unconsolidated affiliates. Cash used in investing activities during the six months ended June 30, 2026, was $100.5 million, an increase of $79.1 million compared to the prior year period. The increase was primarily due to a $22.8 million investment in the joint ventures between the Company and Brookfield (see Part I, Item 1, Note 7-Investments in Unconsolidated Affiliates in this Quarterly Report on Form 10-Q), and a $56.3 million increase in expenditures on tenant improvements for a leased engineering and manufacturing facility in Fremont, California, which opened in July 2022. We expect to continue to make capital investments to expand production capacity at our manufacturing facilities in Fremont, California and Delmarva, Delaware. These investments, which include the purchase of new equipment and tenant improvements, are part of our strategic plan to continually increase capacity to meet orders and customer deliver requirements. The magnitude and timing of these capital expenditures will depend on implementation milestones, supplier lead times, and customer demand. We intend to fund these capital expenditures from cash on hand as well as cash flow expected to be generated from operations. We may also evaluate and arrange equipment lease financing to fund these capital expenditures.
