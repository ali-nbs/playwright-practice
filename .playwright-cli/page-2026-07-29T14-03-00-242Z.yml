                  - generic [ref=f10e13284]: Total Operating Expenses
                  - generic [ref=f10e13285]: Total operating expenses increased by $62.7 million and $108.3 million for the three and six months ended June 30, 2026, respectively, compared to the corresponding periods in the prior year. The increases were primarily attributable to higher employee compensation and benefits expense, including increased stock-based compensation, which contributed $40.1 million and $68.9 million of the increase for the three- and six-month periods, respectively. Total operating expenses also increased due to higher consulting, advisory, and other professional services costs of $10.7 million and $19.2 million, respectively, primarily related to third-party engineering, certification, and regulatory support for the scaling of our solid oxide platforms and AI data center power programs. The remaining increase was primarily attributable to higher research and development support costs, information technology expenses, travel and entertainment expenses, and facilities-related costs.
                  - generic [ref=f10e13286]: Research and Development
                  - generic [ref=f10e13287]: Research and development expenses increased by $18.1 million and $34.3 million for the three and six months ended June 30, 2026, respectively, compared to the corresponding periods in the prior year. The increases were primarily attributable to higher employee compensation and benefits expense, including increased stock-based compensation, which contributed $11.1 million and $20.7 million of the increase for the three- and six-month periods, respectively. Research and development expenses also increased due to higher consumable laboratory supplies and other laboratory-related costs of $3.6 million and $9.2 million, respectively, reflecting expanded research activities. In addition, consulting, advisory, and other professional services costs increased by $1.5 million and $1.9 million, respectively, primarily driven by third-party engineering, certification, and regulatory support related to the scaling of our solid oxide platforms and AI data center power programs.
                  - generic [ref=f10e13288]: Sales and Marketing
                  - generic [ref=f10e13289]: Sales and marketing expenses increased by $19.0 million and $35.2 million for the three and six months ended June 30, 2026, respectively, compared to the corresponding periods in the prior year. The increases were primarily attributable to higher employee compensation and benefits expense, including increased stock-based compensation, which contributed $12.4 million and $23.5 million of the increase for the three- and six-month periods, respectively. Sales and marketing expenses also increased due to higher consulting, advisory, and other professional services costs of $5.5 million and $9.6 million, respectively, primarily related to efforts to expand our portfolio of AI data center power programs.
                  - generic [ref=f10e13290]: General and Administrative
                  - generic [ref=f10e13291]: General and administrative expenses increased by $25.6 million and $38.8 million for the three and six months ended June 30, 2026, respectively, compared to the corresponding periods in the prior year. The increases were primarily attributable to higher employee compensation and benefits expense, including increased stock-based compensation, which contributed
                  - generic [ref=f10e13292]: "50"
                  - separator [ref=f10e13295]
                  - generic [ref=f10e13298]: $16.5 million and $24.7 million of the increase for the three- and six-month periods, respectively. General and administrative expenses also increased due to higher consulting, advisory, and other professional services costs of $3.7 million and $7.7 million, respectively, primarily reflecting increased external legal and related professional services. In addition, computer equipment costs increased by $2.6 million and $4.5 million for the three- and six-month periods, respectively, driven by higher spending on hardware and software maintenance. For the six months ended June 30, 2026, facilities costs increased by $2.9 million, primarily due to higher rental costs. Overall increase for the six months ended June 30, 2026 was partially offset by a decrease in other operating expenses of $3.4 million.
