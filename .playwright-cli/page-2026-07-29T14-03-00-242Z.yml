                  - generic [ref=f10e12736]: Total Cost of Revenue
                  - generic [ref=f10e12737]: Total cost of revenue increased by $415.7 million and $703.9 million, or 141.3% and 132.4%, for the three and six months ended June 30, 2026, respectively, compared to the corresponding periods in the prior year. The increase was primarily driven by higher cost of product revenue, which increased by $395.2 million and $684.9 million, an increase in installation cost of revenue by $14.6 million and $16.4 million, and an increase in service cost revenue by $6.7 million and $7.5 million, respectively. These increases were partially offset by decreases in electricity cost of revenue of $0.9 million and $4.9 million for the three and six months ended June 30, 2026, respectively.
                  - generic [ref=f10e12738]: Cost of Product Revenue
                  - generic [ref=f10e12739]: Cost of product revenue increased by $395.2 million and $684.9 million, or 198.9% and 202.4%, for the three and six months ended June 30, 2026, respectively, compared to the corresponding periods in the prior year. Product costs increased primarily due to higher sales volumes driven by increased demand for our power solutions, an increase in product warranty, and an increase in stock-based compensation. The increase was partially offset by (i) lower material, labor, and overhead costs resulting from ongoing manufacturing efficiency improvements and increased automation and (ii) the recognition of a $37.4 million recovery of previously paid import tariffs during the period.
                  - generic [ref=f10e12740]: Cost of Installation Revenue
                  - generic [ref=f10e12741]: Cost of installation revenue increased by $14.6 million and $16.4 million, or 38.2% and 22.9%, for the three and six months ended June 30, 2026, respectively, compared to the corresponding periods in the prior year. The increase was driven by the timing of achieving key project milestones on sites requiring full Bloom installations. Depending on customer requirements, Bloom may provide a full-scope installation solution, which results in higher installation costs, or the customer may engage a third-party installation partner, resulting in lower installation costs for Bloom. Installation costs may vary based on several factors, including the scope of installation services provided by Bloom, customer and project mix, the economics of underlying projects, and the timing of milestone execution.
                  - generic [ref=f10e12742]: Cost of Service Revenue
                  - generic [ref=f10e12743]: Cost of service revenue increased by $6.7 million and $7.5 million, or 13.6% and 7.4%, for the three and six months ended June 30, 2026, respectively. The increase for the three months ended June 30, 2026, was primarily attributable to higher deployment of field replacement units, which increased costs by $1.1 million, and increased maintenance expenses of $0.9 million, partially offset by cost reduction initiatives associated with fleet optimization efforts. The increase for the six months ended June 30, 2026, was primarily attributable to increased maintenance expenses of $1.0 million, partially offset by a $2.1 million reduction in costs from lower deployment of field replacement units and our cost reduction efforts to manage fleet optimizations.
                  - generic [ref=f10e12744]: Cost of Electricity Revenue
                  - generic [ref=f10e12745]: Cost of electricity revenue includes both cost of revenue from contracts with customers and cost of revenue from contracts that contain leases.
                  - generic [ref=f10e12746]: Cost of electricity revenue decreased by $0.9 million and $4.9 million, or 11.4% and 25.5%, for the three and six months ended June 30, 2026, respectively, compared to the corresponding periods in the prior year. The decrease for the three months ended June 30, 2026, was primarily due to the reduction in the number of installed units. The decrease for the six months ended June 30, 2026, was mainly due to (i) redeploying assets for our partner to enable a one-time settlement of a customer contract in the first quarter of fiscal year 2025, and (ii) the reduction in the number of installed units.
