                      - text: The Company and Brookfield Asset Management (“Brookfield”) have entered into joint venture structures which are housed in an AI Infrastructure Fund created by Brookfield (the “AI Fund”). For details, see Part II, Item 8, Note 7-Investments in Unconsolidated Affiliates
                      - generic [ref=f10e6995]:
