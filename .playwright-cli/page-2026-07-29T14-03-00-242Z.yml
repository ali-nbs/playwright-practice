                  - generic [ref=f10e12003]: As of June 30, 2026, and December 31, 2025, we had $2,475.4 million and $2,613.7 million of recourse debt, $2.6 million and $4.2 million of non-recourse debt, and $9.2 million and $10.0 million of other long-term liabilities, respectively. As of June 30, 2026, and December 31, 2025, $7.3 million and $4.2 million of our debt were classified as short-term, respectively, and $2,470.7 million and $2,613.7 million of our debt were classified as long-term, respectively. For a complete description of our outstanding debt, please see Part I, Item 1, Note 8-Outstanding Loans and Security Agreements in this Quarterly Report on Form 10-Q.
                  - generic [ref=f10e12004]: Capital Markets Activity
                  - generic [ref=f10e12005]: In October 2025, in connection with our partnership with Oracle to provide on-site solid state power for AI data centers, subject to the negotiation of a warrant mutually acceptable to us and Oracle, we agreed to issue to Oracle a warrant (the “Warrant”) to purchase up to an aggregate of 3,531,073 shares of our common stock, with an exercise price of $113.28 per share, which was the closing market price of our common stock on October 28, 2025. We and Oracle agreed that (i) the expiration date of the Warrant would be six (6) months from the date of the issuance of the Warrant, (ii) the Warrant would include customary anti-dilution adjustments, transfer restrictions and exercise procedures, and (iii) the Warrant would not entitle the holder to any voting rights, dividends or other rights as a stockholder of the Company prior to the exercise and settlement of the Warrant. The Warrant and the shares underlying the Warrant were expected to be issued in reliance on the exemption from registration pursuant to Section 4(a)(2) of the Securities Act of 1933, as amended.
                  - generic [ref=f10e12007]: On April 9, 2026, we issued the Warrant pursuant to the previously disclosed strategic partnership agreement with Oracle. The Warrant was fully vested upon issuance, immediately exercisable in whole or in part, at any time during six months from the grant date. On May 1, 2026, Oracle performed a cashless exercise of the Warrant. As a result of the cashless exercise, we issued 1,905,433 shares of our common stock on a net basis. Under the terms of the warrant agreement, Oracle could elect either net or gross settlement. Because net settlement would result in 1.4 million fewer shares being issued than a gross settlement, we agreed to issue Oracle an additional 248,798 shares of common stock as an inducement for Oracle to elect net settlement. These incremental shares represented additional consideration with a fair value of $72.3 million.
                  - generic [ref=f10e12008]: Revolving Credit Facility
                  - generic [ref=f10e12009]: For information on a senior secured multicurrency revolving credit facility (the “Revolving Credit Facility”) which we entered into on December 19, 2025, see Part II, Item 8, Note 8-Outstanding Loans and Security Agreements, section Revolving Credit Facility in our 2025 Form 10-K. As of June 30, 2026, and December 31, 2025, no amounts were drawn under the Revolving Credit Facility. As of June 30, 2026, the $90.0 million letter of credit sub-facility under our Revolving Credit Facility was fully utilized, reducing our available borrowing capacity to $510.0 million.
                  - generic [ref=f10e12010]: Near-Term Liquidity Outlook and Financing Flexibility
                  - generic [ref=f10e12011]: The combination of our cash and cash equivalents and cash flow expected to be generated by our operations is expected to be sufficient to meet our anticipated cash flow needs for at least the next 12 months. If these sources of cash are insufficient or not received in a timely manner to meet our near-term or future liquidity needs, we may require additional equity or debt financing to fund our operations, manufacturing capacity, product development, and market expansion initiatives, as well as to respond to competitive pressures or strategic opportunities. We may, from time to time, engage in a variety of financing transactions for such purposes, including factoring our accounts receivable. There were no factoring arrangements during the three and six months ended June 30, 2026 and 2025. We may not be able to secure timely additional financing on favorable terms, or at all. The terms of any additional financing may limit our financial and operational flexibility. Although we currently do not have any floating-rate notes on our balance sheet, our overall cost of capital may increase if interest rates rise and we refinance our fixed-rate convertible notes. If we raise additional funds through the issuance of equity or equity-linked securities, our existing stockholders could experience dilution in their ownership percentage, and any new securities may have rights, preferences, and privileges senior to those of our common stock.
                  - generic [ref=f10e12012]: Future Capital Requirements
                  - generic [ref=f10e12013]: Our future capital requirements depend on a variety of factors, including our rate of revenue growth; the timing and extent of spending on research and development and other business initiatives; increases in our manufacturing capacity; the pace and volume of system builds; the need for additional working capital; the expansion of our sales and marketing activities in both domestic and international markets; market acceptance of our products; selling models and vehicles required by customers; our ability to secure financing for customer use of our products; the timing of installations and related inventory build in anticipation of future sales; and overall economic conditions. In order to support and achieve our future growth plans, we may need or seek advantageously to obtain additional funding through equity or debt financing. Failure to obtain this
