                    - generic [ref=f10e4387]:
                      - generic [ref=f10e4388]:
                        - text: In December 2025, the FASB issued
                        - generic [ref=f10e4389] [cursor=pointer]: ASU 2025-10
                      - text: ", Government Grants"
                      - generic [ref=f10e4390]:
                        - text: (
                        - generic [ref=f10e4391] [cursor=pointer]: Topic 832
                      - text: "): Accounting for Government Grants Received by Business Entities"
                      - generic [ref=f10e4392]:
                        - text: (“
                        - generic [ref=f10e4393] [cursor=pointer]: ASU 2025-10
                      - text: ”). This update provides authoritative guidance on the recognition, measurement, and presentation of government grants received by business entities, an area previously lacking in U.S. GAAP. The amendments define government grants, establish recognition criteria, and require disclosures about the nature of grants, accounting policies applied, and significant terms and conditions. The amendments are effective for public business entities for annual periods beginning after December 15, 2028, with early adoption permitted. We elected to early adopt this standard as of January 1, 2026 (the beginning of our 2026 annual reporting period), using the modified prospective basis. We made an accounting policy election to account for nonrefundable, transferable tax credits related to assets as a government grant and present the credit separately as deferred income. The deferred income is amortized into Other Income, net over the useful life of the asset generating such credits. Consistent with this election, we account for the transferable tax credits generated from our investments in unconsolidated affiliates as part of our overall equity method pickup consistent with all other items of income or loss reported in the unconsolidated affiliates’ financial statements. To the extent that the accounting policy for transferable tax credits is different from the unconsolidated affiliates, we will recast the unconsolidated affiliates’ financial statements when calculating our equity method income or loss. There were no material impacts to our reported financial position, results of operations, or cash flows resulting from the adoption of this new accounting pronouncement. This standard has no impact on any prior periods presented in our condensed consolidated financial statements.
