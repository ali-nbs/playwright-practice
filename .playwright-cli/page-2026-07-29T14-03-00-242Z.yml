                  - generic [ref=f10e14120]: Net income attributable to noncontrolling interests is the result of allocating profits and losses to noncontrolling interests under the hypothetical liquidation at book value (“HLBV”) method. HLBV is a balance sheet-oriented approach for applying the equity method of accounting when there is a complex structure, such as consolidation of a variable interest entity (“VIE”).
                  - generic [ref=f10e14121]: Net income attributable to noncontrolling interests for the three and six months ended June 30, 2026, compared to the same periods in the prior year, increased by $2.1 million and $4.8 million due to an increase in income allocated to our noncontrolling interest related to Korean JV, our consolidated VIE.
                  - generic [ref=f10e14122]: Critical Accounting Policies and Estimates
                  - generic [ref=f10e14123]: The condensed consolidated financial statements have been prepared in accordance with generally accepted accounting principles as applied in the United States (“U.S. GAAP”). The preparation of the condensed consolidated financial statements requires us to make estimates and assumptions that affect the reported amounts of assets, liabilities, revenues, costs and expenses and related disclosures. Our discussion and analysis of our financial results under Results of Operations above are based on our results of operations, which we have prepared in accordance with U.S. GAAP. In preparing these condensed consolidated financial statements, we make assumptions, judgments and estimates that can affect the reported amounts of assets, liabilities, revenues and expenses, and net income. On an ongoing basis, we base our estimates on historical experience, as appropriate, and on various other assumptions that we believe to be reasonable under the circumstances. Changes in the accounting estimates are representative of estimation uncertainty and are reasonably likely to occur from period to period. Accordingly, actual results could differ significantly from the estimates made by our management. We evaluate our estimates and assumptions on an ongoing basis. To the extent that there are material differences between these estimates and actual results, our future financial statement presentation, financial condition, results of operations and cash flows will be affected. We believe that the following critical accounting policies involve a greater degree of judgment and complexity than our other accounting policies. Accordingly, these are the policies we believe are the most critical to understanding and evaluating the consolidated financial condition and results of operations.
                  - generic [ref=f10e14124]: "The accounting policies that most frequently require us to make assumptions, judgments and estimates, and therefore are critical to understanding our results of operations, include:"
                  - generic [ref=f10e14125]: •Revenue Recognition;
                  - generic [ref=f10e14126]: •Income Taxes; and
                  - generic [ref=f10e14127]: •Principles of Consolidation.
