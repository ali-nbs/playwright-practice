                  - generic [ref=f10e14197]: On May 22, 2026, Ms. Shawn Soderberg, our Chief Legal Officer and Corporate Secretary, modified a Rule 10b5-1 trading arrangement previously adopted on November 26, 2025. The modification provides for potential exercise and sale of up to 94,754 vested stock options, subject to certain conditions, and sale of sufficient vesting restricted stock units to satisfy withholding tax obligations and other vested restricted stock units subject to certain conditions. Such trading plan, as modified, continues to have an expiration date of February 26, 2027 (or such earlier date upon which all transactions contemplated thereunder are completed).
