                  - generic [ref=f10e14137]: ITEM 3-QUANTITATIVE AND QUALITATIVE DISCLOSURES ABOUT MARKET RISK
                  - generic [ref=f10e14139]: There were no significant changes to our quantitative and qualitative disclosures about market risk during the six months ended June 30, 2026. Please refer to Part II, Item 7A, Quantitative and Qualitative Disclosures about Market Risk included in our 2025 Form 10-K for a more complete discussion of the market risks we consider.
                  - generic [ref=f10e14141]: ITEM 4-CONTROLS AND PROCEDURES
                  - generic [ref=f10e14143]: Evaluation of Disclosure Controls and Procedures
                  - generic [ref=f10e14144]: We maintain disclosure controls and procedures that are designed to ensure that information required to be disclosed in our reports that we file or submit under the Exchange Act, is recorded, processed, summarized and reported within the time periods specified in SEC rules and forms, and that such information is accumulated and communicated to our management, including our Chief Executive Officer (our principal executive officer) and Chief Financial Officer (our principal financial officer) as appropriate, to allow for timely decisions regarding required disclosure.
                  - generic [ref=f10e14146]: Our management, with the participation of our Chief Executive Officer and Chief Financial Officer, has evaluated the effectiveness of our disclosure controls and procedures (as defined in Rules 13a-15(e) and 15d-15(e) under the Exchange Act), as of June 30, 2026. Based on such evaluation, our Chief Executive Officer and Chief Financial Officer have concluded that as of June 30, 2026, our disclosure controls and procedures were effective.
                  - generic [ref=f10e14148]: Changes in Internal Control over Financial Reporting
                  - generic [ref=f10e14149]: During the three months ended June 30, 2026, there were no changes in our internal control over financial reporting, which were identified in connection with management’s evaluation required by paragraphs (d) of Rules 13a-15 and 15d-15 under the Exchange Act, that have materially affected, or are reasonably likely to materially affect, our internal control over financial reporting.
                  - generic [ref=f10e14151]: For further information on inherent limitations on effectiveness of internal controls and management’s report on internal control over financial reporting, see Part II, Item 9A, Controls and Procedures in our 2025 Form 10-K.
