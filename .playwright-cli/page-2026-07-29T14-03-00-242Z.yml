                  - generic [ref=f10e12234]: Financing Partners
                  - generic [ref=f10e12235]: For information about our financing partners, see Part II, Item 7-Management’s Discussion and Analysis of Financial Condition and Results of Operations, section Purchase and Financing Options, sub-section Financing Partners in our 2025 Form 10-K.
                  - generic [ref=f10e12236]: Delivery and Installation
                  - generic [ref=f10e12237]: For information on delivery and installation of our Energy Server systems, see Part II, Item 7-Management’s Discussion and Analysis of Financial Condition and Results of Operations, section Delivery and Installation in our 2025 Form 10-K.
                  - generic [ref=f10e12238]: Since the discussion of the delivery and installation in our 2025 Form 10-K, we have sought to evolve our approach to installation to a consult only model, particularly for large load sites where we request our customers to utilize one of our certified third party installers for the equipment installation and project construction work and we operate as consultants to such certified installers as to Bloom Energy Server Product. See Part I, Item 2, section Developments With Respect to Factors Affecting Our Performance, subsection Developments with Respect to Installation of our Energy Server Products in this Quarterly Report on Form 10-Q for additional information.
                  - generic [ref=f10e12239]: Performance Guarantees
                  - generic [ref=f10e12240]: As of June 30, 2026, and December 31, 2025, we had incurred no liabilities due to failure to repair or replace the Energy Server systems pursuant to any performance warranties made under the O&M Agreements (“O&M Agreements”).
                  - generic [ref=f10e12241]: For the O&M Agreements that are subject to renewal, our future service revenue from such agreements are subject to our obligations to make payments for underperformance against the performance guaranties, which are capped at an aggregate total of approximately $846.1 million (including $473.2 million related to portfolio financing entities and $372.9 million related to all other transactions, and include payments for both low output and low efficiency) and our aggregate remaining potential payment related to these underperformance obligations was approximately $468.9 million as of June 30, 2026. For the three and six months ended June 30, 2026, we made performance guarantee payments of $5.4 million and $13.8 million, respectively. For the three and six months ended June 30, 2025, we made performance guarantee payments of $3.0 million and $14.6 million, respectively.
                  - generic [ref=f10e12242]: International Channel Partners
                  - generic [ref=f10e12243]: There were no significant changes in our international channel partners during the three and six months ended June 30, 2026. For information on international channel partners, see Part II, Item 7-Management’s Discussion and Analysis of Financial Condition and Results of Operations, section International Channel Partners in our 2025 Form 10-K.
